<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kick Activity Feed</title>
<style>
  :root{
    --bg: #0e0f13;
    --panel: rgba(255,255,255,.04);
    --line: rgba(255,255,255,.08);
    --txt: #e8eaee;
    --dim: #9aa1ad;
    --kick: #53fc18;
    --c-follow: #53fc18;
    --c-sub:    #ffd93d;
    --c-gift:   #ff6bd6;
    --c-kicks:  #00c2ff;
    --c-tip:    #2ee6c5;
    --c-reward: #b388ff;
    --c-host:   #ff9f1c;
    --c-live:   #53fc18;
    --c-mod:    #ff5d5d;
    --c-chat:   #8f97a3;
    --row: 15px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    margin:0;background:var(--bg);color:var(--txt);
    font-family:"Inter","Segoe UI",Roboto,system-ui,-apple-system,sans-serif;
    font-size:var(--row);overflow:hidden;display:flex;flex-direction:column;
  }
  body.transparent{background:transparent}
  body.transparent .item{background:transparent}
  body.transparent .item .line{text-shadow:0 1px 3px rgba(0,0,0,.95),0 0 8px rgba(0,0,0,.7)}

  /* ---------- barra superior ---------- */
  #bar{
    flex:0 0 auto;display:flex;align-items:center;gap:8px;
    padding:7px 10px;border-bottom:1px solid var(--line);
    background:rgba(0,0,0,.35);font-size:12px;color:var(--dim);
  }
  body.nobar #bar{display:none}
  #dot{width:8px;height:8px;border-radius:50%;background:#ff5d5d;flex:0 0 auto;transition:background .3s}
  #dot.on{background:var(--kick);box-shadow:0 0 8px var(--kick)}
  #who{color:var(--txt);font-weight:600}
  #stats{margin-left:auto;display:flex;gap:8px;align-items:center}
  .pill{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:2px 9px;white-space:nowrap}
  .btn{cursor:pointer;padding:3px 7px;border-radius:7px;user-select:none;border:1px solid var(--line);background:transparent;color:var(--dim);font-size:13px}
  .btn:active{background:var(--panel)}
  .btn.on{color:var(--txt);border-color:rgba(255,255,255,.28)}

  /* ---------- panel de ajustes ---------- */
  #filters{display:none;flex-wrap:wrap;gap:6px;padding:8px 10px;
           border-bottom:1px solid var(--line);background:rgba(0,0,0,.45)}
  #filters.open{display:flex}
  .chip{font-size:12px;padding:4px 10px;border-radius:20px;cursor:pointer;
        border:1px solid var(--line);background:transparent;color:var(--dim)}
  .chip.on{background:var(--panel);color:var(--txt);border-color:rgba(255,255,255,.25)}
  .chip.wide{width:100%;text-align:left}

  /* ---------- alerta repetida ---------- */
  #replay{
    position:fixed;left:0;right:0;top:0;z-index:20;display:none;
    padding:16px 14px;background:linear-gradient(180deg,#15171d 0%,rgba(21,23,29,.96) 100%);
    border-bottom:2px solid var(--kick);box-shadow:0 8px 30px rgba(0,0,0,.6);
    animation:drop .3s cubic-bezier(.2,.9,.3,1.2);
  }
  #replay.show{display:block}
  @keyframes drop{from{transform:translateY(-100%);opacity:0}to{transform:none;opacity:1}}
  #replay .tag{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin-bottom:6px}
  #replay .big{font-size:1.5em;line-height:1.25;font-weight:600;word-wrap:break-word;overflow-wrap:anywhere}
  #replay .big .name{font-weight:800}
  #replay .small{margin-top:6px;color:var(--dim);font-size:.95em;word-wrap:break-word;overflow-wrap:anywhere}
  #replay .close{position:absolute;top:8px;right:10px;color:var(--dim);font-size:20px;
                 cursor:pointer;padding:2px 8px;line-height:1}
  #replay .bar{position:absolute;left:0;bottom:0;height:3px;background:var(--kick);width:100%}
  #replay.show .bar{animation:drain var(--dur,7s) linear forwards}
  @keyframes drain{from{width:100%}to{width:0}}

  /* ---------- feed ---------- */
  #feed{flex:1 1 auto;overflow-y:auto;overflow-x:hidden;padding:6px 0 14px;scrollbar-width:thin}
  #feed::-webkit-scrollbar{width:5px}
  #feed::-webkit-scrollbar-thumb{background:rgba(255,255,255,.15);border-radius:3px}

  .item{display:flex;gap:9px;align-items:flex-start;padding:8px 11px;
        border-bottom:1px solid var(--line);animation:in .28s ease-out;cursor:pointer}
  @keyframes in{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
  .item.flash{animation:flash 1.1s ease-out}
  @keyframes flash{0%{background:rgba(83,252,24,.28)}100%{background:transparent}}
  .item.done{opacity:.42}
  .item .ic{flex:0 0 auto;width:22px;height:22px;border-radius:6px;
            display:grid;place-items:center;font-size:12px;font-weight:700;background:rgba(255,255,255,.06)}
  .item .body{flex:1 1 auto;min-width:0}
  .item .line{line-height:1.35;word-wrap:break-word;overflow-wrap:anywhere}
  .item .name{font-weight:700}
  .item .sub{display:block;color:var(--dim);font-size:.82em;margin-top:2px;
             word-wrap:break-word;overflow-wrap:anywhere}
  .item .right{flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
  .item .t{color:var(--dim);font-size:.75em;font-variant-numeric:tabular-nums}
  body.notime .item .t{display:none}
  .item .ok{border:1px solid var(--line);border-radius:6px;color:var(--dim);
            font-size:12px;padding:1px 7px;line-height:1.5}
  .item.done .ok{color:var(--kick);border-color:rgba(83,252,24,.4)}
  .item img.em{height:1.25em;vertical-align:-.25em}

  .follow .ic{color:var(--c-follow)} .follow .name{color:var(--c-follow)}
  .sub    .ic{color:var(--c-sub)}    .sub .name{color:var(--c-sub)}
  .gift   .ic{color:var(--c-gift)}   .gift .name{color:var(--c-gift)}
  .kicks  .ic{color:var(--c-kicks)}  .kicks .name{color:var(--c-kicks)}
  .tip    .ic{color:var(--c-tip)}    .tip .name{color:var(--c-tip)}
  .tip .line{font-weight:600}
  .reward .ic{color:var(--c-reward)} .reward .name{color:var(--c-reward)}
  .host   .ic{color:var(--c-host)}   .host .name{color:var(--c-host)}
  .live   .ic{color:var(--c-live)}   .live .name{color:var(--c-live)}
  .mod    .ic{color:var(--c-mod)}    .mod .name{color:var(--c-mod)}
  .chat   .ic{color:var(--c-chat)}   .chat .name{color:#cfd4dc}
  .sys    .ic{color:var(--dim)}      .sys .line{color:var(--dim);font-size:.9em}

  /* ---------- panel de Botrix ---------- */
  #bx{flex:0 0 auto;display:none;flex-direction:column;border-top:2px solid var(--line);background:#0a0b0e}
  #bx.show{display:flex}
  #bxHead{display:flex;align-items:center;gap:8px;padding:5px 10px;font-size:11px;
          letter-spacing:.1em;text-transform:uppercase;color:var(--dim);background:rgba(255,255,255,.03)}
  #bxHead .x{margin-left:auto;cursor:pointer;padding:0 6px;font-size:15px}
  #bx iframe{width:100%;border:0;flex:1 1 auto;background:transparent}

  #empty{padding:26px 16px;text-align:center;color:var(--dim);font-size:13px;line-height:1.6}
  #empty b{color:var(--txt)}
  #test{position:fixed;right:10px;bottom:10px;z-index:9;display:none;
        background:var(--panel);border:1px solid var(--line);color:var(--txt);
        border-radius:10px;padding:8px 12px;font-size:13px;cursor:pointer}
  body.testmode #test{display:block}
</style>
</head>
<body>

<div id="replay">
  <span class="close" id="replayClose">×</span>
  <div class="tag">Repetición</div>
  <div class="big" id="replayBig"></div>
  <div class="small" id="replaySmall"></div>
  <div class="bar"></div>
</div>

<div id="bar">
  <span id="dot"></span>
  <span id="who">…</span>
  <span id="stats">
    <span class="pill" id="pFollowers">— seguidores</span>
    <button class="btn" id="bxBtn" title="Panel de Botrix" style="display:none">💠</button>
    <button class="btn" id="snd" title="Sonido">🔊</button>
    <button class="btn" id="gear" title="Ajustes">⚙</button>
  </span>
</div>

<div id="filters"></div>

<div id="feed">
  <div id="empty">
    Escuchando el canal de <b id="emptySlug">Kick</b>…<br>
    Toca cualquier evento para <b>repetir la alerta</b>.<br><br>
    <span style="opacity:.7">El punto verde de arriba significa que ya está conectado.<br>
    Solo registra lo que pasa mientras esta página está abierta.</span>
  </div>
</div>

<div id="bx">
  <div id="bxHead"><span>Botrix — tips</span><span class="x" id="bxClose">×</span></div>
</div>

<button id="test">Evento de prueba</button>

<script>
(function(){
  "use strict";

  /* ============================================================
     CONFIGURACIÓN  (todo se puede cambiar por la URL)
       ?channel=mariotq
       ?chatroom=6635680&channelid=6692133
       ?bg=transparent  ?bar=0  ?time=0  ?font=18  ?max=60
       ?vol=0.8         volumen de las repeticiones (0 a 1)
       ?livesound=1     que los eventos EN VIVO también suenen
                        (apagado por defecto para no encimarse con Botrix)
       ?dur=7           segundos que dura la repetición en pantalla
       ?keep=0          no guardar el historial entre reinicios
       ?debug=1         imprime en consola todos los eventos crudos
       ?test=1          botón para inyectar eventos falsos
     ============================================================ */
  var Q = new URLSearchParams(location.search);
  var CFG = {
    slug:       (Q.get('channel') || Q.get('slug') || 'mariotq').toLowerCase().trim(),
    chatroomId:  Q.get('chatroom')  || '6635680',
    channelId:   Q.get('channelid') || '6692133',
    max:    parseInt(Q.get('max')  || '300', 10),
    dur:  parseFloat(Q.get('dur')  || '7') * 1000,
    vol:  parseFloat(Q.get('vol')  || '0.8'),
    bg:         (Q.get('bg') || 'dark').toLowerCase(),
    bar:         Q.get('bar')  !== '0',
    time:        Q.get('time') !== '0',
    keep:        Q.get('keep') !== '0',
    liveSound:   Q.get('livesound') === '1',
    tipBots:    (Q.get('tipbot') || 'botrix,botrixbot,botrix_bot,tq_bot_irl')
                  .toLowerCase().split(',').map(function(s){return s.trim();}).filter(Boolean),
    tipAll:      Q.get('tipall') === '1',
    // Acepta la URL de Botrix codificada o pegada tal cual al final.
    botrix: (function(){
      var raw = location.search.match(/[?&]botrix=(.*)$/);
      if (raw && /^https?(:|%3A)/i.test(raw[1])) {
        var v = raw[1];
        try { if (/%3A|%2F/i.test(v)) v = decodeURIComponent(v); } catch(e){}
        return v;
      }
      return Q.get('botrix') || '';
    })(),
    botrixH: parseInt(Q.get('botrixh') || '45', 10),
    debug:       Q.get('debug') === '1',
    test:        Q.get('test')  === '1',
    font:        Q.get('font')  || ''
  };
  if (CFG.slug !== 'mariotq' && !Q.get('chatroom')) { CFG.chatroomId=''; CFG.channelId=''; }

  if (CFG.bg === 'transparent' || CFG.bg === 'none') document.body.classList.add('transparent');
  if (!CFG.bar)  document.body.classList.add('nobar');
  if (!CFG.time) document.body.classList.add('notime');
  if (CFG.test)  document.body.classList.add('testmode');
  if (CFG.font)  document.documentElement.style.setProperty('--row', parseInt(CFG.font,10)+'px');

  var $feed=document.getElementById('feed'), $empty=document.getElementById('empty'),
      $dot=document.getElementById('dot'), $fol=document.getElementById('pFollowers'),
      $filt=document.getElementById('filters'), $snd=document.getElementById('snd'),
      $rep=document.getElementById('replay'), $repBig=document.getElementById('replayBig'),
      $repSmall=document.getElementById('replaySmall');
  document.getElementById('emptySlug').textContent = CFG.slug;
  document.getElementById('who').textContent = CFG.slug;
  $rep.style.setProperty('--dur', (CFG.dur/1000)+'s');

  function LSget(k,d){ try{ var v=localStorage.getItem(k); return v===null?d:v; }catch(e){ return d; } }
  function LSset(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }

  /* ============================================================
     SONIDO
     Si subes archivos a  kick-feed/sounds/  con estos nombres
     (follow.mp3, sub.mp3, gift.mp3, kicks.mp3, reward.mp3,
      host.mp3, live.mp3, mod.mp3, chat.mp3) se usan esos.
     Si no existen, se genera un tono corto.
     ============================================================ */
  var soundOn = LSget('kickfeed.sound','1') === '1';
  $snd.textContent = soundOn ? '🔊' : '🔇';
  $snd.classList.toggle('on', soundOn);
  $snd.onclick = function(){
    soundOn = !soundOn;
    $snd.textContent = soundOn ? '🔊' : '🔇';
    $snd.classList.toggle('on', soundOn);
    LSset('kickfeed.sound', soundOn ? '1' : '0');
    if (soundOn) beep('follow');
  };

  var ac = null;
  function unlock(){
    try{
      if (!ac) ac = new (window.AudioContext||window.webkitAudioContext)();
      if (ac.state === 'suspended') ac.resume();
    }catch(e){}
  }
  document.addEventListener('pointerdown', unlock, {once:false});

  var TONES = {
    follow:[880,1175], sub:[660,880,1320], gift:[784,988,1175,1568],
    kicks:[523,1046], tip:[1046,1318,1568,2093], reward:[988],
    host:[440,880], live:[523,659,784], mod:[330,262], chat:[700]
  };
  var files = {};
  ['follow','sub','gift','kicks','tip','reward','host','live','mod','chat'].forEach(function(t){
    var a = new Audio('sounds/' + t + '.mp3');
    a.preload = 'auto';
    a.addEventListener('canplaythrough', function(){ files[t] = a; });
    a.addEventListener('error', function(){ /* no existe: se usa el tono */ });
  });

  function beep(type){
    if (!soundOn) return;
    if (files[type]) {
      try { var c = files[type].cloneNode(); c.volume = CFG.vol; c.play(); return; } catch(e){}
    }
    unlock();
    if (!ac) return;
    var notes = TONES[type] || [700], t0 = ac.currentTime;
    notes.forEach(function(f,i){
      var o = ac.createOscillator(), g = ac.createGain();
      o.type = 'triangle'; o.frequency.value = f;
      var s = t0 + i*0.09;
      g.gain.setValueAtTime(0.0001, s);
      g.gain.exponentialRampToValueAtTime(Math.max(0.001, CFG.vol*0.28), s+0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, s+0.16);
      o.connect(g); g.connect(ac.destination);
      o.start(s); o.stop(s+0.18);
    });
  }

  /* ============================================================
     FILTROS
     ============================================================ */
  var TYPES = [
    ['follow','Seguidores',true],['sub','Subs',true],['gift','Gifted',true],
    ['kicks','Kicks',true],['tip','Tips',true],['reward','Recompensas',true],
    ['host','Hosts',true],['live','En vivo',true],
    ['mod','Moderación',false],['chat','Chat',false]
  ];
  var enabled = {};
  TYPES.forEach(function(t){ enabled[t[0]] = t[2]; });
  try{
    var saved = JSON.parse(LSget('kickfeed.filters','null'));
    if (saved) Object.keys(enabled).forEach(function(k){ if (k in saved) enabled[k] = !!saved[k]; });
  }catch(e){}
  TYPES.forEach(function(t){ var v=Q.get(t[0]); if(v==='0')enabled[t[0]]=false; if(v==='1')enabled[t[0]]=true; });

  TYPES.forEach(function(t){
    var b=document.createElement('button');
    b.className='chip'+(enabled[t[0]]?' on':''); b.textContent=t[1];
    b.onclick=function(){
      enabled[t[0]]=!enabled[t[0]];
      b.classList.toggle('on',enabled[t[0]]);
      LSset('kickfeed.filters', JSON.stringify(enabled));
      Array.prototype.forEach.call($feed.querySelectorAll('.item.'+t[0]),function(el){
        el.style.display = enabled[t[0]] ? '' : 'none';
      });
    };
    $filt.appendChild(b);
  });
  var cp=document.createElement('button');
  cp.className='chip wide'; cp.textContent='📋  Copiar historial';
  cp.onclick=function(){
    var txt=LOG.map(function(e){
      var d=document.createElement('div');
      d.innerHTML=e.html+(e.sub?' — '+e.sub:'');
      return hhmm(e.ts)+'  '+d.textContent.replace(/\s+/g,' ').trim();
    }).join('\n');
    var ok=function(){ cp.textContent='✅  Copiado ('+LOG.length+')';
                       setTimeout(function(){cp.textContent='📋  Copiar historial';},1800); };
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(ok, function(){ fallback(txt, ok); });
    } else fallback(txt, ok);
  };
  function fallback(txt, ok){
    var ta=document.createElement('textarea');
    ta.value=txt; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); ok(); }catch(e){}
    document.body.removeChild(ta);
  }
  $filt.appendChild(cp);

  var clr=document.createElement('button');
  clr.className='chip wide'; clr.textContent='🗑  Vaciar historial';
  clr.onclick=function(){
    if (!confirm('¿Borrar todos los eventos guardados?')) return;
    LOG=[]; saveLog(); $feed.innerHTML='';
  };
  $filt.appendChild(clr);
  document.getElementById('gear').onclick=function(){ $filt.classList.toggle('open'); };

  /* ============================================================
     PANEL DE BOTRIX  (opcional)
     Pega la URL de tu activity feed de Botrix así:
       ?botrix=https://botrix.live/widgets/activityfeed/?mode=overlay...
     Se muestra abajo, dentro de la misma página. No se puede leer
     su contenido (es otro dominio), solo mostrarlo.
     ============================================================ */
  var $bx=document.getElementById('bx'), $bxBtn=document.getElementById('bxBtn');
  if (/^https:\/\/(www\.)?botrix\.live\//i.test(CFG.botrix)){
    var fr=document.createElement('iframe');
    fr.src=CFG.botrix;
    fr.setAttribute('referrerpolicy','no-referrer-when-downgrade');
    $bx.appendChild(fr);
    $bx.style.height=Math.min(80,Math.max(15,CFG.botrixH))+'vh';
    $bxBtn.style.display='';
    var bxOpen = LSget('kickfeed.botrix','1')==='1';
    function bxSet(v){
      bxOpen=v; $bx.classList.toggle('show',v);
      $bxBtn.classList.toggle('on',v); LSset('kickfeed.botrix', v?'1':'0');
    }
    bxSet(bxOpen);
    $bxBtn.onclick=function(){ bxSet(!bxOpen); };
    document.getElementById('bxClose').onclick=function(){ bxSet(false); };
  }

  /* ============================================================
     RENDER
     ============================================================ */
  var ICONS={follow:'♥',sub:'★',gift:'🎁',kicks:'⚡',tip:'💰',reward:'◆',host:'▶',live:'●',mod:'⛔',chat:'💬',sys:'·'};

  function esc(s){
    return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;')
      .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  function emotes(s){
    return esc(s).replace(/\[emote:(\d+):([^\]]*)\]/g,function(_,id,name){
      return '<img class="em" src="https://files.kick.com/emotes/'+id+'/fullsize" alt="'+esc(name)+'">';
    });
  }
  function hhmm(ts){
    var d=new Date(ts);
    return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
  }

  /* historial persistente */
  var LOG=[];
  if (CFG.keep){
    try{ LOG = JSON.parse(LSget('kickfeed.log','[]')) || []; }catch(e){ LOG=[]; }
  }
  var saveT=null;
  function flushLog(){ clearTimeout(saveT); LSset('kickfeed.log', JSON.stringify(LOG.slice(0,CFG.max))); }
  function saveLog(now){
    if (!CFG.keep) return;
    if (now) return flushLog();
    clearTimeout(saveT);
    saveT=setTimeout(flushLog,400);
  }
  window.addEventListener('pagehide', function(){ if(CFG.keep) flushLog(); });
  document.addEventListener('visibilitychange', function(){ if(document.hidden && CFG.keep) flushLog(); });

  var seen={};
  function dedupe(key){
    if(!key) return false;
    var now=Date.now();
    if(seen[key] && now-seen[key]<8000) return true;
    seen[key]=now;
    if(Object.keys(seen).length>400) seen={};
    return false;
  }

  function render(ev, prepend){
    if ($empty){ $empty.remove(); $empty=null; }
    var el=document.createElement('div');
    el.className='item '+ev.type+(ev.done?' done':'');
    el.dataset.id=ev.id;
    if(!enabled[ev.type] && ev.type!=='sys') el.style.display='none';
    el.innerHTML=
      '<div class="ic">'+(ICONS[ev.type]||'·')+'</div>'+
      '<div class="body"><div class="line">'+ev.html+'</div>'+
        (ev.sub?'<span class="sub">'+ev.sub+'</span>':'')+
      '</div>'+
      '<div class="right"><div class="t">'+hhmm(ev.ts)+'</div>'+
        (ev.type==='sys'?'':'<div class="ok">✓</div>')+'</div>';

    el.onclick=function(e){
      if (e.target.classList.contains('ok')){
        ev.done=!ev.done; el.classList.toggle('done',ev.done); saveLog(true);
        return;
      }
      showReplay(ev, el);
    };
    if (prepend) $feed.insertBefore(el,$feed.firstChild); else $feed.appendChild(el);
    return el;
  }

  function push(type, html, subHtml, dedupeKey){
    if (dedupe(dedupeKey)) return;
    var ev={id:'e'+Date.now()+Math.random().toString(36).slice(2,7),
            type:type, html:html, sub:subHtml||'', ts:Date.now(), done:false};
    if (type!=='sys'){ LOG.unshift(ev); LOG=LOG.slice(0,CFG.max); saveLog(); }
    render(ev,true);
    while($feed.children.length>CFG.max) $feed.removeChild($feed.lastChild);
    $feed.scrollTop=0;
    if (CFG.liveSound && type!=='sys' && type!=='chat') beep(type);
  }

  /* ---- repetición de alerta ---- */
  var repT=null;
  function showReplay(ev, el){
    if (ev.type==='sys') return;
    $repBig.innerHTML=ev.html;
    $repSmall.innerHTML=ev.sub || hhmm(ev.ts);
    $rep.classList.remove('show');
    void $rep.offsetWidth;              // reinicia la animación
    $rep.classList.add('show');
    beep(ev.type);
    if (el){ el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash'); }
    clearTimeout(repT);
    repT=setTimeout(hideReplay, CFG.dur);
  }
  function hideReplay(){ $rep.classList.remove('show'); clearTimeout(repT); }
  document.getElementById('replayClose').onclick=hideReplay;
  $rep.onclick=function(e){ if(e.target.id!=='replayClose') hideReplay(); };

  /* pinta el historial guardado, más viejo abajo */
  if (LOG.length){
    if ($empty){ $empty.remove(); $empty=null; }
    LOG.forEach(function(ev){ render(ev,false); });

  function nm(u){ return '<span class="name">'+esc(u||'Alguien')+'</span>'; }
  function plural(n,one,many){ return n+' '+(Number(n)===1?one:many); }

  /* ============================================================
     TIPS / DONACIONES
     Kick no manda los tips: llegan por Botrix (PayPal). La forma
     de verlos aquí es que Botrix anuncie cada tip en el chat de
     Kick; esto lee ese mensaje y saca el nick y el monto.
     Cambia el nombre del bot con  ?tipbot=nombre1,nombre2
     ============================================================ */
  var W = '[\\w\\u00C0-\\u024F.\\-]{2,30}';
  var TIP_RX = [
    new RegExp('('+W+')\\s+(?:acaba de donar|te acaba de donar|ha donado|te don[oó]|don[oó]|donated|tipped)\\D{0,15}?([\\d][\\d.,]*)','i'),
    new RegExp('donaci[oó]n de\\s+('+W+')\\D{0,15}?([\\d][\\d.,]*)','i'),
    new RegExp('(?:tip|propina) de\\s+('+W+')\\D{0,15}?([\\d][\\d.,]*)','i'),
    new RegExp('^('+W+')\\s*[:\\-]\\s*(?:don[oó]|tip|propina)\\D{0,15}?([\\d][\\d.,]*)','i')
  ];
  var NICK_RX = [ new RegExp('(?:gracias|thanks)\\s+(?:a\\s+)?('+W+')','i') ];
  var CODE_RX = /\b(MXN|USD|EUR|GBP|ARS|COP|CLP|PEN|BRL)\b/i;
  var SYM_RX  = /(\$|€|£)/;
  var TIPWORD_RX = /(dona|don[oó]|donat|tipp|tipe|\btip\b|propina)/i;

  // Devuelve true si el mensaje se interpretó como tip.
  function tryTip(username, content, msgId){
    var from = String(username||'').toLowerCase();
    if (!CFG.tipAll && CFG.tipBots.indexOf(from) === -1) return false;
    if (!TIPWORD_RX.test(content)) return false;

    var who=null, amount=null;
    for (var i=0;i<TIP_RX.length;i++){
      var m = content.match(TIP_RX[i]);
      if (m){ who=m[1]; amount=m[2]; break; }
    }
    if (!amount){
      var am = content.match(/([\d][\d.,]*)/);
      if (am) amount = am[1];
    }
    if (!who){
      for (var j=0;j<NICK_RX.length;j++){
        var n = content.match(NICK_RX[j]);
        if (n){ who = n[1]; break; }
      }
    }
    if (!who && !amount) return false;   // no parece tip de verdad

    var sym  = (content.match(SYM_RX)  || ['$'])[0];
    var code = (content.match(CODE_RX) || [''])[0];
    var head = who ? nm(who)+' donó' : '<span class="name">Donación</span>';
    if (amount) head += ' ' + esc(sym + amount + (code ? ' ' + code.toUpperCase() : ''));
    push('tip', head, esc(content), 'tip:'+(msgId||content));
    return true;
  }

  /* ============================================================
     EVENTOS DE KICK
     ============================================================ */
  var lastFollowers=null;

  function handle(evName, d, rawChannel){
    var short=String(evName||'').replace('App\\Events\\','').replace('App\\\\Events\\\\','');
    if (CFG.debug) console.log('[kickfeed]', short, rawChannel, d);

    switch(short){

      case 'FollowersUpdated': {
        if (typeof d.followersCount==='number')
          $fol.textContent=d.followersCount.toLocaleString('es-MX')+' seguidores';
        var user=d.username||(d.follower&&d.follower.username)||null;
        if (d.followed===false) return;
        if (user) push('follow', nm(user)+' te siguió', null, 'f:'+user);
        else if (typeof d.followersCount==='number' && lastFollowers!==null && d.followersCount>lastFollowers){
          var diff=d.followersCount-lastFollowers;
          push('follow', diff===1?'Nuevo seguidor':plural(diff,'nuevo seguidor','nuevos seguidores'),
               'Total: '+d.followersCount.toLocaleString('es-MX'), 'fc:'+d.followersCount);
        }
        if (typeof d.followersCount==='number') lastFollowers=d.followersCount;
        return;
      }

      case 'SubscriptionEvent': {
        var m=Number(d.months||1);
        push('sub', nm(d.username)+(m>1?' se resuscribió':' se suscribió'),
             m>1?plural(m,'mes','meses')+' seguidos':'Sub nueva', 's:'+d.username+':'+m);
        return;
      }

      case 'GiftedSubscriptionsEvent': {
        var list=d.gifted_usernames||d.giftedUsernames||[];
        var count=Number(d.gifted_count||d.giftedCount||list.length||1);
        push('gift', nm(d.gifter_username||d.gifterUsername)+' regaló '+plural(count,'sub','subs'),
             list.length?'Para: '+esc(list.slice(0,10).join(', '))+(list.length>10?'…':''):null,
             'g:'+(d.gifter_username||d.gifterUsername)+':'+count);
        return;
      }

      case 'LuckyUsersWhoGotGiftSubscriptionsEvent': {
        var lu=d.usernames||[];
        push('gift', nm(d.gifter_username||d.gifterUsername)+' regaló '+plural(lu.length||1,'sub','subs'),
             lu.length?'Para: '+esc(lu.slice(0,10).join(', ')):null,
             'lg:'+(d.gifter_username||d.gifterUsername)+':'+lu.length);
        return;
      }

      case 'SubscriptionsUpdated': return;

      case 'KicksGifted':
      case 'GiftsLeaderboardUpdated': {
        var sender=(d.sender&&d.sender.username)||d.username||d.gifter_username||(d.gifter&&d.gifter.username);
        var amount=d.amount||d.kicks||d.quantity||(d.gift&&(d.gift.amount||d.gift.quantity));
        if (short==='GiftsLeaderboardUpdated' && !amount) return;
        push('kicks', nm(sender)+' mandó '+(amount?esc(amount)+' Kicks':'Kicks'),
             (d.gift&&d.gift.name)?esc(d.gift.name):(d.message?emotes(d.message):null),
             'k:'+sender+':'+amount);
        return;
      }

      case 'RewardRedeemedEvent': {
        push('reward', nm(d.username)+' canjeó “'+esc(d.reward_title||d.title||'recompensa')+'”',
             d.user_input?esc(d.user_input):null, 'r:'+d.username+':'+(d.reward_title||''));
        return;
      }

      case 'StreamHostEvent':
      case 'StreamHostedEvent': {
        var v=Number(d.number_viewers||d.numberViewers||0);
        push('host', nm(d.host_username||d.hostUsername)+' te hosteó'+(v?' con '+plural(v,'viewer','viewers'):''),
             d.optional_message?esc(d.optional_message):null,
             'h:'+(d.host_username||d.hostUsername)+':'+v);
        return;
      }

      case 'StreamerIsLive':
        push('live','<span class="name">Stream en vivo</span>',
             (d.livestream&&d.livestream.session_title)?esc(d.livestream.session_title):null,'live:on');
        return;
      case 'StopStreamBroadcast':
        push('live','<span class="name">Stream terminado</span>',null,'live:off');
        return;

      case 'UserBannedEvent': {
        var u=(d.user&&d.user.username)||d.username;
        var by=(d.banned_by&&d.banned_by.username)||'';
        push('mod', nm(u)+(d.expires_at?' fue silenciado':' fue baneado'),
             by?'Por '+esc(by):null, 'b:'+u);
        return;
      }
      case 'UserUnbannedEvent': {
        var u2=(d.user&&d.user.username)||d.username;
        push('mod', nm(u2)+' fue desbaneado', null, 'ub:'+u2);
        return;
      }
      case 'PinnedMessageCreatedEvent': {
        var pm=d.message||{};
        push('mod','<span class="name">Mensaje fijado</span>',
             pm.content?emotes(pm.content):null,'pin:'+(pm.id||''));
        return;
      }

      case 'ChatMessageEvent':
      case 'ChatMessageSentEvent': {
        var s=d.sender||{};
        var color=(s.identity&&s.identity.color)||'#cfd4dc';
        var content=d.content||d.message||'';
        var meta=d.metadata||{};
        var cel=meta.celebration||meta.kicks||meta.gift||null;
        if (d.type==='celebration'||cel){
          var amt=(cel&&(cel.amount||cel.kicks_amount||cel.quantity))||meta.amount;
          push('kicks', nm(s.username)+(amt?' mandó '+esc(amt)+' Kicks':' mandó Kicks'),
               content?emotes(content):null,'kc:'+(d.id||''));
          return;
        }
        if (tryTip(s.username, content, d.id)) return;
        if (!enabled.chat) return;
        push('chat','<span class="name" style="color:'+esc(color)+'">'+esc(s.username)+'</span>',
             emotes(content),'c:'+(d.id||''));
        return;
      }

      case 'MessageDeletedEvent': case 'ChatroomUpdatedEvent': case 'ChatroomClearEvent':
      case 'PollUpdateEvent': case 'PinnedMessageDeletedEvent': case 'LivestreamUpdated':
      case 'UpdatedLiveStreamEvent': case 'TitleChangedEvent':
        return;

      default:
        if (CFG.debug)
          push('sys','[debug] '+esc(short),'<code>'+esc(JSON.stringify(d).slice(0,300))+'</code>');
        return;
    }
  }

  /* ============================================================
     CONEXIÓN PUSHER
     ============================================================ */
  var PUSHER_KEY='32cbd69e4b950bf97679';
  var WS_URL='wss://ws-us2.pusher.com/app/'+PUSHER_KEY+
             '?protocol=7&client=js&version=8.4.0-rc2&flash=false';
  var ws=null, retry=0, pingTimer=null;

  function channels(){
    var c=[];
    if (CFG.chatroomId){
      c.push('chatrooms.'+CFG.chatroomId+'.v2');
      c.push('chatrooms.'+CFG.chatroomId);
      c.push('chatroom_'+CFG.chatroomId);
    }
    if (CFG.channelId){
      c.push('channel.'+CFG.channelId);
      c.push('channel_'+CFG.channelId);
      c.push('predictions-channel-'+CFG.channelId);
    }
    return c;
  }

  function connect(){
    if (!CFG.chatroomId && !CFG.channelId){
      push('sys','Falta configurar el canal.','Agrega <code>?chatroom=ID&amp;channelid=ID</code> a la URL.');
      return;
    }
    try{ ws=new WebSocket(WS_URL); }catch(e){ scheduleReconnect(); return; }

    ws.onopen=function(){ retry=0; };

    ws.onmessage=function(ev){
      var msg; try{ msg=JSON.parse(ev.data); }catch(e){ return; }

      if (msg.event==='pusher:connection_established'){
        $dot.classList.add('on');
        channels().forEach(function(ch){
          ws.send(JSON.stringify({event:'pusher:subscribe',data:{auth:'',channel:ch}}));
        });
        clearInterval(pingTimer);
        pingTimer=setInterval(function(){
          if (ws && ws.readyState===1) ws.send(JSON.stringify({event:'pusher:ping',data:{}}));
        },60000);
        return;
      }
      if (msg.event==='pusher:ping'){ ws.send(JSON.stringify({event:'pusher:pong',data:{}})); return; }
      if (msg.event==='pusher:pong'||msg.event==='pusher_internal:subscription_succeeded') return;
      if (msg.event==='pusher:error'){ if(CFG.debug) console.warn('[kickfeed] pusher error',msg); return; }

      var data=msg.data;
      if (typeof data==='string'){ try{ data=JSON.parse(data); }catch(e){ data={}; } }
      handle(msg.event, data||{}, msg.channel);
    };

    ws.onclose=function(){ $dot.classList.remove('on'); clearInterval(pingTimer); scheduleReconnect(); };
    ws.onerror=function(){ try{ ws.close(); }catch(e){} };
  }

  function scheduleReconnect(){
    retry++;
    setTimeout(connect, Math.min(30000, 1000*Math.pow(1.6, Math.min(retry,10))));
  }

  document.addEventListener('visibilitychange',function(){
    if (!document.hidden && (!ws||ws.readyState>1)){ retry=0; connect(); }
  });

  connect();
