  /* ============================================================
     UNA SOLA LÍNEA POR EVENTO
     Un mismo evento puede llegar por varias vías: el evento directo
     de Kick, el anuncio de Botrix en el chat y, después de un corte,
     el historial del chat. "ck" identifica al evento (tipo + nick);
     si ya hay una línea igual de hace menos de 3 minutos que vino por
     OTRA vía, no se repite: se juntan. Lo de Kick es lo más completo
     (trae meses, cuántas subs regaló, etc.), así que si llega después
     de Botrix, reemplaza el texto.
     Los contadores (★ subs y ⚡ Kicks) se ajustan aquí mismo, así que
     un evento repetido nunca suma doble.
     ============================================================ */
  var CK_WIN=180000;
  // Qué fuente manda cuando el mismo evento llega por varias vías.
  var PRI={botrix:1, kick:2, api:3};
  function lc(u){ return String(u||'').toLowerCase().trim(); }
  function num(x){ return parseInt(String(x==null?'':x).replace(/[^\d]/g,''),10)||0; }
  function findCk(ck, ts){
    for (var i=0;i<Math.min(LOG.length,500);i++){
      var e=LOG[i];
      if (e.ck===ck && Math.abs(e.ts-ts) < CK_WIN) return e;
    }
    return null;
  }
  function applyCounts(dSubs, dKicks, ts){
    // Lo recuperado de antes de que empezara el stream no suma a la sesión.
    if (startMs && ts < startMs-60000) return;
    if (!dSubs && !dKicks) return;
    sess.subs  = Math.max(0,(sess.subs||0)+(dSubs||0));
    sess.kicks = Math.max(0,(sess.kicks||0)+(dKicks||0));
    saveSess(); paintSubs(); paintKicks();
  }
  function refreshEl(ev){
    var el=$feed.querySelector('.item[data-id="'+ev.id+'"]');
    if (el) el.replaceWith(itemEl(ev));
  }
  var repaintT=null;
  function scheduleRepaint(){ clearTimeout(repaintT); repaintT=setTimeout(repaint,60); }

  // o: {type, html, sub, msg, cls, key, ck, src, ts, ic, fold, subs, kicks}
  // Sin "ts" es un evento en vivo; con "ts" es recuperado y va en su hora.
  function addEvent(o){
    var live=!o.ts, ts=o.ts||Date.now();
    if (o.key && live && dedupe(o.key)){            // repetido por otro canal de Kick
      if (o.msg) enrich(o.key, o.msg);
      return null;
    }
    if (o.ck){
      var prev=findCk(o.ck, ts);
      if (prev && prev.src!==o.src){
        if ((PRI[o.src]||0) > (PRI[prev.src]||0)){
          applyCounts((o.subs||0)-(prev.subs||0), (o.kicks||0)-(prev.kicks||0), prev.ts);
          prev.html=o.html; prev.sub=o.sub||''; prev.cls=o.cls||''; prev.src=o.src;
          prev.subs=o.subs||0; prev.kicks=o.kicks||0; prev.n=1;
          if (o.key) prev.key=o.key;
        }
        if (o.msg && !prev.msg) prev.msg=o.msg;
        saveLog(true); refreshEl(prev);
        return null;
      }
      if (prev && prev.src==='botrix' && o.src==='botrix'){
        // Botrix agradece cada sub regalada por separado: se suman en la misma línea.
        if (o.type==='gift'){
          prev.n=(prev.n||1)+1; prev.subs=(prev.subs||1)+1;
          applyCounts(1,0,prev.ts); saveLog(true); refreshEl(prev);
        }
        return null;
      }
    }
    var ev={id:'e'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),
            type:o.type, html:o.html, sub:o.sub||'', msg:o.msg||'', cls:o.cls||'',
            key:o.key||'', ck:o.ck||'', src:o.src||'', ts:ts,
            subs:o.subs||0, kicks:o.kicks||0};
    if (o.ic) ev.ic=o.ic;
    if (o.fold) ev.fold=1;
    if (o.extra) for (var k in o.extra) ev[k]=o.extra[k];
    applyCounts(ev.subs, ev.kicks, ts);
    placeEvent(ev, live);
    return ev;
  }

  // Lo mete en la lista en su lugar según la hora (lo más nuevo arriba).
  function placeEvent(ev, live){
    if ($empty){ $empty.remove(); $empty=null; }
    if (ev.type==='sys'){                     // avisos del sistema: no se guardan
      $feed.insertBefore(itemEl(ev), $feed.children[1] || null);
      return;
    }
    var i=0; while (i<LOG.length && LOG[i].ts > ev.ts) i++;
    LOG.splice(i,0,ev);
    if (LOG.length>CFG.max) LOG.length=CFG.max;
    saveLog();
    if (live && i===0 && !repaintT){
      var k=dayKey(ev.ts);
      if (k!==topDay){ $feed.insertBefore(daySep(ev.ts), $feed.firstChild); topDay=k;
                       if (bottomDay===null) bottomDay=k; }
      $feed.insertBefore(itemEl(ev), $feed.children[1] || null);
      shown++;
      $feed.scrollTop=0;
    } else scheduleRepaint();
  }

  // Atajo para los eventos sencillos (follows, recompensas, moderación…).
  function push(type, html, subHtml, dedupeKey, msgHtml, cls){
    return addEvent({type:type, html:html, sub:subHtml, key:dedupeKey, msg:msgHtml, cls:cls, src:'kick'});
  }

  /* Si el mismo evento se repite (recompensas spameadas), en vez de
     agregar otra línea le sube el contador a la que ya está. */
  function bump(key, maxAge, cb){
    for (var i=0;i<Math.min(LOG.length,8);i++){
      var e=LOG[i];
      if (e.key===key && Date.now()-e.ts < maxAge){
        e.n=(e.n||1)+1; e.ts=Date.now();
        if (cb) cb(e);
        saveLog(true);
        var el=$feed.querySelector('.item[data-id="'+e.id+'"]');
        if (el) el.replaceWith(itemEl(e));
        return e;
      }
    }
    return null;
  }

  /* ============================================================
     AVISO GRANDE CUANDO SPAMEAN UNA RECOMPENSA
     A partir de cierta cantidad de canjeos seguidos baja una franja
     con el nombre de la recompensa. Se quita tocándola, y si le
     siguen dando vuelve a salir.
     ============================================================ */
  var $alerts=document.getElementById('alerts');
  var alertState={};

  function rewardAlert(key, title, n){
    var st = alertState[key] || (alertState[key] = {el:null, n:0, dismissed:0});
    st.n = n;
    if (n < CFG.rwalert) return;
    if (n < st.dismissed + CFG.rwalert) return;   // ya lo quitaste: espera otra tanda
    if (st.el){ st.el.querySelector('.n').textContent='×'+n; return; }

    var el=document.createElement('div');
    el.className='alert';
    el.innerHTML='<span class="ttl">'+esc(title)+'</span>'+
                 '<span class="n">×'+n+'</span>'+
                 '<span class="hint">toca para quitar</span>';
    el.onclick=function(){ el.remove(); st.el=null; st.dismissed=st.n; };
    $alerts.appendChild(el);
    st.el=el;
  }

  /* Cuando alguien comparte su resub con un mensaje, Kick lo manda
     aparte del evento de suscripción. Esto le pega el mensaje a la
     línea de esa persona si acaba de aparecer. */
  function enrichSub(username, msgHtml){
    var pref = 's:'+String(username||'');
    for (var i=0;i<Math.min(LOG.length,15);i++){
      var e=LOG[i];
      if (e.type==='sub' && !e.msg && Date.now()-e.ts < 120000 &&
          String(e.key||'').toLowerCase().indexOf(pref.toLowerCase()) === 0){
        e.msg = msgHtml; saveLog(true);
        var el=$feed.querySelector('.item[data-id="'+e.id+'"]');
        if (el) el.replaceWith(itemEl(e));
        return;
      }
    }
  }

  // Rellena el mensaje de un evento que ya estaba en la lista.
  function enrich(key, msgHtml){
    for (var i=0;i<Math.min(LOG.length,25);i++){
      if (LOG[i].key===key && !LOG[i].msg){
        LOG[i].msg=msgHtml; saveLog(true);
        var el=$feed.querySelector('.item[data-id="'+LOG[i].id+'"]');
        if (el){
          var s=document.createElement('span');
          s.className='msg'; s.innerHTML=msgHtml;
          el.querySelector('.body').appendChild(s);
        }
        return;
      }
    }
  }

  if (LOG.length){ $empty.remove(); $empty=null; appendMore(); }

  function nm(u){ return '<span class="name">'+esc(u||'Alguien')+'</span>'; }
  function plural(n,one,many){ return n+' '+(Number(n)===1?one:many); }

  /* Busca un texto escrito por la persona en cualquier parte del payload.
     Kick mete el mensaje de los Kicks en un lugar distinto según el regalo. */
  var MSG_KEYS=['message','content','text','comment','user_message','msg','body','caption','note'];
  function deepMessage(obj, depth){
    depth = depth || 0;
    if (!obj || typeof obj!=='object' || depth>4) return null;
    for (var i=0;i<MSG_KEYS.length;i++){
      var v = obj[MSG_KEYS[i]];
      if (typeof v==='string' && v.trim() && v.length<500) return v.trim();
      if (v && typeof v==='object'){
        var inner = deepMessage(v, depth+1);
        if (inner) return inner;
      }
    }
    for (var k in obj){
      if (!Object.prototype.hasOwnProperty.call(obj,k)) continue;
      if (MSG_KEYS.indexOf(k)!==-1) continue;
      if (obj[k] && typeof obj[k]==='object'){
        var d = deepMessage(obj[k], depth+1);
        if (d) return d;
      }
    }
    return null;
  }

  /* ============================================================
     TIPS / DONACIONES  (llegan por el anuncio de Botrix en el chat)
     ============================================================ */
  var W = '[\\w\\u00C0-\\u024F.\\-]{2,30}';
  var AT_RX = new RegExp('@('+W+')');
  var AMT_CODE_RX = /([\d][\d.,]*)\s*(MXN|USD|EUR|GBP|ARS|COP|CLP|PEN|BRL)\b/i;  // 150 MXN
  var AMT_NUMSYM_RX = /([\d][\d.,]*)\s*(\$|€|£)/;                                 // 1 $
  var AMT_SYM_RX  = /(\$|€|£)\s*([\d][\d.,]*)/;                                   // $150

  /* Botrix escribe tal cual las variables que no reconoce, por ejemplo
     "$(message)". Eso no es texto de nadie, así que se quita. */
  /* El nick puede traer espacios ("Lil Milk"). En las plantillas de
     Botrix siempre va entre la @ y la palabra que sigue ("gracias",
     "se rifó"), así que se captura todo ese pedazo. */
  var AT_LONG_RX = /@\s*([^\n¡!]{2,40}?)\s+(?:¡\s*)?(?:gracias|thanks|se\s+rif)/i;
  function nickAfterAt(text){
    var m = text.match(AT_LONG_RX);
    if (m && m[1].trim()) return m[1].trim();
    var a = text.match(AT_RX);
    return a ? a[1] : null;
  }

  function dropVars(s){
    return String(s||'').replace(/\$\([^)]*\)/g,'').replace(/\s{2,}/g,' ').trim();
  }
  /* Quita las menciones @nick antes de buscar el monto: si no, un nick
     como "Beiker05" hacía que la donación saliera como $05. */
  function stripMentions(s){ return String(s||'').replace(/@\S+/g,' '); }
  var TIP_RX = [
    new RegExp('('+W+')\\s+(?:acaba de donar|te acaba de donar|ha donado|te don[oó]|don[oó]|donated|tipped)\\D{0,15}?([\\d][\\d.,]*)','i'),
    new RegExp('donaci[oó]n de\\s+('+W+')\\D{0,15}?([\\d][\\d.,]*)','i'),
    new RegExp('(?:tip|propina) de\\s+('+W+')\\D{0,15}?([\\d][\\d.,]*)','i'),
    new RegExp('^('+W+')\\s*[:\\-]\\s*(?:don[oó]|tip|propina)\\D{0,15}?([\\d][\\d.,]*)','i')
  ];
  var NICK_RX = [ new RegExp('(?:gracias|thanks)\\s+(?:a\\s+)?('+W+')','i') ];
  // "donó", "tip", "propina" = señal fuerte de donación.
  var TIPSTRONG_RX = /(dona|don[oó]|donat|tipp|tipe|\btip\b|propina)/i;
  // "gracias" solo no basta: Botrix también da las gracias por subs,
  // resubs y follows, y eso hacía que una resub saliera como donación.
  var NOTTIP_RX = /(suscri|subscri|resub|\bsubs?\b|mes(es)?\b|month|renov|seguir|seguidor|follow|puntos|points|kick)/i;

  function tryTip(username, content, msgId, ts){
    var from = String(username||'').toLowerCase();
    if (!CFG.tipAll && CFG.tipBots.indexOf(from) === -1) return false;

    // Si pones " | " en la plantilla de Botrix, lo que va después
    // se muestra aparte como el mensaje que dejó quien donó.
    var donorMsg='', body=content;
    var bar = content.lastIndexOf(' | ');
    if (bar > 0){ donorMsg = dropVars(content.slice(bar+3)); body = content.slice(0,bar); }
    body = dropVars(body);

    // Los emotes traen números; se quitan antes de buscar el monto.
    var clean = body.replace(/\[emote:\d+:[^\]]*\]/g,' ');
    var forAmount = stripMentions(clean);

    var amount=null, cur='';
    var mc = forAmount.match(AMT_CODE_RX),
        mn = forAmount.match(AMT_NUMSYM_RX),
        ms = forAmount.match(AMT_SYM_RX);
    if (mc){ amount=mc[1]; cur=mc[2].toUpperCase(); }
    else if (mn){ amount=mn[1]; cur=mn[2]; }
    else if (ms){ amount=ms[2]; cur=ms[1]; }

    var strong = TIPSTRONG_RX.test(clean);
    if (!amount && strong){
      var am = forAmount.match(/([\d][\d.,]*)/);
      if (am) amount = am[1];
    }
    if (!amount) return false;              // sin monto no es tip
    if (!strong && !cur) return false;      // sin moneda ni palabra clara, tampoco
    // Habla de subs, meses, follows o Kicks: no es una donación.
    if (!strong && NOTTIP_RX.test(clean)) return false;

    var who = nickAfterAt(clean);
    if (!who){
      for (var i=0;i<TIP_RX.length;i++){
        var m = clean.match(TIP_RX[i]);
        if (m){ who=m[1]; break; }
      }
    }
    if (!who){
      for (var j=0;j<NICK_RX.length;j++){
        var n = clean.match(NICK_RX[j]); if (n){ who=n[1]; break; }
      }
    }

    var money = /^[$€£]$/.test(cur) ? cur+amount : '$'+amount+(cur?' '+cur:'');
    var head = (who ? nm(who)+' donó' : '<span class="name">Donación</span>') + ' ' + esc(money);
    addEvent({type:'tip', html:head, sub:emotes(body), key:'tip:'+(msgId||content),
              msg: donorMsg ? emotes(donorMsg) : null, src:'botrix', ts:ts});
    return true;
  }

  /* ============================================================
     KICKS ANUNCIADOS POR BOTRIX EN EL CHAT
       @$(name) se rifó $(amount) KICKs! mariotqMONEY | $(message)
     Kick manda su propio evento de Kicks, así que los dos se
     juntan en una sola línea (nick + cantidad).
     ============================================================ */
  var KICKS_RX = /([\d][\d.,]*)\s*KICKS?\b/i;

  function kicksKey(nick, amount){
    return 'k:'+lc(nick)+':'+num(amount);
  }

  function tryKicks(username, content, msgId, ts){
    var from = String(username||'').toLowerCase();
    if (!CFG.tipAll && CFG.tipBots.indexOf(from) === -1) return false;

    var donorMsg='', body=content;
    var bar = content.lastIndexOf(' | ');
    if (bar > 0){ donorMsg = dropVars(content.slice(bar+3)); body = content.slice(0,bar); }
    body = dropVars(body);

    var clean = body.replace(/\[emote:\d+:[^\]]*\]/g,' ');
    var m = stripMentions(clean).match(KICKS_RX);
    if (!m) return false;

    var amount = m[1];
    var who = nickAfterAt(clean);
    if (!who){
      var w = clean.match(new RegExp('^('+W+')\\s'));
      if (w) who = w[1];
    }
    addEvent({type:'kicks', html:nm(who)+' mandó '+esc(amount)+' Kicks', ck:kicksKey(who, amount),
              msg: donorMsg ? emotes(donorMsg) : null, src:'botrix', ts:ts, kicks:num(amount)});
    return true;
  }

  /* ============================================================
     SUBS, RESUBS, REGALOS Y HOSTS ANUNCIADOS POR BOTRIX
     Son tus plantillas de "Alertas de texto" de Botrix:
       Suscripción:   ¡Gracias @$(name) por la suscripcion mariotqLOVE
       Re-suscripción:¡Gracias @$(name) por renovar tu suscripción! …
       Sub regalada:  ¡Gracias por la sub de regalo, @$(name)! …
       Host:          @$(name) ¡Gracias por ese raid con $(viewers) viewers!
     Con señal, el evento directo de Kick llega primero y el anuncio
     de Botrix solo lo confirma (no se duplica). Si tu celular estuvo
     sin señal, el anuncio de Botrix (que se queda en el chat) es lo
     que permite recuperarlo.
     ============================================================ */
  var NICK = '([\\w\\u00C0-\\u024F.\\-]{2,30})';
  var BX_SUB   = new RegExp('gracias\\s+@\\s*'+NICK+'\\s+por\\s+la\\s+suscripci[oó]n','i');
  var BX_RESUB = new RegExp('gracias\\s+@\\s*'+NICK+'\\s+por\\s+renovar','i');
  var BX_GIFT  = new RegExp('gracias\\s+por\\s+la\\s+sub\\s+de\\s+regalo,?\\s*@\\s*'+NICK,'i');
  var BX_HOST  = new RegExp('@\\s*'+NICK+'\\s+¡?\\s*gracias\\s+por\\s+ese\\s+raid\\s+con\\s+([\\d.,]+)','i');

  function tryBotrixSub(username, content, msgId, ts){
    var from = String(username||'').toLowerCase();
    if (!CFG.tipAll && CFG.tipBots.indexOf(from) === -1) return false;
    var clean = dropVars(content).replace(/\[emote:\d+:[^\]]*\]/g,' ').replace(/\s+/g,' ');
    var m;
    if ((m=clean.match(BX_RESUB))){
      addEvent({type:'sub', html:nm(m[1])+' renovó su suscripción', sub:'Resub', cls:'resub',
                ck:'sub:'+lc(m[1]), src:'botrix', ts:ts, subs:1});
      return true;
    }
    if ((m=clean.match(BX_SUB))){
      addEvent({type:'sub', html:nm(m[1])+' se suscribió', sub:'Sub nueva',
                ck:'sub:'+lc(m[1]), src:'botrix', ts:ts, subs:1});
      return true;
    }
    if ((m=clean.match(BX_GIFT))){
      addEvent({type:'gift', html:nm(m[1])+' regaló sub', ck:'gift:'+lc(m[1]), src:'botrix', ts:ts, subs:1});
      return true;
    }
    if ((m=clean.match(BX_HOST))){
      var v=num(m[2]);
      addEvent({type:'host', html:nm(m[1])+' te hosteó'+(v?' con '+plural(v,'viewer','viewers'):''),
                ck:'host:'+lc(m[1]), src:'botrix', ts:ts});
      return true;
    }
    return false;
  }

  /* Mensajes del bot ya procesados (en vivo o recuperados): se guardan
     para que un mismo anuncio nunca entre dos veces. */
  var BOTIDS=[];
  try{ BOTIDS = JSON.parse(LSget('kickfeed.botids','[]')) || []; }catch(e){ BOTIDS=[]; }
  function seenBotId(id){
    if (!id) return false;
    if (BOTIDS.indexOf(id)!==-1) return true;
    BOTIDS.push(id); if (BOTIDS.length>500) BOTIDS=BOTIDS.slice(-400);
    LSset('kickfeed.botids', JSON.stringify(BOTIDS));
    return false;
  }
  function isBot(u){ return CFG.tipBots.indexOf(lc(u))!==-1; }

  // Un mensaje de Botrix (en vivo o del historial).
  function botMessage(username, content, msgId, ts){
    if (seenBotId(msgId)) return true;
    return tryBotrixSub(username, content, msgId, ts) ||
           tryKicks(username, content, msgId, ts) ||
           tryTip(username, content, msgId, ts);
  }

  /* ============================================================
     MEMORIA DEL CHAT PARA MODERACIÓN
     Se guardan los últimos mensajes de cada persona (solo en esta
     sesión, no se suben a ningún lado) para enseñar qué escribió
     cuando la silencian, la banean o le borran un mensaje.
     ============================================================ */
  var UMSG={}, MBYID={}, MIDQ=[], recentBan={}, nUsers=0;
  function rememberMsg(user, id, content, ts){
    if (!user || !content || isBot(user)) return;
    if (id && MBYID[id]) return;
    var k=lc(user);
    if (!UMSG[k]){ UMSG[k]=[]; if (++nUsers>3000){ UMSG={}; nUsers=0; UMSG[k]=[]; } }
    UMSG[k].push({id:id, t:content, ts:ts||Date.now()});
    UMSG[k].sort(function(a,b){ return a.ts-b.ts; });
    if (UMSG[k].length>3) UMSG[k].shift();
    if (id){ MBYID[id]={u:user, t:content, ts:ts||Date.now()}; MIDQ.push(id);
             if (MIDQ.length>1500) delete MBYID[MIDQ.shift()]; }
  }
  function lastMsgsHtml(user){
    var now=Date.now();
    return (UMSG[lc(user)]||[]).filter(function(m){ return now-m.ts < 20*60000; })
      .map(function(m){ return '<span style="opacity:.55;font-size:.85em">'+hhmm(m.ts)+'</span> '+emotes(m.t); })
      .join('<br>');
  }
  function fmtDur(min){
    min=Math.round(min);
    if (min<60) return min+' min';
    if (min<1440){ var h=Math.floor(min/60), r=min%60; return h+' h'+(r?' '+r+' min':''); }
    var d=Math.round(min/1440); return d+(d===1?' día':' días');
  }
  function parseFuture(s){
    if (!s) return null;
    var iso=String(s).trim().replace(' ','T');
    return Date.parse(iso + (/[Zz]|[+\-]\d\d:?\d\d$/.test(iso) ? '' : 'Z')) || null;
  }

  // Celebraciones de Kick en el chat (Kicks o resubs compartidas).
  function handleCelebration(d, ts){
    var s=d.sender||{};
    var content=d.content||d.message||'';
    var meta=d.metadata||{};
    if (typeof meta==='string'){ try{ meta=JSON.parse(meta); }catch(e){ meta={}; } }
    var cel=meta.celebration||meta.kicks||meta.gift||meta.kicks_gift||null;
    var amt=(cel&&(cel.amount||cel.kicks_amount||cel.quantity||cel.total))||meta.amount||meta.kicks;
    var gn=(cel&&(cel.name||cel.gift_name))||'';
    var celType=String((cel&&(cel.type||cel.celebration_type))||d.type||'').toLowerCase();

    // Resub compartida: ya llegó por su propio evento. Aquí solo
    // aprovechamos para pegarle el mensaje que escribió la persona.
    if (/sub|renew|anniversar|month|milestone/.test(celType)){
      if (content && !ts) enrichSub(s.username, emotes(content));
      return;
    }
    // Sin cantidad y sin señas de ser un regalo, no lo damos por Kicks.
    if (!amt && !/kick|gift/.test(celType)) return;
    if (ts && seenBotId('c:'+d.id)) return;
    if (!ts && d.id) seenBotId('c:'+d.id);
    addEvent({type:'kicks', html:nm(s.username)+(amt?' mandó '+esc(amt)+' Kicks':' mandó Kicks'),
              sub:gn?esc(gn):null, key:kicksKey(s.username, amt), ck:kicksKey(s.username, amt),
              msg:content?emotes(content):null, src:'kick', ts:ts, kicks:num(amt)});
  }
  function isCelebration(d){
    var meta=d.metadata||{};
    if (typeof meta==='string'){ try{ meta=JSON.parse(meta); }catch(e){ meta={}; } }
    return d.type==='celebration'||d.type==='kicks'||
           !!(meta.celebration||meta.kicks||meta.gift||meta.kicks_gift);
  }

  /* ============================================================
     EVENTOS DE KICK
     ============================================================ */
  function handle(evName, d, rawChannel){
    var short=String(evName||'').replace('App\\Events\\','').replace('App\\\\Events\\\\','');

    // Diagnóstico: guarda los eventos crudos, menos el chat normal.
    // (Kick ahora le pone "metadata" a TODOS los mensajes; antes eso
    // hacía que el chat llenara el diagnóstico y sacara los eventos.)
    var isChat = /ChatMessage/.test(short);
    var plain = isChat && !isCelebration(d) && !isBot((d.sender||{}).username);
    if (!plain){
      RAW.unshift(hhmm(Date.now())+' '+short+' @'+rawChannel+'\n'+
                  JSON.stringify(d).slice(0,1500));
      RAW = RAW.slice(0,60);
      if (CFG.keep) LSset('kickfeed.raw', JSON.stringify(RAW));
    }
    if (CFG.debug) console.log('[kickfeed]', short, rawChannel, d);

    switch(short){

      case 'FollowersUpdated': {
        var user=d.username||(d.follower&&d.follower.username)||null;
        if (d.followed===false) return;
        if (user) addEvent({type:'follow', html:nm(user)+' te siguió', key:'f:'+user, ck:'follow:'+lc(user), src:'kick'});
        else if (typeof d.followersCount==='number')
          push('follow','Nuevo seguidor',
               'Total: '+d.followersCount.toLocaleString('es-MX'),'fc:'+d.followersCount);
        return;
      }

      case 'SubscriptionEvent': {
        var m=Number(d.months||1);
        addEvent({type:'sub', html:nm(d.username)+(m>1?' se resuscribió':' se suscribió'),
                  sub:m>1?plural(m,'mes','meses')+' seguidos':'Sub nueva',
                  key:'s:'+d.username+':'+m, ck:'sub:'+lc(d.username), src:'kick',
                  cls:m>1?'resub':'', subs:1});
        return;
      }

      // Kick avisa un regalo de subs por dos eventos distintos; los dos
      // usan la misma clave, así que solo sale una línea y cuenta una vez.
      case 'GiftedSubscriptionsEvent':
      case 'LuckyUsersWhoGotGiftSubscriptionsEvent': {
        var gifter=d.gifter_username||d.gifterUsername||(d.gifter&&d.gifter.username)||'';
        var list=d.gifted_usernames||d.giftedUsernames||d.usernames||[];
        var count=Number(d.gifted_count||d.giftedCount||list.length||1);
        addEvent({type:'gift', html:nm(gifter||'Anónimo')+' regaló '+plural(count,'sub','subs'),
                  sub:list.length?'Para: '+esc(list.slice(0,10).join(', '))+(list.length>10?'…':''):null,
                  key:'g:'+lc(gifter)+':'+count, ck:'gift:'+lc(gifter), src:'kick', subs:count});
        return;
      }

      case 'SubscriptionsUpdated': return;

      /* ---- Kicks (la moneda) ---- */
      case 'KicksGifted':
      case 'GiftedKicks':
      case 'KicksSent':
      case 'GiftsLeaderboardUpdated': {
        var sender=(d.sender&&d.sender.username)||d.username||d.gifter_username||
                   (d.gifter&&d.gifter.username)||(d.user&&d.user.username);
        var amount=d.amount||d.kicks||d.quantity||d.kicks_amount||
                   (d.gift&&(d.gift.amount||d.gift.quantity||d.gift.tier));
        if (short==='GiftsLeaderboardUpdated' && !amount) return;
        var giftName=(d.gift&&(d.gift.name||d.gift.gift_name))||d.gift_name||'';
        var text=deepMessage(d);
        if (text && giftName && text===giftName) text=null;   // no repitas el nombre del regalo
        addEvent({type:'kicks', html:nm(sender)+' mandó '+(amount?esc(amount)+' Kicks':'Kicks'),
                  sub:giftName?esc(giftName):null, key:kicksKey(sender, amount), ck:kicksKey(sender, amount),
                  msg:text?emotes(text):null, src:'kick', kicks:num(amount)});
        return;
      }

      case 'RewardRedeemedEvent': {
        var title=d.reward_title||d.title||'recompensa';
        // Se agrupa por recompensa, sin importar quién la canjeó:
        // el spam casi siempre viene de gente distinta.
        var who = String(d.username||'Alguien');
        var rkey = 'r:'+title.toLowerCase();

        var hit = bump(rkey, CFG.rwwin, function(e){
          e.users = e.users || [];
          if (e.users.indexOf(who) === -1 && e.users.length < 15) e.users.push(who);
          e.html = '<span class="name">'+esc(title)+'</span> canjeada';
          e.sub  = 'Por: '+esc(e.users.join(', ')) +
                   (e.n > e.users.length ? '…' : '');
        });
        if (hit){ rewardAlert(rkey, title, hit.n); return; }

        push('reward', nm(who)+' canjeó “'+esc(title)+'”',
             d.user_input?esc(d.user_input):null, rkey);
        if (LOG.length && LOG[0].key===rkey) LOG[0].users=[who];
        return;
      }

      case 'StreamHostEvent':
      case 'StreamHostedEvent': {
        var hu=d.host_username||d.hostUsername;
        var v=Number(d.number_viewers||d.numberViewers||0);
        addEvent({type:'host', html:nm(hu)+' te hosteó'+(v?' con '+plural(v,'viewer','viewers'):''),
                  sub:d.optional_message?esc(d.optional_message):null,
                  key:'h:'+hu+':'+v, ck:'host:'+lc(hu), src:'kick'});
        return;
      }

      case 'StreamerIsLive':
        viewers=null; paintViewers(); pollViewers();
        push('live','<span class="name">Stream en vivo</span>',
             (d.livestream&&d.livestream.session_title)?esc(d.livestream.session_title):null,'live:on');
        return;
      case 'StopStreamBroadcast':
        viewers=0; paintViewers();
        push('live','<span class="name">Stream terminado</span>',null,'live:off');
        return;

      /* ---- Moderación ---- */
      case 'UserBannedEvent': {
        var u=(d.user&&d.user.username)||d.username;
        var by=(d.banned_by&&d.banned_by.username)||'';
        var exp=parseFuture(d.expires_at);
        var mins=d.duration ? Number(d.duration) : (exp ? Math.max(1,(exp-Date.now())/60000) : 0);
        var perm = d.permanent===true || !mins;
        var said = lastMsgsHtml(u);
        recentBan[lc(u)] = Date.now();
        addEvent({type:'mod', ic:'⛔',
                  html: nm(u)+(perm ? ' fue baneado' : ' fue silenciado '+fmtDur(mins)),
                  sub: [by?'Por '+esc(by):'', perm?'Permanente':'', said?'':'No alcancé a ver qué escribió']
                        .filter(Boolean).join(' · '),
                  msg: said || null, fold:1, key:'b:'+lc(u), ck:'ban:'+lc(u), src:'kick'});
        return;
      }
      case 'UserUnbannedEvent': {
        var u2=(d.user&&d.user.username)||d.username;
        var by2=(d.unbanned_by&&d.unbanned_by.username)||'';
        push('mod', nm(u2)+' fue desbaneado', by2?'Por '+esc(by2):null, 'ub:'+u2);
        return;
      }
      case 'MessageDeletedEvent': {
        var mid=(d.message&&d.message.id)||d.message_id||d.id;
        var ai=!!(d.aiModerated||d.ai_moderated);
        var rules=(d.violatedRules||d.violated_rules||[]).join(', ');
        // Se espera un poco: cuando silencian a alguien, Kick también le
        // borra sus mensajes, y eso ya sale en la línea del silencio.
        setTimeout(function(){
          var mm=MBYID[mid];
          if (!mm && !ai) return;
          if (mm && recentBan[lc(mm.u)] && Date.now()-recentBan[lc(mm.u)] < 30000) return;
          addEvent({type:'mod', ic:'🗑',
                    html: mm ? 'Le borraron un mensaje a '+nm(mm.u) : 'Kick borró un mensaje',
                    sub: ai ? 'Lo quitó el filtro automático de Kick'+(rules?' · '+esc(rules):'') : null,
                    msg: mm ? emotes(mm.t) : null, fold:1, key:'del:'+mid, src:'kick'});
        }, 2500);
        return;
      }
      case 'PinnedMessageCreatedEvent': {
        var pm=d.message||{};
        push('mod','<span class="name">Mensaje fijado</span>',null,'pin:'+(pm.id||''),
             pm.content?emotes(pm.content):null);
        return;
      }

      case 'ChatMessageEvent':
      case 'ChatMessageSentEvent': {
        var s=d.sender||{};
        var content=d.content||d.message||'';
        // Kick manda como "celebration" tanto los Kicks como las resubs
        // que la gente comparte. Hay que distinguirlos o las resubs
        // terminan apareciendo como "mandó Kicks".
        if (isCelebration(d)){ handleCelebration(d); return; }
        if (isBot(s.username) || CFG.tipAll){ botMessage(s.username, content, d.id); return; }
        // El chat normal no se guarda en el feed: solo se recuerda un
        // ratito para la moderación.
        rememberMsg(s.username, d.id, content, Date.now());
        return;
      }

      case 'ChatroomUpdatedEvent': case 'ChatroomClearEvent':
      case 'PollUpdateEvent': case 'PinnedMessageDeletedEvent': case 'LivestreamUpdated':
      case 'UpdatedLiveStreamEvent': case 'TitleChangedEvent':
        return;

      default:
        if (CFG.debug)
          push('sys','[debug] '+esc(short),'<code>'+esc(JSON.stringify(d).slice(0,300))+'</code>');
        return;
    }
  }

  /* ============================================================
     RECUPERAR LO QUE PASÓ SIN SEÑAL
     Si tu celular se queda sin internet (o se apaga la pantalla y la
     página se congela), al volver se lee el historial del chat de Kick
     y se rescatan los anuncios de Botrix y los Kicks de ese rato. Cada
     uno entra en su hora y sin duplicarse. Arriba queda una línea que
     dice cuánto duró el corte y qué se recuperó.
     ============================================================ */
  function historyUrls(){
    var u=[];
    if (CFG.channelId) u.push('https://kick.com/api/v2/channels/'+CFG.channelId+'/messages');
    if (CFG.slug) u.push('https://kick.com/api/v2/channels/'+encodeURIComponent(CFG.slug)+'/messages');
    return u;
  }
  function fetchHistory(){
    var urls=historyUrls(), i=0;
    function next(){
      if (i>=urls.length) return Promise.reject(new Error('sin historial'));
      var url=urls[i++];
      return fetch(url,{cache:'no-store'}).then(function(r){
        if (!r.ok) throw new Error('HTTP '+r.status);
        return r.json();
      }).then(function(j){
        var arr=(j&&j.data&&(j.data.messages||j.data))||j.messages||j;
        if (!Array.isArray(arr)) throw new Error('formato');
        return arr.map(function(m){
          var meta=m.metadata;
          if (typeof meta==='string'){ try{ meta=JSON.parse(meta); }catch(e){ meta={}; } }
          return {id:m.id, content:m.content||'', type:m.type, metadata:meta||{},
                  sender:m.sender||{username:m.username}, ts:Date.parse(m.created_at)||0};
        }).filter(function(m){ return m.ts; })
          .sort(function(a,b){ return a.ts-b.ts; });
      }).catch(function(e){ if (i<urls.length) return next(); throw e; });
    }
    return next();
  }

  var recovering=false;
  function recover(from, to, reason){
    if (recovering || !from) return;
    recovering=true;
    // 1) el chat de Kick (para las donaciones que anuncia Botrix)
    var hist=fetchHistory().then(function(msgs){
      var oldest=msgs.length?msgs[0].ts:to, got=0;
      msgs.forEach(function(m){
        if (m.ts < from-5000) return;           // eso ya lo tenías
        var u=(m.sender||{}).username;
        var lenBefore=LOG.length;
        if (isCelebration(m)) handleCelebration({id:m.id, sender:m.sender, content:m.content,
                                                 type:m.type, metadata:m.metadata}, m.ts);
        else if (isBot(u)) botMessage(u, m.content, m.id, m.ts);
        else rememberMsg(u, m.id, m.content, m.ts);
        if (LOG.length>lenBefore) got++;
      });
      var partial = msgs.length>=20 && oldest > from+3000;
      logRaw('RECUPERACIÓN chat '+hhmm(from)+'–'+hhmm(to)+': '+msgs.length+' mensajes, '+got+' eventos'+(partial?' (incompleto desde '+hhmm(oldest)+')':''));
      return {got:got, partial: partial ? oldest : 0};
    }).catch(function(e){
      logRaw('RECUPERACIÓN chat falló: '+(e&&e.message));
      return {got:0, failed:true};
    });
    // 2) tu servidor (subs, resubs, regalos y Kicks exactos)
    var api=apiPoll();
    Promise.all([hist, api]).then(function(r){
      var h=r[0], a=r[1]||0;
      noteGap(from, to, reason, h.got+a, h.partial||0, !!h.failed);
    }).then(function(){ recovering=false; }, function(){ recovering=false; });
  }

  function logRaw(t){
    RAW.unshift(hhmm(Date.now())+' '+t); RAW=RAW.slice(0,60);
    if (CFG.keep) LSset('kickfeed.raw', JSON.stringify(RAW));
  }

  function recTxt(n){ return n===1 ? 'Se recuperó 1 evento' : 'Se recuperaron '+n+' eventos'; }
  // La línea de aviso. Solo aparece si el corte fue real.
  function gapSub(got, partialFrom, failed){
    if (apiOk){
      // Con el servidor, subs y Kicks siempre están completos. Lo único
      // que depende del chat son las donaciones que anuncia Botrix.
      return (got ? recTxt(got)+' de ese rato' : 'No hubo actividad en ese rato') +
             ((failed||partialFrom) ? ' · <b>puede faltar alguna donación</b>' : '');
    }
    if (failed && !got) return '<b>No pude revisar el historial del chat</b>: puede faltar algo de ese rato';
    if (partialFrom) return (got?recTxt(got)+'. ':'')+
                     '<b>Puede faltar algo</b>: el chat de Kick solo guarda desde las '+hhmm(partialFrom);
    return got ? recTxt(got)+' de ese rato' : 'No hubo actividad en ese rato';
  }
  function noteGap(from, to, reason, got, partialFrom, failed){
    var secs=(to-from)/1000;
    var real = reason==='close' ? secs>=15 : reason==='load' ? (secs>=30 && secs<=3*3600) : false;
    // Si ya hay un aviso de este mismo corte, se actualiza en lugar de repetir.
    for (var i=0;i<Math.min(LOG.length,40);i++){
      var e=LOG[i];
      if (e.type==='gap' && Math.abs((e.from||0)-from) < 90000){
        e.from=Math.min(e.from,from); e.to=Math.max(e.to,to); e.got=(e.got||0)+got;
        if (partialFrom) e.partial=partialFrom;
        e.html='Sin conexión de '+hhmm(e.from)+' a '+hhmm(e.to);
        e.sub=gapSub(e.got, e.partial, failed);
        saveLog(true); scheduleRepaint(); return;
      }
    }
    if (!got && !real) return;                 // se congeló un ratito y no pasó nada: no estorbar
    addEvent({type:'gap', html:'Sin conexión de '+hhmm(from)+' a '+hhmm(to),
              sub:gapSub(got, partialFrom, failed), ts:to,
              extra:{from:from, to:to, got:got, partial:partialFrom||0}});
  }

  /* ---- detectar cortes ---- */
  var gapFrom=0, gapReason='';
  var prevAlive=parseInt(LSget('kickfeed.alive','0'),10)||0;
  if (prevAlive && Date.now()-prevAlive > 20000){ gapFrom=prevAlive; gapReason='load'; }
  function markAlive(){ LSset('kickfeed.alive', String(Date.now())); }
  window.addEventListener('pagehide', function(){ if (ws && ws.readyState===1) markAlive(); });

  // Si la página se congela (pantalla apagada, app en segundo plano),
  // el reloj "brinca". Entonces se revisa el historial por si acaso.
  var tick=Date.now();
  setInterval(function(){
    var now=Date.now();
    var up = ws && ws.readyState===1;
    if (up && lastUp && now-lastUp > 75000 && now-tick < 20000){
      // La conexión se quedó "pegada" sin avisar (pasa en datos móviles):
      // Kick no contestó el ping, así que se cierra y se vuelve a abrir.
      if (!gapFrom){ gapFrom=lastUp; gapReason='close'; }
      try{ ws.close(); }catch(e){}
      up=false;
    }
    if (up && now-lastUp < 75000) markAlive();
    if (now-tick > 20000 && ws && ws.readyState===1 && !gapFrom){
      var f=tick; setTimeout(function(){ recover(f, now, 'freeze'); }, 1500);
    }
    tick=now;
  }, 5000);

  /* ============================================================
     CONEXIÓN PUSHER
     ============================================================ */
  var PUSHER_KEY='32cbd69e4b950bf97679';
  var WS_URL='wss://ws-us2.pusher.com/app/'+PUSHER_KEY+
             '?protocol=7&client=js&version=8.4.0-rc2&flash=false';
  var ws=null, retry=0, pingTimer=null, lastUp=0;

  function channels(){
    var c=[];
    if (CFG.chatroomId){
      c.push('chatrooms.'+CFG.chatroomId+'.v2');
      c.push('chatrooms.'+CFG.chatroomId);
      c.push('chatroom_'+CFG.chatroomId);
    }
    if (CFG.channelId){
      c.push('channel.'+CFG.channelId);
      c.push('channel_'+CFG.channelId);
      c.push('predictions-channel-'+CFG.channelId);
    }
    return c;
  }

  function connect(){
    if (!CFG.chatroomId && !CFG.channelId){
      push('sys','Falta configurar el canal.','Agrega <code>?chatroom=ID&amp;channelid=ID</code> a la URL.');
      return;
    }
    try{ ws=new WebSocket(WS_URL); }catch(e){ scheduleReconnect(); return; }

    ws.onopen=function(){ retry=0; };

    ws.onmessage=function(ev){
      var msg; try{ msg=JSON.parse(ev.data); }catch(e){ return; }
      lastUp=Date.now();

      if (msg.event==='pusher:connection_established'){
        $dot.classList.add('on');
        channels().forEach(function(ch){
          ws.send(JSON.stringify({event:'pusher:subscribe',data:{auth:'',channel:ch}}));
        });
        clearInterval(pingTimer);
        pingTimer=setInterval(function(){
          if (ws && ws.readyState===1) ws.send(JSON.stringify({event:'pusher:ping',data:{}}));
        },30000);
        markAlive();
        // Se volvió a conectar después de un corte: a recuperar.
        if (gapFrom){
          var f=gapFrom, r=gapReason; gapFrom=0; gapReason='';
          setTimeout(function(){ recover(f, Date.now(), r); }, 1500);
        }
        return;
      }
      if (msg.event==='pusher:ping'){ ws.send(JSON.stringify({event:'pusher:pong',data:{}})); return; }
      if (msg.event==='pusher:pong'||msg.event==='pusher_internal:subscription_succeeded') return;
      if (msg.event==='pusher:error'){ if(CFG.debug) console.warn('[kickfeed] pusher error',msg); return; }

      var data=msg.data;
      if (typeof data==='string'){ try{ data=JSON.parse(data); }catch(e){ data={}; } }
      handle(msg.event, data||{}, msg.channel);
    };

    ws.onclose=function(){
      $dot.classList.remove('on'); clearInterval(pingTimer);
      if (!gapFrom && lastUp){ gapFrom=Math.max(lastUp, tick-5000); gapReason='close'; }
      scheduleReconnect();
    };
    ws.onerror=function(){ try{ ws.close(); }catch(e){} };
  }

  function scheduleReconnect(){
    retry++;
    setTimeout(connect, Math.min(30000, 1000*Math.pow(1.6, Math.min(retry,10))));
  }

  document.addEventListener('visibilitychange',function(){
    if (!document.hidden){
      pollViewers();
      if (!ws||ws.readyState>1){ retry=0; connect(); }
    }
  });

  /* ============================================================
     TU SERVIDOR (VÍA OFICIAL DE KICK)
     Kick le avisa a tu servidor de cada sub, resub, regalo, Kicks, follow
     y ban, aunque el feed esté cerrado o sin señal. El feed le pregunta
     cada 20 s (y al reconectar) y acomoda lo que falte en su hora. Los
     contadores ★ y ⚡ salen de ahí: son exactos y no se reinician si el
     stream se corta y vuelve en menos de 30 minutos.
     ============================================================ */
  var apiOk=null, apiBusy=false, apiLast=0, apiInfo=null;
  var apiCursor=parseInt(LSget('kickfeed.apicur','0'),10)||0;
  var APIIDS=[];
  try{ APIIDS=JSON.parse(LSget('kickfeed.apiids','[]'))||[]; }catch(e){ APIIDS=[]; }
  function seenApiId(id){
    if (!id) return false;
    if (APIIDS.indexOf(id)!==-1) return true;
    APIIDS.push(id); if (APIIDS.length>800) APIIDS=APIIDS.slice(-600);
    LSset('kickfeed.apiids', JSON.stringify(APIIDS));
    return false;
  }

  function apiEvent(e){
    var d=e.d||{}, ts=e.ts||Date.now(), u=d.user||'';
    switch(d.kind){
      case 'sub':
        return addEvent({type:'sub', html:nm(u)+' se suscribió', sub:'Sub nueva',
                         ck:'sub:'+lc(u), src:'api', ts:ts, subs:1});
      case 'resub':
        return addEvent({type:'sub', html:nm(u)+' se resuscribió', cls:'resub',
                         sub: d.months>1 ? plural(d.months,'mes','meses')+' seguidos' : 'Resub',
                         ck:'sub:'+lc(u), src:'api', ts:ts, subs:1});
      case 'gift': {
        var g=d.giftees||[], c=Number(d.count)||g.length||1;
        return addEvent({type:'gift', html:nm(u||'Anónimo')+' regaló '+plural(c,'sub','subs'),
                         sub: g.length ? 'Para: '+esc(g.slice(0,10).join(', '))+(g.length>10?'…':'') : null,
                         ck:'gift:'+lc(u), src:'api', ts:ts, subs:c});
      }
      case 'kicks':
        return addEvent({type:'kicks', html:nm(u)+' mandó '+esc(d.amount)+' Kicks',
                         sub: d.name ? esc(d.name) : null, msg: d.message ? emotes(d.message) : null,
                         ck:kicksKey(u, d.amount), src:'api', ts:ts, kicks:num(d.amount)});
      case 'follow':
        return addEvent({type:'follow', html:nm(u)+' te siguió', ck:'follow:'+lc(u), src:'api', ts:ts});
      case 'ban': {
        var exp=parseFuture(d.expires_at), mins = exp ? Math.max(1,(exp-ts)/60000) : 0;
        var said=lastMsgsHtml(u);
        return addEvent({type:'mod', ic:'⛔', html: nm(u)+(mins ? ' fue silenciado '+fmtDur(mins) : ' fue baneado'),
                         sub: [d.mod?'Por '+esc(d.mod):'', !mins?'Permanente':'', d.reason?'Motivo: '+esc(d.reason):'']
                               .filter(Boolean).join(' · '),
                         msg: said || null, fold:1, ck:'ban:'+lc(u), src:'api', ts:ts});
      }
    }
    return null;
  }

  // Totales exactos del servidor + lo que Kick acaba de mandar en vivo y
  // el servidor todavía no confirma (para que el número no "brinque").
  function applyTotals(t){
    var now=Date.now(), xs=0, xk=0;
    LOG.forEach(function(e){
      if (e.src!=='api' && e.ts>=now-120000 && e.ts>=t.from-60000){ xs+=e.subs||0; xk+=e.kicks||0; }
    });
    sess.subs=(t.subs||0)+xs; sess.kicks=(t.kicks||0)+xk;
    saveSess(); paintSubs(); paintKicks();
    $sb.title='Subs de la sesión: '+(t.newSubs||0)+' nuevas, '+(t.resubs||0)+' resubs, '+(t.gifted||0)+' regaladas';
  }

  // Devuelve cuántas líneas nuevas agregó (lo que el feed no había visto).
  function apiPoll(){
    if (!CFG.api || apiBusy) return Promise.resolve(0);
    apiBusy=true;
    var since = apiCursor || (Date.now()-12*3600e3);
    var url = CFG.api+'/api/events?since='+since+'&from='+(startMs||0);
    return fetch(url,{cache:'no-store'}).then(function(r){ return r.json(); }).then(function(j){
      if (!j || !j.ok) throw new Error((j&&j.error)||'respuesta rara');
      var got=0;
      (j.events||[]).forEach(function(e){
        if (seenApiId(e.id)) return;
        var before=LOG.length;
        apiEvent(e);
        if (LOG.length>before) got++;
      });
      if (j.cursor && j.cursor>apiCursor){ apiCursor=j.cursor; LSset('kickfeed.apicur', String(apiCursor)); }
      if (j.totals) applyTotals(j.totals);
      apiOk=true; apiLast=Date.now(); apiInfo=j;
      paintApi();
      if (PL.kind){
        var hit=(j.events||[]).some(function(e){ var k=(e.d||{}).kind;
          return PL.kind==='kicks' ? k==='kicks' : (k==='sub'||k==='resub'||k==='gift'); });
        if (hit) reloadList(); else renderList();
      }
      return got;
    }).catch(function(e){
      apiOk=false; paintApi();
      logRaw('SERVIDOR no respondió: '+(e&&e.message));
      return 0;
    }).then(function(n){ apiBusy=false; return n; });
  }

  /* Estado del servidor en el ⚙ */
  var ab=document.createElement('div');
  ab.className='chip wide'; ab.style.cssText='cursor:default';
  function paintApi(){
    if (!CFG.api){ ab.textContent='🛰  Servidor apagado (?api=0)'; return; }
    if (apiOk===null){ ab.textContent='🛰  Servidor: conectando…'; return; }
    if (!apiOk){ ab.textContent='🛰  Servidor: sin respuesta (se usa solo Kick en vivo + Botrix)'; return; }
    var lh=apiInfo&&apiInfo.lastHook;
    ab.textContent='🛰  Servidor conectado ✓'+(lh?' · último aviso de Kick '+hhmm(lh):'');
  }
  paintApi();
  $filt.insertBefore(ab, ver);
  if (CFG.api){
    setTimeout(apiPoll, 800);
    setInterval(function(){ if (!document.hidden) apiPoll(); }, 20000);
    document.addEventListener('visibilitychange', function(){ if (!document.hidden) apiPoll(); });
  }

  /* ============================================================
     PANELES ★ (QUIÉN SE SUSCRIBIÓ) Y ⚡ (QUIÉN MANDÓ KICKS)
     Tocas ★ o ⚡ en la barra y se abre la lista completa que guarda
     tu servidor: lo más nuevo arriba y, conforme bajas, lo de días
     anteriores con una rayita por día. Se cierra tocando otra vez.
     ============================================================ */
  var $pl=document.getElementById('plist'), $plTtl=document.getElementById('plTtl'),
      $plSum=document.getElementById('plSum'), $plList=document.getElementById('plList');
  var PL={kind:null, items:[], more:false, loading:false, err:false};

  function toggleList(kind){
    if (PL.kind===kind){ closeList(); return; }
    if (graphOpen) closeGraph();
    PL={kind:kind, items:[], more:true, loading:false, err:false};
    $pl.classList.add('show');
    $sb.classList.toggle('open', kind==='subs'); $kc.classList.toggle('open', kind==='kicks');
    renderList(); loadPage();
    if (CFG.api) apiPoll();
  }
  function closeList(){
    PL.kind=null; $pl.classList.remove('show');
    $sb.classList.remove('open'); $kc.classList.remove('open');
  }
  $sb.onclick=function(){ toggleList('subs'); };
  $kc.onclick=function(){ toggleList('kicks'); };
  $pl.querySelector('.ph').onclick=closeList;

  function loadPage(){
    if (!PL.kind || PL.loading || !PL.more) return;
    if (!CFG.api){ PL.err=true; PL.more=false; renderList(); return; }
    PL.loading=true; var kind=PL.kind;
    var last=PL.items[PL.items.length-1];
    var url=CFG.api+'/api/list?kind='+kind+'&limit=40'+(last?'&before='+last.ts:'');
    fetch(url,{cache:'no-store'}).then(function(r){ return r.json(); }).then(function(j){
      if (PL.kind!==kind) return;
      if (!j || !j.ok) throw new Error('x');
      PL.items=PL.items.concat(j.events||[]); PL.more=!!j.more; PL.err=false;
    }).catch(function(){ if (PL.kind===kind){ PL.err=true; PL.more=false; } })
      .then(function(){ PL.loading=false; renderList(); });
  }
  // Recarga la primera página (cuando llegan subs o Kicks nuevos).
  function reloadList(){
    if (!PL.kind || PL.loading) return;
    var k=PL.kind; PL={kind:k, items:[], more:true, loading:false, err:false};
    loadPage();
  }
  $plList.addEventListener('scroll', function(){
    if ($plList.scrollTop + $plList.clientHeight > $plList.scrollHeight - 80) loadPage();
  });

  // Una fila por persona: una sub regalada a 3 personas son 3 filas.
  function listRows(e){
    var d=e.d||{}, out=[];
    if (PL.kind==='subs'){
      if (d.kind==='sub') out.push({u:d.user, tag:'Nueva', cls:'kn', n:1});
      else if (d.kind==='resub') out.push({u:d.user, tag: d.months>1 ? 'Resub · '+d.months+' meses' : 'Resub', cls:'kr', n:1});
      else if (d.kind==='gift'){
        var by = d.user ? 'Regalada por '+d.user : 'Regalada (anónimo)';
        if ((d.giftees||[]).length) d.giftees.forEach(function(g){ out.push({u:g, tag:by, cls:'kg', n:1}); });
        else out.push({u:d.user||'Anónimo', tag:'Regaló '+(d.count||1), cls:'kg', n:d.count||1});
      }
    } else if (d.kind==='kicks'){
      out.push({u:d.user, tag:'⚡ '+Number(d.amount||0).toLocaleString('es-MX'), cls:'kk', n:Number(d.amount)||0,
                sub:[d.name, d.message].filter(Boolean).join(' · ')});
    }
    return out;
  }

  function renderList(){
    if (!PL.kind) return;
    var subs=PL.kind==='subs', t=apiInfo&&apiInfo.totals;
    $plTtl.textContent = subs ? '★ Subs de la sesión · '+(sess.subs||0)
                              : '⚡ Kicks de la sesión · '+Number(sess.kicks||0).toLocaleString('es-MX');
    var sum='';
    if (subs && t) sum='<b style="color:var(--c-sub)">'+plural(t.newSubs||0,'nueva','nuevas')+'</b>'+
                       '<b style="color:var(--c-resub)">'+plural(t.resubs||0,'resub','resubs')+'</b>'+
                       '<b style="color:var(--c-gift)">'+plural(t.gifted||0,'regalada','regaladas')+'</b>';
    if (!subs && t){
      var from=t.from||0, n=0, who={};
      PL.items.forEach(function(e){ if (e.ts>=from-60000){ n++; who[lc(e.d&&e.d.user)]=1; } });
      sum='<b style="color:var(--c-kicks)">'+plural(n,'envío','envíos')+'</b><b>'+plural(Object.keys(who).length,'persona','personas')+'</b>';
    }
    $plSum.innerHTML=sum; $plSum.style.display=sum?'':'none';

    // Agrupado por día, con el total de cada día.
    var groups=[], cur=null;
    PL.items.forEach(function(e){
      var k=dayKey(e.ts);
      if (!cur || cur.k!==k){ cur={k:k, ts:e.ts, rows:[], total:0}; groups.push(cur); }
      listRows(e).forEach(function(r){ r.ts=e.ts; cur.rows.push(r); cur.total+=r.n; });
    });
    var h='';
    groups.forEach(function(g, gi){
      var complete = gi<groups.length-1 || !PL.more;
      h+='<div class="dsep"><span>'+dayLabel(g.ts)+'</span><span>'+
         (complete ? (subs ? plural(g.total,'sub','subs') : Number(g.total).toLocaleString('es-MX')+' Kicks') : '…')+'</span></div>';
      g.rows.forEach(function(r){
        h+='<div class="prow"><span class="t">'+hhmm(r.ts)+'</span><span class="n">'+esc(r.u||'—')+
           (r.sub?'<span class="m">'+emotes(r.sub)+'</span>':'')+'</span><span class="k '+r.cls+'">'+esc(r.tag)+'</span></div>';
      });
    });
    if (PL.loading) h+='<div class="pmore">Cargando…</div>';
    else if (PL.err) h+='<div class="pmore">No pude cargar la lista del servidor. Toca ★ o ⚡ para reintentar.</div>';
    else if (!PL.items.length) h+='<div class="pmore">'+(subs?'Todavía no hay subs guardadas':'Todavía no hay Kicks guardados')+'</div>';
    else if (!PL.more) h+='<div class="pmore">Es todo lo que hay guardado</div>';
    $plList.innerHTML=h;
  }

  /* Botón de prueba en el ⚙: ¿tu celular puede leer el historial del chat? */
  var hb=document.createElement('button');
  hb.className='chip wide'; hb.textContent='🔎  Probar historial del chat';
  hb.onclick=function(){
    hb.textContent='🔎  Probando…';
    fetchHistory().then(function(m){
      hb.textContent = m.length ? '✅  Sí funciona: '+m.length+' mensajes, desde las '+hhmm(m[0].ts)
                                : '⚠️  Respondió, pero sin mensajes';
    }).catch(function(e){
      var why=String(e&&e.message||'');
      hb.textContent='❌  No se pudo leer el historial'+(/40[13]|429/.test(why)?' (Kick lo bloqueó)':
                       /formato/.test(why)?' (Kick respondió algo inesperado)':' (sin conexión o bloqueado)');
    });
  };
  $filt.insertBefore(hb, ver);

  connect();
