<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kick Activity Feed</title>
<style>
  :root{
    --bg: #0e0f13;
    --panel: rgba(255,255,255,.04);
    --line: rgba(255,255,255,.08);
    --txt: #e8eaee;
    --dim: #9aa1ad;
    --kick: #53fc18;
    --c-follow: #3ea6ff;   /* azul */
    --c-sub:    #53fc18;   /* verde Kick */
    --c-resub:  #ffd93d;   /* amarillo */
    --c-gift:   #ff4d4d;   /* rojo */
    --c-kicks:  #a970ff;   /* morado, como los bits de Twitch */
    --c-tip:    #2ee6c5;   /* turquesa */
    --c-reward: #ff6bd6;   /* rosa */
    --c-host:   #ff9f1c;
    --c-live:   #d7dde6;
    --c-mod:    #a05a5a;
    --c-chat:   #8f97a3;
    --row: 15px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    margin:0;background:var(--bg);color:var(--txt);
    font-family:"Inter","Segoe UI",Roboto,system-ui,-apple-system,sans-serif;
    font-size:var(--row);overflow:hidden;display:flex;flex-direction:column;
  }
  body.transparent{background:transparent}
  body.transparent .item{background:transparent}
  body.transparent .item .line{text-shadow:0 1px 3px rgba(0,0,0,.95),0 0 8px rgba(0,0,0,.7)}

  /* ---------- barra superior ---------- */
  #bar{
    --bs:1;                /* escala automática: ver fitBar() */
    flex:0 0 auto;display:flex;align-items:center;gap:calc(6px*var(--bs));
    padding:7px calc(9px*var(--bs));border-bottom:1px solid var(--line);
    background:rgba(0,0,0,.35);font-size:12px;color:var(--dim);
  }
  /* El bitrate queda clavado a la derecha; si algo tiene que
     recorrerse por falta de espacio, es el grupo del centro. */
  #stats{flex:1 1 auto;min-width:0;overflow-x:auto;scrollbar-width:none;justify-content:flex-end}
  #stats::-webkit-scrollbar{display:none}
  #pBela{flex:0 0 auto;margin-left:5px}
  body.nobar #bar{display:none}
  /* el nombre del canal solo se esconde si de verdad no cabe */
  /* Verde = conectado al chat de Kick. Rojo parpadeando = se cayó. */
  #dot{flex:0 0 auto;width:9px;height:9px;border-radius:50%;background:#ff3b30;
       animation:blink 1.2s ease-in-out infinite}
  #dot.on{background:var(--kick);box-shadow:0 0 8px var(--kick);animation:none}
  #stats{margin-left:auto;display:flex;gap:calc(3px*var(--bs));align-items:center;
         flex:0 1 auto;min-width:0;justify-content:flex-end}
  .pill{background:var(--panel);border:1px solid var(--line);border-radius:20px;
        padding:3px calc(7px*var(--bs));white-space:nowrap;cursor:pointer;user-select:none;
        color:var(--dim);font-size:calc(11px*var(--bs));font-variant-numeric:tabular-nums;
        flex:0 0 auto}
  .pill.on{color:var(--txt)}
  .pill.live{border-color:rgba(83,252,24,.35)}
  #pSubs.has{color:var(--c-sub)}
  #pKicks.has{color:var(--c-kicks)}

  /* ---------- panel de bitrate (se abre al tocar la píldora) ----------
     Estilo IRL Toolkit: eje a la izquierda, línea amarilla = Low,
     línea roja = Offline, un punto por cada tramo de 3 segundos. */
  #graph{display:none;flex:0 0 auto;padding:9px 12px 7px;
         border-bottom:1px solid var(--line);background:#181b21}
  #graph.show{display:block}
  #graph .hd{display:flex;align-items:baseline;gap:8px}
  #graph .hd .ttl{font-size:14px;font-weight:700;color:var(--txt)}
  #graph .hd .big{margin-left:auto;font-size:17px;font-weight:800;font-variant-numeric:tabular-nums}
  #graph .hd .rtt{font-size:11px;color:var(--dim);font-variant-numeric:tabular-nums}
  #graph .lg{display:flex;align-items:center;gap:12px;margin-top:3px;font-size:10.5px;color:var(--dim)}
  #graph .lg i{display:inline-block;width:12px;height:2px;border-radius:1px;
               vertical-align:middle;margin-right:4px}
  #graph .lg .r{margin-left:auto}
  #graph svg{display:block;width:100%;height:clamp(140px,32vh,210px);margin-top:6px;overflow:visible}
  #graph .sc{display:flex;justify-content:space-between;font-size:10px;color:#7d8490;
             margin-top:1px;padding-left:28px}
  /* ---------- paneles ★ y ⚡: quién se suscribió / quién mandó Kicks ---------- */
  #plist{display:none;flex:0 0 auto;border-bottom:1px solid var(--line);background:#181b21}
  #plist.show{display:flex;flex-direction:column;max-height:52vh}
  #plist .ph{display:flex;align-items:center;gap:8px;padding:10px 12px 4px;cursor:pointer}
  #plist .ph .ttl{font-size:15px;font-weight:700}
  #plist .ph .x{margin-left:auto;font-size:10.5px;color:var(--dim)}
  #plist .sum{display:flex;gap:6px;flex-wrap:wrap;padding:4px 12px 6px}
  #plist .sum b{font-size:11.5px;font-weight:600;padding:3px 8px;border-radius:12px;background:rgba(255,255,255,.05)}
  #plist .pl{overflow-y:auto;padding:0 12px 8px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
  #plist .dsep{display:flex;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);
               padding:9px 2px 4px;border-top:1px solid rgba(255,255,255,.14);margin-top:2px}
  #plist .dsep span:last-child{margin-left:auto;letter-spacing:.04em}
  #plist .prow{display:flex;align-items:center;gap:8px;padding:6px 2px;border-top:1px solid rgba(255,255,255,.05);font-size:13.5px}
  #plist .dsep + .prow{border-top:0}
  #plist .prow .t{color:var(--dim);font-size:11.5px;width:38px;flex:0 0 auto;font-variant-numeric:tabular-nums}
  #plist .prow .n{font-weight:700;min-width:0;overflow-wrap:anywhere}
  #plist .prow .m{display:block;font-weight:400;font-size:11.5px;color:var(--dim)}
  #plist .prow .k{margin-left:auto;flex:0 0 auto;font-size:11px;padding:2px 7px;border-radius:10px;white-space:nowrap}
  #plist .kn{color:var(--c-sub);background:rgba(83,252,24,.12)}
  #plist .kr{color:var(--c-resub);background:rgba(255,217,61,.12)}
  #plist .kg{color:var(--c-gift);background:rgba(255,77,77,.12)}
  #plist .kk{color:var(--c-kicks);background:rgba(169,112,255,.14)}
  #plist .pmore{text-align:center;color:var(--dim);font-size:11.5px;padding:10px 4px}
  .pill.open{outline:2px solid currentColor;outline-offset:1px}

  /* El bitrate va hasta la derecha y más grande: es lo que más se
     consulta de reojo, y del lado izquierdo lo tapa el GPS. */
  #pBela{font-size:calc(13px*var(--bs));font-weight:700;padding:3px calc(9px*var(--bs))}
  #pBela.ok  {color:#53fc18;border-color:rgba(83,252,24,.5);background:rgba(83,252,24,.10)}
  #pBela.warn{color:#ffb020;border-color:rgba(255,176,32,.6);background:rgba(255,176,32,.12)}
  #pBela.down{color:#ff3b30;border-color:rgba(255,59,48,.7);background:rgba(255,59,48,.14);
              animation:blink 1.1s ease-in-out infinite}
  @keyframes blink{50%{opacity:.35}}
  .btn{cursor:pointer;padding:3px calc(6px*var(--bs));border-radius:8px;user-select:none;
       flex:0 0 auto;border:1px solid var(--line);background:transparent;color:#5d636d;
       font-size:calc(13px*var(--bs))}
  .btn:active{background:var(--panel)}
  .btn.on{color:var(--txt);border-color:rgba(255,255,255,.28)}
  #rwBtn.on{color:var(--c-reward);border-color:rgba(255,107,214,.45)}

  /* ---------- ajustes ---------- */
  #filters{display:none;flex-wrap:wrap;gap:6px;padding:8px 10px;
           border-bottom:1px solid var(--line);background:rgba(0,0,0,.45)}
  #filters.open{display:flex}
  .chip{font-size:12px;padding:4px 10px;border-radius:20px;cursor:pointer;
        border:1px solid var(--line);background:transparent;color:var(--dim)}
  .chip.on{background:var(--panel);color:var(--txt);border-color:rgba(255,255,255,.25)}
  .chip.wide{width:100%;text-align:left}

  /* ---------- avisos grandes (recompensas spameadas) ---------- */
  #alerts{position:fixed;left:0;right:0;top:0;z-index:25;display:flex;flex-direction:column}
  .alert{display:flex;align-items:center;gap:10px;padding:13px 14px;cursor:pointer;
         border-bottom:2px solid var(--c-reward);box-shadow:0 6px 24px rgba(0,0,0,.55);
         animation:drop .25s cubic-bezier(.2,.9,.3,1.2), pulse 1s ease-in-out infinite}
  @keyframes drop{from{transform:translateY(-100%);opacity:0}to{transform:none;opacity:1}}
  /* parpadea hasta que la toques, para que salte a la vista */
  @keyframes pulse{
    0%,100%{background:#241726; border-bottom-color:var(--c-reward);
            box-shadow:0 6px 24px rgba(0,0,0,.55)}
    50%    {background:#5a1247; border-bottom-color:#fff;
            box-shadow:0 6px 30px rgba(255,107,214,.55)}
  }
  @media (prefers-reduced-motion:reduce){ .alert{animation:drop .25s ease-out} }
  .alert .ttl{font-size:1.3em;font-weight:800;color:var(--c-reward);
              text-transform:uppercase;letter-spacing:.02em;
              word-wrap:break-word;overflow-wrap:anywhere;min-width:0}
  .alert .n{margin-left:auto;font-size:1.5em;font-weight:800;color:var(--txt);flex:0 0 auto}
  .alert .hint{position:absolute;right:14px;bottom:2px;font-size:10px;color:var(--dim)}

  /* ---------- feed ---------- */
  #feed{flex:1 1 auto;overflow-y:auto;overflow-x:hidden;padding:6px 0 14px;scrollbar-width:thin}
  #feed::-webkit-scrollbar{width:5px}
  #feed::-webkit-scrollbar-thumb{background:rgba(255,255,255,.15);border-radius:3px}

  .item{display:flex;gap:9px;align-items:flex-start;padding:8px 11px;
        border-bottom:1px solid var(--line);animation:in .28s ease-out}
  @keyframes in{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}

  /* separador de día */
  .day{padding:7px 11px 5px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;
       color:var(--dim);background:rgba(255,255,255,.03);border-bottom:1px solid var(--line);
       position:sticky;top:0;z-index:2}
  #more{display:block;width:calc(100% - 22px);margin:10px 11px;padding:9px;
        background:var(--panel);border:1px solid var(--line);color:var(--dim);
        border-radius:9px;font-size:13px;cursor:pointer}
  .item .ic{flex:0 0 auto;width:22px;height:22px;border-radius:6px;
            display:grid;place-items:center;font-size:12px;font-weight:700;background:rgba(255,255,255,.06)}
  .item .ic img{width:15px;height:15px;display:block}
  .item .body{flex:1 1 auto;min-width:0}
  .item .line{line-height:1.35;word-wrap:break-word;overflow-wrap:anywhere}
  .item .name{font-weight:700}
  .item .sub{display:block;color:var(--dim);font-size:.82em;margin-top:2px;
             word-wrap:break-word;overflow-wrap:anywhere}
  .item .msg{display:block;margin-top:4px;padding:5px 8px;border-radius:7px;
             background:rgba(255,255,255,.05);border-left:2px solid currentColor;
             font-size:.9em;color:var(--txt);word-wrap:break-word;overflow-wrap:anywhere}
  .item .mult{color:var(--dim);font-weight:400}
  .item .right{flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-end;gap:5px}
  .item .x{border:1px solid var(--line);border-radius:6px;color:var(--dim);
           font-size:12px;padding:0 7px;line-height:1.6;cursor:pointer}
  .item .x:active{background:var(--panel);color:var(--txt)}
  .item .t{color:var(--dim);font-size:.75em;padding-top:3px;font-variant-numeric:tabular-nums}
  body.notime .item .t{display:none}
  .item img.em{height:1.25em;vertical-align:-.25em}

  /* un color por tipo de evento; .resub pisa a .sub */
  .follow{--accent:var(--c-follow)}
  .sub   {--accent:var(--c-sub)}
  .sub.resub{--accent:var(--c-resub)}
  .gift  {--accent:var(--c-gift)}
  .kicks {--accent:var(--c-kicks)}
  .tip   {--accent:var(--c-tip)}
  .reward{--accent:var(--c-reward)}
  .host  {--accent:var(--c-host)}
  .live  {--accent:var(--c-live)}
  .mod   {--accent:var(--c-mod)}
  .chat  {--accent:#cfd4dc}
  .signal{--accent:#ff5f2e}
  .signal.up{--accent:#7cd992}
  .sys   {--accent:var(--dim)}

  .item .ic{color:var(--accent,var(--dim))}
  .item .name{color:var(--accent,var(--txt))}
  .item .msg{border-left-color:var(--accent,var(--line))}
  .item.tip .line{font-weight:600}
  .item.sys .line{color:var(--dim);font-size:.9em}
  /* aviso de corte de conexión */
  .gap   {--accent:#ffb020}
  .item.gap .line{color:var(--dim);font-size:.92em}
  .item.gap .sub b{color:#ffb020;font-weight:600}
  /* moderación: lo que escribió la persona se ve al tocar */
  .item.fold{cursor:pointer}
  .item.fold .msg{display:none}
  .item.fold.open .msg{display:block}
  .item .more{display:inline-block;margin-top:4px;font-size:.8em;color:#c9ced6;
              padding:2px 8px;border-radius:6px;background:rgba(255,255,255,.06)}
  .item.chat .ic{color:var(--c-chat)}

  /* ---------- panel de Botrix ---------- */
  #bx{flex:0 0 auto;display:none;flex-direction:column;border-top:2px solid var(--line);background:#0a0b0e}
  #bx.show{display:flex}
  #bxHead{display:flex;align-items:center;gap:8px;padding:5px 10px;font-size:11px;
          letter-spacing:.1em;text-transform:uppercase;color:var(--dim);background:rgba(255,255,255,.03)}
  #bxHead .x{margin-left:auto;cursor:pointer;padding:0 6px;font-size:15px}
  #bx iframe{width:100%;border:0;flex:1 1 auto;background:transparent}

  #empty{padding:26px 16px;text-align:center;color:var(--dim);font-size:13px;line-height:1.6}
  #empty b{color:var(--txt)}
  #test{position:fixed;right:10px;bottom:10px;z-index:30;display:none;
        background:var(--panel);border:1px solid var(--line);color:var(--txt);
        border-radius:10px;padding:8px 12px;font-size:13px;cursor:pointer}
  body.testmode #test{display:block}
</style>
</head>
<body>

<div id="alerts"></div>

<div id="bar">
  <span id="dot" title="Sin conexión con el chat"></span>
  <span id="stats">
    <span class="pill" id="pViewers" title="Viewers">👁</span>
    <span class="pill" id="pUptime" title="Tiempo en vivo">⏱ —</span>
    <span class="pill" id="pSubs" title="Subs de esta transmisión">★ 0</span>
    <span class="pill" id="pKicks" title="Kicks de esta transmisión">⚡ 0</span>
    <button class="btn" id="rwBtn" title="Recompensas">◆</button>
    <button class="btn" id="bxBtn" title="Panel de Botrix" style="display:none">💠</button>
    <button class="btn" id="gear" title="Ajustes">⚙</button>
  </span>
  <span class="pill" id="pBela" title="Bitrate Belabox" style="display:none">📶 —</span>
</div>

<div id="graph">
  <div class="hd"><span class="ttl">Bitrate</span><span class="big" id="gBig">—</span><span class="rtt" id="gRtt"></span></div>
  <div class="lg">
    <span><i style="background:#ffc107"></i><span id="gLow">Low</span></span>
    <span><i style="background:#ff453a"></i><span id="gOff">Offline</span></span>
    <span class="r" id="gWin">últimos 60 s</span>
  </div>
  <svg id="gSvg"></svg>
  <div class="sc"><span id="gL">hace 60 s</span><span>ahora</span></div>
</div>

<div id="plist">
  <div class="ph"><span class="ttl" id="plTtl"></span><span class="x">toca para cerrar</span></div>
  <div class="sum" id="plSum"></div>
  <div class="pl" id="plList"></div>
</div>

<div id="filters"></div>

<div id="feed">
  <div id="empty">
    Escuchando el canal de <b id="emptySlug">Kick</b>…<br><br>
    <span style="opacity:.7">El punto verde significa que ya está conectado.<br>
    Solo registra lo que pasa mientras esta página está abierta.</span>
  </div>
</div>

<div id="bx">
  <div id="bxHead"><span>Botrix — tips</span><span class="x" id="bxClose">×</span></div>
</div>

<button id="test">Evento de prueba</button>

<script>
(function(){
  "use strict";

  var VERSION = '35 · 10 oct 2026';   // se muestra abajo en el engrane ⚙

  /* ============================================================
     CONFIGURACIÓN  (todo se cambia por la URL)
       ?channel=mariotq
       ?chatroom=6635680&channelid=6692133
       ?bg=transparent  ?bar=0  ?time=0  ?font=18  ?max=300
       ?page=150        cuántos eventos pinta por tanda
       ?viewers=1       arranca mostrando el número de viewers
       ?vpoll=20        cada cuántos segundos consulta los viewers
       ?keep=0          no guardar el historial entre reinicios
       ?tipbot=a,b      nombres de bot que anuncian tips en el chat
       ?botrix=URL      panel con tu activity feed de Botrix abajo
       ?botrixh=45      altura de ese panel en % de pantalla
       ?blow=500        Low de NOALBS (línea amarilla, píldora amarilla)
       ?boff=300        Offline de NOALBS (línea roja, píldora roja)
       ?rlow=1200&roff=2000   RTT de NOALBS (colorea el RTT de la gráfica)
       ?bwin=60&bstep=3 la gráfica muestra 60 s, un punto cada 3 s
       ?debug=1         muestra los eventos crudos en el feed
       ?test=1          botón para inyectar eventos falsos
     ============================================================ */
  var Q = new URLSearchParams(location.search);
  var CFG = {
    slug:       (Q.get('channel') || Q.get('slug') || 'mariotq').toLowerCase().trim(),
    chatroomId:  Q.get('chatroom')  || '6635680',
    channelId:   Q.get('channelid') || '6692133',
    max:    parseInt(Q.get('max')   || '1000', 10),
    page:   parseInt(Q.get('page')  || '150', 10),
    vpoll:  parseInt(Q.get('vpoll') || '20', 10) * 1000,
    bg:         (Q.get('bg') || 'dark').toLowerCase(),
    bar:         Q.get('bar')  !== '0',
    time:        Q.get('time') !== '0',
    keep:        Q.get('keep') !== '0',
    viewersOn:   Q.get('viewers') === '1',
    tipBots:    (Q.get('tipbot') || 'botrix,botrixbot,botrix_bot,tq_bot_irl')
                  .toLowerCase().split(',').map(function(s){return s.trim();}).filter(Boolean),
    tipAll:      Q.get('tipall') === '1',
    // Token o URL completa de las stats de Belabox (solo lectura).
    // Una vez que lo pasas por la URL queda guardado, así que si luego
    // editas la liga y se te olvida, sigue funcionando.
    bela: (function(){
      var v = (Q.get('bela') || '').trim(), url='';
      if (/^https?:\/\//i.test(v)) url = v;
      else if (/^[A-Za-z0-9_\-]{10,90}$/.test(v)) url = 'https://stats.srt.belabox.net/' + v;
      try{
        if (url) localStorage.setItem('kickfeed.bela', url);
        else if (Q.get('bela') === '') localStorage.removeItem('kickfeed.bela');  // ?bela= vacío lo borra
        else url = localStorage.getItem('kickfeed.bela') || '';
      }catch(e){}
      return url;
    })(),
    bpoll:  parseInt(Q.get('bpoll') || '1000', 10),   // cada cuánto pregunta, en ms
    // Mismos umbrales que NOALBS: abajo de "low" = amarillo, abajo de "offline" = rojo.
    blow:   parseInt(Q.get('blow')  || '500', 10),
    boff:   parseInt(Q.get('boff')  || '300', 10),
    rlow:   parseInt(Q.get('rlow')  || '1200', 10),
    roff:   parseInt(Q.get('roff')  || '2000', 10),
    bwin:   Math.max(10, parseInt(Q.get('bwin')  || '60', 10)) * 1000,   // ventana de la gráfica
    bstep:  Math.max(1,  parseFloat(Q.get('bstep') || '3'))     * 1000,   // un punto cada…
    bunit:      (Q.get('bunit') || 'kbps').toLowerCase(),
    rwalert: parseInt(Q.get('rwalert') || '5', 10),        // canjeos para el aviso grande
    rwwin: parseInt(Q.get('rwwin') || '900', 10) * 1000,   // ventana para agrupar, en segundos
    signal:      Q.get('signal') === '1',   // avisos de corte de señal dentro del feed
    botrix: (function(){
      var raw = location.search.match(/[?&]botrix=(.*)$/);
      if (raw && /^https?(:|%3A)/i.test(raw[1])){
        // que no se trague los parámetros que vayan después
        var v = raw[1].split(/&(?=bela=|bpoll=|blow=|boff=|rlow=|roff=|bwin=|bstep=|api=|max=|page=|font=|bg=|bar=|time=|viewers=|vpoll=|test=|debug=)/)[0];
        try { if (/%3A|%2F/i.test(v)) v = decodeURIComponent(v); } catch(e){}
        return v;
      }
      return Q.get('botrix') || '';
    })(),
    botrixH: parseInt(Q.get('botrixh') || '45', 10),
    // Tu servidor en Vercel: recibe de Kick (vía oficial) cada sub, resub,
    // regalo y Kicks, aunque tu celular no tenga señal. ?api=0 lo apaga.
    api: (Q.get('api')==='0') ? '' : (Q.get('api') || 'https://kick-feed-mariotq.vercel.app').replace(/\/+$/,''),
    debug:       Q.get('debug') === '1',
    test:        Q.get('test')  === '1',
    font:        Q.get('font')  || ''
  };
  if (CFG.slug !== 'mariotq' && !Q.get('chatroom')) { CFG.chatroomId=''; CFG.channelId=''; }

  if (CFG.bg === 'transparent' || CFG.bg === 'none') document.body.classList.add('transparent');
  if (!CFG.bar)  document.body.classList.add('nobar');
  if (!CFG.time) document.body.classList.add('notime');
  if (CFG.test)  document.body.classList.add('testmode');
  if (CFG.font)  document.documentElement.style.setProperty('--row', parseInt(CFG.font,10)+'px');

  var $feed=document.getElementById('feed'), $empty=document.getElementById('empty'),
      $dot=document.getElementById('dot'), $vw=document.getElementById('pViewers'),
      $filt=document.getElementById('filters');
  document.getElementById('emptySlug').textContent = CFG.slug;

  function LSget(k,d){ try{ var v=localStorage.getItem(k); return v===null?d:v; }catch(e){ return d; } }
  function LSset(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }

  /* ============================================================
     VIEWERS EN VIVO
     Se consulta el endpoint público de Kick, que sí permite
     leerse desde otro dominio. Toca la píldora para mostrar
     u ocultar el número.
     ============================================================ */
  var $up=document.getElementById('pUptime'), $sb=document.getElementById('pSubs'),
      $kc=document.getElementById('pKicks');
  var viewersShown = LSget('kickfeed.viewers', CFG.viewersOn ? '1' : '0') === '1';
  var viewers = null;      // null = todavía no se sabe, 0 = offline
  var startMs = null;      // cuándo arrancó la transmisión
  var fakeStart = null;    // solo para el modo prueba

  // Contador de subs de la transmisión actual; se reinicia solo
  // cuando Kick reporta un ID de transmisión distinto.
  var sess = {id:null, subs:0, kicks:0, seen:null};
  try{ sess = JSON.parse(LSget('kickfeed.session','null')) || sess; }catch(e){}
  function saveSess(){ LSset('kickfeed.session', JSON.stringify(sess)); }

  function paintViewers(){
    $vw.classList.toggle('on', viewersShown);
    $vw.classList.toggle('live', viewers > 0);
    if (!viewersShown){ $vw.textContent = '👁'; return; }
    if (viewers === null) $vw.textContent = '👁 …';
    else if (viewers === 0) $vw.textContent = '👁 offline';
    else $vw.textContent = '👁 ' + viewers.toLocaleString('es-MX');
  }
  $vw.onclick = function(){
    viewersShown = !viewersShown;
    LSset('kickfeed.viewers', viewersShown ? '1' : '0');
    paintViewers();
    if (viewersShown) pollViewers();
  };

  /* El reloj tiene tres modos; se cambia tocándolo:
     0 = completo con segundos, 1 = corto, 2 = solo el icono. */
  var upMode = parseInt(LSget('kickfeed.upmode','0'),10) || 0;
  $up.onclick = function(){
    upMode = (upMode+1) % 3;
    LSset('kickfeed.upmode', String(upMode));
    paintUptime();
  };

  function fmtUptime(ms, mode){
    var t=Math.floor(ms/1000);
    var h=Math.floor(t/3600), m=Math.floor((t%3600)/60), s=t%60;
    if (mode===1) return h ? h+':'+String(m).padStart(2,'0') : m+'m';
    return (h ? h+':'+String(m).padStart(2,'0') : String(m).padStart(2,'0'))
           +':'+String(s).padStart(2,'0');
  }
  function paintUptime(){
    if (upMode===2){ $up.textContent='⏱'; }
    else $up.textContent = startMs ? '⏱ '+fmtUptime(Math.max(0, Date.now()-startMs), upMode) : '⏱ —';
    $up.classList.toggle('on', !!startMs && upMode!==2);
    fitBar();
  }
  function paintSubs(){
    $sb.textContent = '★ '+sess.subs;
    $sb.classList.toggle('has', sess.subs>0);
    fitBar();
  }
  function paintKicks(){
    var n = sess.kicks||0;
    $kc.textContent = '⚡ '+(n>=100000 ? Math.round(n/1000)+'k' : n);
    $kc.classList.toggle('has', n>0);
    fitBar();
  }

  /* Si la barra no alcanza, se esconde el nombre del canal.
     Si vuelve a caber, reaparece. */
  /* Si la barra no alcanza, encoge todo un poco hasta que quepa.
     Así nunca se corta una píldora en pantallas angostas. */
  var $bar=document.getElementById('bar'), $stats=document.getElementById('stats');
  var SCALES=[1,.94,.88,.82,.76,.70];
  // Mide los bordes reales: el desbordamiento hacia la izquierda no
  // se ve en scrollWidth, y ahí era justo donde se cortaban los viewers.
  function barFits(){
    var kids=$stats.children;
    if (!kids.length) return true;
    var b=$bar.getBoundingClientRect();
    var dot=document.getElementById('dot').getBoundingClientRect();
    var first=kids[0].getBoundingClientRect();
    var lastEl=($bela && $bela.style.display!=='none') ? $bela : kids[kids.length-1];
    var last=lastEl.getBoundingClientRect();
    // el punto de conexión también ocupa lugar: no debe encimarse
    return first.left >= dot.right + 1 && last.right <= b.right + 0.5;
  }
  function fitBar(){
    for (var i=0;i<SCALES.length;i++){
      $bar.style.setProperty('--bs', SCALES[i]);
      if (barFits()) return;
    }
  }
  window.addEventListener('resize', fitBar);

  // Kick manda las fechas sin zona horaria. Probamos leerlas como UTC
  // y como hora local, y nos quedamos con la que da un tiempo creíble.
  function parseKickDate(s){
    if (!s) return null;
    var iso = String(s).trim().replace(' ','T');
    var hasTz = /[Zz]|[+\-]\d\d:?\d\d$/.test(iso);
    var asUtc = Date.parse(iso + (hasTz ? '' : 'Z'));
    var asLocal = Date.parse(iso);
    // Se permite un pequeño desfase por si el reloj del celular va
    // unos segundos adelantado justo al arrancar la transmisión.
    var now=Date.now(), MAX=72*3600e3, MIN=-5*60e3;
    if (asUtc   && now-asUtc   >= MIN && now-asUtc   < MAX) return asUtc;
    if (asLocal && now-asLocal >= MIN && now-asLocal < MAX) return asLocal;
    return null;
  }

  function pollViewers(){
    if (!CFG.slug) return;
    fetch('https://kick.com/api/v2/channels/' + encodeURIComponent(CFG.slug) + '/livestream',
          {cache:'no-store'})
      .then(function(r){ return r.json(); })
      .then(function(j){
        var d = j && j.data;
        viewers = d ? (d.viewers || d.viewer_count || 0) : 0;
        if (d){
          if (String(d.id) !== String(sess.id)){   // transmisión nueva
            sess = {id:String(d.id), subs:0, kicks:0, seen:Date.now()};
            saveSess(); paintSubs();
          }
          if (!sess.seen){ sess.seen=Date.now(); saveSess(); }
          // 1) la hora que reporta Kick  2) si no sirve, desde que la vimos en vivo
          startMs = parseKickDate(d.created_at) || parseKickDate(d.start_time) || sess.seen;
        } else if (CFG.test){
          // En modo prueba, si no estás al aire igual echamos a andar el
          // reloj para poder comprobar que avanza segundo a segundo.
          if (!fakeStart) fakeStart = Date.now();
          startMs = fakeStart; viewers = 0;
        } else {
          startMs = null;   // fuera de línea: el contador de subs se conserva
        }
        paintViewers(); paintUptime();
      })
      .catch(function(){ /* sin red: se queda con el último valor */ });
  }
  paintViewers(); paintUptime(); paintSubs(); paintKicks();
  pollViewers();
  setInterval(pollViewers, Math.max(10000, CFG.vpoll));
  setInterval(paintUptime, 1000);

  /* ============================================================
     BITRATE DE BELABOX
     Lee el endpoint público de stats del relay (stats.srt.belabox.net).
     Es de SOLO LECTURA: con ese token nadie puede controlar tu equipo.
     Además de mostrar el número, avisa en el feed el momento exacto
     en que la señal se corta y cuándo vuelve.
     ============================================================ */
  var $bela=document.getElementById('pBela');
  var belaConn=null, belaFails=0;

  /* ---- gráfica: historial del bitrate ----
     Se lee cada segundo, pero se dibuja un punto por cada tramo de
     3 segundos (igual que IRL Toolkit) para que no se vea amontonado.
     Cada punto guarda la lectura MÁS EXTREMA de su tramo: si en esos
     3 segundos el bitrate se fue para arriba o se cayó, eso es lo que
     queda marcado (antes solo se guardaba la más baja y los picos
     hacia arriba se borraban). El último punto se va moviendo con
     cada lectura y ya no brinca cuando su tramo se cierra. */
  var SLOTS=Math.max(5, Math.round(CFG.bwin/CFG.bstep));
  var pts=[];          // {i: número de tramo, mn, mx, first: lecturas del tramo}
  var lastRead=null;   // {v, c, rtt} la lectura más reciente

  var $graph=document.getElementById('graph'), $gSvg=document.getElementById('gSvg'),
      $gBig=document.getElementById('gBig'), $gRtt=document.getElementById('gRtt'),
      $gSc=document.querySelector('#graph .sc');
  document.getElementById('gLow').textContent='Low '+CFG.blow;
  document.getElementById('gOff').textContent='Offline '+CFG.boff;
  document.getElementById('gWin').textContent='últimos '+Math.round(CFG.bwin/1000)+' s';
  document.getElementById('gL').textContent='hace '+Math.round(CFG.bwin/1000)+' s';
  var graphOpen=false;

  $bela.onclick=function(){ graphOpen ? closeGraph() : openGraph(); };
  // Tocar el encabezado cierra la gráfica; tocar la gráfica muestra el
  // valor exacto del punto que tocaste (como pasar el mouse en IRL Toolkit).
  $graph.querySelector('.hd').onclick=closeGraph;
  $graph.querySelector('.lg').onclick=closeGraph;
  var inspect=null, inspectT=null;   // {s: posición del punto tocado}
  function inspectAt(ev){
    var r=$gSvg.getBoundingClientRect(), x=ev.clientX-r.left;
    var L=gGeom.L, W=gGeom.W, R=gGeom.R;
    if (!W) return;
    var s=Math.round((x-L)/((W-L-R)/(SLOTS-1)));
    s=Math.max(0, Math.min(SLOTS-1, s));
    // el punto con dato más cercano
    var best=null;
    gP.forEach(function(q){ if (q.v!=null && (!best || Math.abs(q.s-s)<Math.abs(best.s-s))) best=q; });
    if (!best) return;
    inspect={s:best.s, i:best.i};
    clearTimeout(inspectT);
    inspectT=setTimeout(function(){ inspect=null; renderGraph(); }, 4000);
    renderGraph();
  }
  $gSvg.addEventListener('pointerdown', function(ev){ ev.stopPropagation(); inspectAt(ev);
    try{ $gSvg.setPointerCapture(ev.pointerId); }catch(e){} });
  $gSvg.addEventListener('pointermove', function(ev){ if (ev.buttons || ev.pointerType==='touch') inspectAt(ev); });
  $gSvg.style.touchAction='none';
  // Se queda abierta hasta que la vuelvas a tocar.
  function openGraph(){ if (typeof closeList==='function') closeList();
                       graphOpen=true; shownTop=null; zoomTo=null; $graph.classList.add('show'); drawGraph(); }
  function closeGraph(){ graphOpen=false; $graph.classList.remove('show'); }
  window.addEventListener('resize', function(){ if (graphOpen) drawGraph(); });

  var C_BLUE='#3ea6ff', C_LOW='#ffc107', C_OFF='#ff453a', C_SURF='#181b21';

  // Estado según NOALBS: 'ok', 'warn' (abajo de Low) o 'down' (abajo de Offline o sin señal).
  function belaState(kbps, conn){
    if (!conn || kbps < CFG.boff) return 'down';
    return kbps < CFG.blow ? 'warn' : 'ok';
  }
  var STATE_TXT={ok:'#53fc18', warn:'#ffb020', down:'#ff3b30'};
  function dotColor(v){ return v < CFG.boff ? C_OFF : (v < CFG.blow ? C_LOW : C_BLUE); }

  // v = kbps (0 si no hay señal) o null si el celular no pudo leer las stats.
  function addSample(v){
    var idx=Math.floor(Date.now()/CFG.bstep);
    var last=pts[pts.length-1];
    if (last && last.i===idx){
      if (v!=null){
        if (last.first==null){ last.first=v; last.mn=v; last.mx=v; }
        else { last.mn=Math.min(last.mn,v); last.mx=Math.max(last.mx,v); }
      }
    } else {
      // Tramos sin ninguna lectura (celular sin internet o pantalla
      // apagada) quedan vacíos: la línea se corta en lugar de caer a 0.
      var from = last ? last.i+1 : idx;
      if (idx-from > SLOTS) from = idx-SLOTS;
      for (var k=from;k<idx;k++) pts.push({i:k, first:null, mn:null, mx:null});
      pts.push({i:idx, first:v, mn:v, mx:v});
    }
    while (pts.length && pts[0].i <= idx-SLOTS) pts.shift();
  }

  function niceStep(top){
    // Pasos redondos como IRL Toolkit: de 200 en 200 cuando está de
    // cerca (0 a 1,000), de 1,000 en 1,000 cuando anda en 6,000…
    // Siempre de 1,000 en 1,000 cuando el bitrate anda alto, así la
    // cuadrícula casi no cambia de tamaño.
    if (top <= 1200)  return 200;
    if (top <= 3000)  return 500;
    if (top <= 12000) return 1000;
    return 2000;
  }
  // Números completos en el eje: 2,000 / 4,000 / 10,000 (sin abreviar).
  function axisLabel(v){ return Number(v).toLocaleString('es-MX'); }

  function drawGraph(){
    if (!graphOpen) return;

    // ---- encabezado: número grande y RTT ----
    if (lastRead){
      var st=belaState(lastRead.v, lastRead.c);
      $gBig.textContent = lastRead.c ? fmtRate(lastRead.v) : 'sin señal';
      $gBig.style.color = STATE_TXT[st];
      if (lastRead.c && lastRead.rtt){
        $gRtt.textContent=lastRead.rtt+' ms';
        $gRtt.style.color = lastRead.rtt>=CFG.roff ? '#ff3b30' : (lastRead.rtt>=CFG.rlow ? '#ffb020' : '');
      } else $gRtt.textContent='';
    } else { $gBig.textContent='—'; $gBig.style.color=''; $gRtt.textContent=''; }

    // ---- puntos visibles ----
    var cur=Math.floor(Date.now()/CFG.bstep);
    gP=[];   // {s: posición 0..SLOTS-1, v, live}
    var prev=null;
    for (var j=0;j<pts.length;j++){
      var p=pts[j], s=SLOTS-1-(cur-p.i), v=null;
      if (p.first!=null){
        // de las lecturas del tramo, la que más se aleja del punto anterior
        var ref = (prev!=null) ? prev : p.first;
        v = Math.abs(p.mx-ref) > Math.abs(p.mn-ref) ? p.mx : p.mn;
      }
      prev = (v!=null) ? v : prev;
      if (s<0 || s>SLOTS-1) continue;
      gP.push({s:s, v:v, live:(p.i===cur), i:p.i});
    }

    // ---- ZOOM AUTOMÁTICO (como IRL Toolkit) ----
    // La escala se ajusta a todo lo que se ve en los 60 s: nada se corta.
    // Si el bitrate anda bajo, la gráfica se va acercando conforme los
    // valores altos salen por la izquierda; si sube, se aleja.
    var mx=0;
    gP.forEach(function(q){ if (q.v!=null && q.v>mx) mx=q.v; });
    var want=Math.max(mx*1.05, CFG.blow*2, 1000);
    var step=niceStep(want), target=Math.ceil(want/step)*step;

    if (shownTop==null){ shownTop=target; }
    if (target!==zoomTo){
      // transición suave de ~0.6 s en lugar de un brinco
      zoomFrom=shownTop; zoomTo=target; zoomT0=Date.now();
      if (!zoomRaf) zoomRaf=requestAnimationFrame(zoomTick);
    }
    renderGraph();
  }

  var gGeom={}, gP=[], shownTop=null, zoomFrom=null, zoomTo=null, zoomT0=0, zoomRaf=0, ZOOM_MS=600;
  function zoomTick(){
    zoomRaf=0;
    if (!graphOpen){ shownTop=zoomTo; return; }
    var t=Math.min(1, (Date.now()-zoomT0)/ZOOM_MS);
    var e=1-Math.pow(1-t,3);                      // empieza rápido y frena suave
    shownTop = zoomFrom + (zoomTo-zoomFrom)*e;
    renderGraph();
    if (t<1) zoomRaf=requestAnimationFrame(zoomTick);
  }

  function renderGraph(){
    var P=gP, top=shownTop||1000;
    var step=niceStep(top);

    // ---- medidas reales del SVG (se adapta al ancho del celular) ----
    var W=$gSvg.clientWidth||360, H=$gSvg.clientHeight||150;
    var R=8, T=8, B=6;
    var maxTick=Math.floor(top/step)*step;
    // Si hay muchas rayas, se escribe el número solo en una sí y una no
    // (0, 2,000, 4,000…) para que no se amontonen. Las rayas se quedan.
    var every = (top/step > 6) ? 2 : 1;
    var L = 12 + axisLabel(maxTick).length*6.6;  // margen según el número más largo
    $gSc.style.paddingLeft = L+'px';
    $gSvg.setAttribute('viewBox','0 0 '+W+' '+H);

    gGeom={L:L, W:W, R:R};
    var X=function(s){ return L + s*(W-L-R)/(SLOTS-1); };
    var Y=function(v){ return T + (1-Math.max(0,v)/top)*(H-T-B); };
    var f=function(n){ return n.toFixed(1); };

    // Recorte de seguridad para que nada se salga del recuadro.
    var out='<defs><clipPath id="gClip"><rect x="'+(L-6)+'" y="0" width="'+(W-L+6)+'" height="'+(H-B+8)+'"/></clipPath></defs>';
    // cuadrícula horizontal y números del eje
    for (var v=0, n=0; v<=top+0.5; v+=step, n++){
      if (n % every) continue;
      var y=f(Y(v));
      out+='<text x="'+(L-6)+'" y="'+(+y+4)+'" text-anchor="end" font-size="11" font-weight="600" fill="#b4bac5">'+axisLabel(v)+'</text>';
    }
    out+='<g clip-path="url(#gClip)">';

    // tramos continuos (se cortan donde no hubo lectura)
    var segs=[], seg=[];
    P.forEach(function(q){
      if (q.v==null){ if (seg.length) segs.push(seg); seg=[]; }
      else {
        if (seg.length && q.s !== seg[seg.length-1].s+1){ segs.push(seg); seg=[]; }
        seg.push(q);
      }
    });
    if (seg.length) segs.push(seg);

    // Línea curva suave (como IRL Toolkit) sin pasarse de los puntos reales.
    function smooth(xy){
      var n=xy.length; if (n<3){ var d0=''; xy.forEach(function(p,k){ d0+=(k?'L':'M')+f(p[0])+' '+f(p[1])+' '; }); return d0; }
      var dx=[],m=[],t=[];
      for (var i=0;i<n-1;i++){ dx[i]=xy[i+1][0]-xy[i][0]; m[i]=(xy[i+1][1]-xy[i][1])/dx[i]; }
      t[0]=m[0]; t[n-1]=m[n-2];
      for (i=1;i<n-1;i++) t[i]=(m[i-1]*m[i]<=0)?0:(m[i-1]+m[i])/2;
      for (i=0;i<n-1;i++){
        if (m[i]===0){ t[i]=0; t[i+1]=0; continue; }
        var a=t[i]/m[i], b=t[i+1]/m[i], h=a*a+b*b;
        if (h>9){ var k3=3/Math.sqrt(h); t[i]=k3*a*m[i]; t[i+1]=k3*b*m[i]; }
      }
      var d='M'+f(xy[0][0])+' '+f(xy[0][1]);
      for (i=0;i<n-1;i++){
        var h3=dx[i]/3;
        d+=' C'+f(xy[i][0]+h3)+' '+f(xy[i][1]+t[i]*h3)+' '+f(xy[i+1][0]-h3)+' '+f(xy[i+1][1]-t[i+1]*h3)+' '+f(xy[i+1][0])+' '+f(xy[i+1][1]);
      }
      return d+' ';
    }
    var paths=segs.map(function(sg){
      var d=smooth(sg.map(function(q){ return [X(q.s), Y(q.v)]; }));
      return {d:d, x0:f(X(sg[0].s)), x1:f(X(sg[sg.length-1].s))};
    });
    var y0=f(Y(0));
    // la "montaña": relleno suave debajo de la línea
    paths.forEach(function(pa){
      out+='<path d="'+pa.d+'L'+pa.x1+' '+y0+' L'+pa.x0+' '+y0+' Z" fill="rgba(52,120,210,.72)"/>';
    });
    // cuadrícula tipo cuaderno: una raya vertical por cada punto y una
    // horizontal por cada número del eje (se ve encima de la montaña)
    for (var gs=0; gs<SLOTS; gs++){
      var gx=f(X(gs));
      out+='<line x1="'+gx+'" x2="'+gx+'" y1="'+T+'" y2="'+y0+'" stroke="rgba(255,255,255,.07)" stroke-width="1"/>';
    }
    for (var gv=0; gv<=top+0.5; gv+=step){
      var gy=f(Y(gv));
      out+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+gy+'" y2="'+gy+'" stroke="rgba(255,255,255,'+(gv?'.10':'.22')+')" stroke-width="1"/>';
    }
    // líneas de NOALBS
    out+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+f(Y(CFG.blow))+'" y2="'+f(Y(CFG.blow))+'" stroke="'+C_LOW+'" stroke-width="1.5"/>';
    out+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+f(Y(CFG.boff))+'" y2="'+f(Y(CFG.boff))+'" stroke="'+C_OFF+'" stroke-width="1.5"/>';
    // la línea del bitrate
    paths.forEach(function(pa){
      out+='<path d="'+pa.d+'" fill="none" stroke="#eef4ff" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
    });
    // Puntos solo donde dicen algo: amarillos abajo de Low, rojos abajo de
    // Offline, el más alto, el más bajo y el del momento. Los demás no se
    // dibujan para que la gráfica se vea limpia.
    var hiQ=null, loQ=null;
    P.forEach(function(q){ if (q.v==null||q.live) return; if(!hiQ||q.v>hiQ.v)hiQ=q; if(!loQ||q.v<loQ.v)loQ=q; });
    P.forEach(function(q){
      if (q.v==null) return;
      var cx=f(X(q.s)), cy=f(Y(q.v)), col=dotColor(q.v);
      if (col===C_BLUE && !q.live && q!==hiQ && q!==loQ) return;
      if (q.live){
        out+='<circle cx="'+cx+'" cy="'+cy+'" r="7.5" fill="none" stroke="'+col+'" stroke-width="2"/>'+
             '<circle cx="'+cx+'" cy="'+cy+'" r="5" fill="#fff" stroke="'+C_SURF+'" stroke-width="2"/>';
      } else {
        out+='<circle cx="'+cx+'" cy="'+cy+'" r="3.3" fill="'+(col===C_BLUE?'#2a62b0':col)+'" stroke="#fff" stroke-width="1.4"/>';
      }
    });
    // Valor escrito junto al punto más alto y el más bajo de la gráfica,
    // para saber exacto hasta dónde subió y hasta dónde se cayó.
    var hi=null, lo=null;
    P.forEach(function(q){
      if (q.v==null || q.live) return;
      if (!hi || q.v>hi.v) hi=q;
      if (!lo || q.v<lo.v) lo=q;
    });
    function tag(q, above){
      var cx=X(q.s), cy=Y(q.v), ty = above ? cy-9 : cy+17;
      if (ty < T+9) ty = cy+17;            // no se sale por arriba
      if (ty > H-B-2) ty = cy-9;           // ni por abajo
      cx=Math.max(L+16, Math.min(W-R-16, cx));
      var col = q.v < CFG.blow ? STATE_TXT[belaState(q.v,true)] : '#fff';
      return '<text x="'+f(cx)+'" y="'+f(ty)+'" text-anchor="middle" font-size="11" font-weight="700" '+
             'fill="'+col+'" stroke="'+C_SURF+'" stroke-width="3" paint-order="stroke">'+axisLabel(Math.round(q.v))+'</text>';
    }
    if (hi && lo && hi!==lo && hi.v-lo.v > top*0.12){ out+=tag(hi,true)+tag(lo,false); }

    // Punto tocado: raya vertical y burbuja con el valor exacto.
    if (inspect){
      var iq=null; P.forEach(function(q){ if (q.i===inspect.i && q.v!=null) iq=q; });
      if (iq){
        var ix=X(iq.s), iy=Y(iq.v);
        var ago=Math.round((SLOTS-1-iq.s)*CFG.bstep/1000);
        var txt=fmtRate(iq.v), sub= iq.live ? 'ahora' : 'hace '+ago+' s';
        var bw=Math.max(txt.length, sub.length)*7+16, bx=Math.max(L, Math.min(W-R-bw, ix-bw/2));
        var by = iy-52 < T ? iy+14 : iy-52;
        out+='<line x1="'+f(ix)+'" x2="'+f(ix)+'" y1="'+T+'" y2="'+f(Y(0))+'" stroke="#fff" stroke-opacity=".55" stroke-width="1"/>'+
             '<circle cx="'+f(ix)+'" cy="'+f(iy)+'" r="6" fill="none" stroke="#fff" stroke-width="2"/>'+
             '<rect x="'+f(bx)+'" y="'+f(by)+'" width="'+bw+'" height="38" rx="7" fill="#0e0f13" fill-opacity=".92" stroke="rgba(255,255,255,.25)"/>'+
             '<text x="'+f(bx+bw/2)+'" y="'+f(by+16)+'" text-anchor="middle" font-size="12.5" font-weight="800" fill="'+STATE_TXT[belaState(iq.v,true)]+'">'+txt+'</text>'+
             '<text x="'+f(bx+bw/2)+'" y="'+f(by+30)+'" text-anchor="middle" font-size="10" fill="#9aa1ad">'+sub+'</text>';
      }
    }
    out+='</g>';
    $gSvg.innerHTML=out;
  }

  function fmtRate(kbps){

      .then(function(r){ return r.json(); })
      .then(function(j){
        belaFails=0;
        var pub = j && j.publishers ? (j.publishers.live || j.publishers[Object.keys(j.publishers)[0]]) : null;
        if (!pub){
          $bela.textContent='📶 —'; $bela.className='pill';
          addSample(null); drawGraph(); return;
        }

        var conn = !!pub.connected;
        var kbps = conn ? Number(pub.bitrate||0) : 0;
        var rtt  = Math.round(Number(pub.rtt||0));

        lastRead={v:kbps, c:conn, rtt:rtt};
        addSample(kbps);
