<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kick Activity Feed</title>
<style>
  :root{
    --bg: #0e0f13;
    --panel: rgba(255,255,255,.04);
    --line: rgba(255,255,255,.08);
    --txt: #e8eaee;
    --dim: #9aa1ad;
    --kick: #53fc18;
    --c-follow: #3ea6ff;   /* azul */
    --c-sub:    #53fc18;   /* verde Kick */
    --c-resub:  #ffd93d;   /* amarillo */
    --c-gift:   #ff4d4d;   /* rojo */
    --c-kicks:  #a970ff;   /* morado, como los bits de Twitch */
    --c-tip:    #2ee6c5;   /* turquesa */
    --c-reward: #ff6bd6;   /* rosa */
    --c-host:   #ff9f1c;
    --c-live:   #d7dde6;
    --c-mod:    #a05a5a;
    --c-chat:   #8f97a3;
    --row: 15px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    margin:0;background:var(--bg);color:var(--txt);
    font-family:"Inter","Segoe UI",Roboto,system-ui,-apple-system,sans-serif;
    font-size:var(--row);overflow:hidden;display:flex;flex-direction:column;
  }
  body.transparent{background:transparent}
  body.transparent .item{background:transparent}
  body.transparent .item .line{text-shadow:0 1px 3px rgba(0,0,0,.95),0 0 8px rgba(0,0,0,.7)}

  /* ---------- barra superior ---------- */
  #bar{
    --bs:1;                /* escala automática: ver fitBar() */
    flex:0 0 auto;display:flex;align-items:center;gap:calc(6px*var(--bs));
    padding:7px calc(9px*var(--bs));border-bottom:1px solid var(--line);
    background:rgba(0,0,0,.35);font-size:12px;color:var(--dim);
  }
  /* El bitrate queda clavado a la derecha; si algo tiene que
     recorrerse por falta de espacio, es el grupo del centro. */
  #stats{flex:1 1 auto;min-width:0;overflow-x:auto;scrollbar-width:none;justify-content:flex-end}
  #stats::-webkit-scrollbar{display:none}
  #pBela{flex:0 0 auto;margin-left:5px}
  body.nobar #bar{display:none}
  /* el nombre del canal solo se esconde si de verdad no cabe */
  /* Verde = conectado al chat de Kick. Rojo parpadeando = se cayó. */
  #dot{flex:0 0 auto;width:9px;height:9px;border-radius:50%;background:#ff3b30;
       animation:blink 1.2s ease-in-out infinite}
  #dot.on{background:var(--kick);box-shadow:0 0 8px var(--kick);animation:none}
  #stats{margin-left:auto;display:flex;gap:calc(3px*var(--bs));align-items:center;
         flex:0 1 auto;min-width:0;justify-content:flex-end}
  .pill{background:var(--panel);border:1px solid var(--line);border-radius:20px;
        padding:3px calc(7px*var(--bs));white-space:nowrap;cursor:pointer;user-select:none;
        color:var(--dim);font-size:calc(11px*var(--bs));font-variant-numeric:tabular-nums;
        flex:0 0 auto}
  .pill.on{color:var(--txt)}
  .pill.live{border-color:rgba(83,252,24,.35)}
  #pSubs.has{color:var(--c-sub)}
  #pKicks.has{color:var(--c-kicks)}

  /* ---------- panel de bitrate (se abre al tocar la píldora) ----------
     Estilo IRL Toolkit: eje a la izquierda, línea amarilla = Low,
     línea roja = Offline, un punto por cada tramo de 3 segundos. */
  #graph{display:none;flex:0 0 auto;padding:9px 12px 7px;
         border-bottom:1px solid var(--line);background:#181b21}
  #graph.show{display:block}
  #graph .hd{display:flex;align-items:baseline;gap:8px}
  #graph .hd .ttl{font-size:14px;font-weight:700;color:var(--txt)}
  #graph .hd .big{margin-left:auto;font-size:17px;font-weight:800;font-variant-numeric:tabular-nums}
  #graph .hd .rtt{font-size:11px;color:var(--dim);font-variant-numeric:tabular-nums}
  #graph .lg{display:flex;align-items:center;gap:12px;margin-top:3px;font-size:10.5px;color:var(--dim)}
  #graph .lg i{display:inline-block;width:12px;height:2px;border-radius:1px;
               vertical-align:middle;margin-right:4px}
  #graph .lg .r{margin-left:auto}
  #graph svg{display:block;width:100%;height:clamp(110px,28vh,160px);margin-top:6px;overflow:visible}
  #graph .sc{display:flex;justify-content:space-between;font-size:10px;color:#7d8490;
             margin-top:1px;padding-left:28px}
  /* El bitrate va hasta la derecha y más grande: es lo que más se
     consulta de reojo, y del lado izquierdo lo tapa el GPS. */
  #pBela{font-size:calc(13px*var(--bs));font-weight:700;padding:3px calc(9px*var(--bs))}
  #pBela.ok  {color:#53fc18;border-color:rgba(83,252,24,.5);background:rgba(83,252,24,.10)}
  #pBela.warn{color:#ffb020;border-color:rgba(255,176,32,.6);background:rgba(255,176,32,.12)}
  #pBela.down{color:#ff3b30;border-color:rgba(255,59,48,.7);background:rgba(255,59,48,.14);
              animation:blink 1.1s ease-in-out infinite}
  @keyframes blink{50%{opacity:.35}}
  .btn{cursor:pointer;padding:3px calc(6px*var(--bs));border-radius:8px;user-select:none;
       flex:0 0 auto;border:1px solid var(--line);background:transparent;color:#5d636d;
       font-size:calc(13px*var(--bs))}
  .btn:active{background:var(--panel)}
  .btn.on{color:var(--txt);border-color:rgba(255,255,255,.28)}
  #rwBtn.on{color:var(--c-reward);border-color:rgba(255,107,214,.45)}

  /* ---------- ajustes ---------- */
  #filters{display:none;flex-wrap:wrap;gap:6px;padding:8px 10px;
           border-bottom:1px solid var(--line);background:rgba(0,0,0,.45)}
  #filters.open{display:flex}
  .chip{font-size:12px;padding:4px 10px;border-radius:20px;cursor:pointer;
        border:1px solid var(--line);background:transparent;color:var(--dim)}
  .chip.on{background:var(--panel);color:var(--txt);border-color:rgba(255,255,255,.25)}
  .chip.wide{width:100%;text-align:left}

  /* ---------- avisos grandes (recompensas spameadas) ---------- */
  #alerts{position:fixed;left:0;right:0;top:0;z-index:25;display:flex;flex-direction:column}
  .alert{display:flex;align-items:center;gap:10px;padding:13px 14px;cursor:pointer;
         border-bottom:2px solid var(--c-reward);box-shadow:0 6px 24px rgba(0,0,0,.55);
         animation:drop .25s cubic-bezier(.2,.9,.3,1.2), pulse 1s ease-in-out infinite}
  @keyframes drop{from{transform:translateY(-100%);opacity:0}to{transform:none;opacity:1}}
  /* parpadea hasta que la toques, para que salte a la vista */
  @keyframes pulse{
    0%,100%{background:#241726; border-bottom-color:var(--c-reward);
            box-shadow:0 6px 24px rgba(0,0,0,.55)}
    50%    {background:#5a1247; border-bottom-color:#fff;
            box-shadow:0 6px 30px rgba(255,107,214,.55)}
  }
  @media (prefers-reduced-motion:reduce){ .alert{animation:drop .25s ease-out} }
  .alert .ttl{font-size:1.3em;font-weight:800;color:var(--c-reward);
              text-transform:uppercase;letter-spacing:.02em;
              word-wrap:break-word;overflow-wrap:anywhere;min-width:0}
  .alert .n{margin-left:auto;font-size:1.5em;font-weight:800;color:var(--txt);flex:0 0 auto}
  .alert .hint{position:absolute;right:14px;bottom:2px;font-size:10px;color:var(--dim)}

  /* ---------- feed ---------- */
  #feed{flex:1 1 auto;overflow-y:auto;overflow-x:hidden;padding:6px 0 14px;scrollbar-width:thin}
  #feed::-webkit-scrollbar{width:5px}
  #feed::-webkit-scrollbar-thumb{background:rgba(255,255,255,.15);border-radius:3px}

  .item{display:flex;gap:9px;align-items:flex-start;padding:8px 11px;
        border-bottom:1px solid var(--line);animation:in .28s ease-out}
  @keyframes in{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}

  /* separador de día */
  .day{padding:7px 11px 5px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;
       color:var(--dim);background:rgba(255,255,255,.03);border-bottom:1px solid var(--line);
       position:sticky;top:0;z-index:2}
  #more{display:block;width:calc(100% - 22px);margin:10px 11px;padding:9px;
        background:var(--panel);border:1px solid var(--line);color:var(--dim);
        border-radius:9px;font-size:13px;cursor:pointer}
  .item .ic{flex:0 0 auto;width:22px;height:22px;border-radius:6px;
            display:grid;place-items:center;font-size:12px;font-weight:700;background:rgba(255,255,255,.06)}
  .item .ic img{width:15px;height:15px;display:block}
  .item .body{flex:1 1 auto;min-width:0}
  .item .line{line-height:1.35;word-wrap:break-word;overflow-wrap:anywhere}
  .item .name{font-weight:700}
  .item .sub{display:block;color:var(--dim);font-size:.82em;margin-top:2px;
             word-wrap:break-word;overflow-wrap:anywhere}
  .item .msg{display:block;margin-top:4px;padding:5px 8px;border-radius:7px;
             background:rgba(255,255,255,.05);border-left:2px solid currentColor;
             font-size:.9em;color:var(--txt);word-wrap:break-word;overflow-wrap:anywhere}
  .item .mult{color:var(--dim);font-weight:400}
  .item .right{flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-end;gap:5px}
  .item .x{border:1px solid var(--line);border-radius:6px;color:var(--dim);
           font-size:12px;padding:0 7px;line-height:1.6;cursor:pointer}
  .item .x:active{background:var(--panel);color:var(--txt)}
  .item .t{color:var(--dim);font-size:.75em;padding-top:3px;font-variant-numeric:tabular-nums}
  body.notime .item .t{display:none}
  .item img.em{height:1.25em;vertical-align:-.25em}

  /* un color por tipo de evento; .resub pisa a .sub */
  .follow{--accent:var(--c-follow)}
  .sub   {--accent:var(--c-sub)}
  .sub.resub{--accent:var(--c-resub)}
  .gift  {--accent:var(--c-gift)}
  .kicks {--accent:var(--c-kicks)}
  .tip   {--accent:var(--c-tip)}
  .reward{--accent:var(--c-reward)}
  .host  {--accent:var(--c-host)}
  .live  {--accent:var(--c-live)}
  .mod   {--accent:var(--c-mod)}
  .chat  {--accent:#cfd4dc}
  .signal{--accent:#ff5f2e}
  .signal.up{--accent:#7cd992}
  .sys   {--accent:var(--dim)}

  .item .ic{color:var(--accent,var(--dim))}
  .item .name{color:var(--accent,var(--txt))}
  .item .msg{border-left-color:var(--accent,var(--line))}
  .item.tip .line{font-weight:600}
  .item.sys .line{color:var(--dim);font-size:.9em}
  .item.chat .ic{color:var(--c-chat)}

  /* ---------- panel de Botrix ---------- */
  #bx{flex:0 0 auto;display:none;flex-direction:column;border-top:2px solid var(--line);background:#0a0b0e}
  #bx.show{display:flex}
  #bxHead{display:flex;align-items:center;gap:8px;padding:5px 10px;font-size:11px;
          letter-spacing:.1em;text-transform:uppercase;color:var(--dim);background:rgba(255,255,255,.03)}
  #bxHead .x{margin-left:auto;cursor:pointer;padding:0 6px;font-size:15px}
  #bx iframe{width:100%;border:0;flex:1 1 auto;background:transparent}

  #empty{padding:26px 16px;text-align:center;color:var(--dim);font-size:13px;line-height:1.6}
  #empty b{color:var(--txt)}
  #test{position:fixed;right:10px;bottom:10px;z-index:30;display:none;
        background:var(--panel);border:1px solid var(--line);color:var(--txt);
        border-radius:10px;padding:8px 12px;font-size:13px;cursor:pointer}
  body.testmode #test{display:block}
</style>
</head>
<body>

<div id="alerts"></div>

<div id="bar">
  <span id="dot" title="Sin conexión con el chat"></span>
  <span id="stats">
    <span class="pill" id="pViewers" title="Viewers">👁</span>
    <span class="pill" id="pUptime" title="Tiempo en vivo">⏱ —</span>
    <span class="pill" id="pSubs" title="Subs de esta transmisión">★ 0</span>
    <span class="pill" id="pKicks" title="Kicks de esta transmisión">⚡ 0</span>
    <button class="btn" id="rwBtn" title="Recompensas">◆</button>
    <button class="btn" id="bxBtn" title="Panel de Botrix" style="display:none">💠</button>
    <button class="btn" id="gear" title="Ajustes">⚙</button>
  </span>
  <span class="pill" id="pBela" title="Bitrate Belabox" style="display:none">📶 —</span>
</div>

<div id="graph">
  <div class="hd"><span class="ttl">Bitrate</span><span class="big" id="gBig">—</span><span class="rtt" id="gRtt"></span></div>
  <div class="lg">
    <span><i style="background:#ffc107"></i><span id="gLow">Low</span></span>
    <span><i style="background:#ff453a"></i><span id="gOff">Offline</span></span>
    <span class="r" id="gWin">últimos 60 s</span>
  </div>
  <svg id="gSvg"></svg>
  <div class="sc"><span id="gL">hace 60 s</span><span>ahora</span></div>
</div>

<div id="filters"></div>

<div id="feed">
  <div id="empty">
    Escuchando el canal de <b id="emptySlug">Kick</b>…<br><br>
    <span style="opacity:.7">El punto verde significa que ya está conectado.<br>
    Solo registra lo que pasa mientras esta página está abierta.</span>
  </div>
</div>

<div id="bx">
  <div id="bxHead"><span>Botrix — tips</span><span class="x" id="bxClose">×</span></div>
</div>

<button id="test">Evento de prueba</button>

<script>
(function(){
  "use strict";

  var VERSION = '28 · 9 oct 2026';   // se muestra abajo en el engrane ⚙

  /* ============================================================
     CONFIGURACIÓN  (todo se cambia por la URL)
       ?channel=mariotq
       ?chatroom=6635680&channelid=6692133
       ?bg=transparent  ?bar=0  ?time=0  ?font=18  ?max=300
       ?page=150        cuántos eventos pinta por tanda
       ?viewers=1       arranca mostrando el número de viewers
       ?vpoll=20        cada cuántos segundos consulta los viewers
       ?keep=0          no guardar el historial entre reinicios
       ?tipbot=a,b      nombres de bot que anuncian tips en el chat
       ?botrix=URL      panel con tu activity feed de Botrix abajo
       ?botrixh=45      altura de ese panel en % de pantalla
       ?blow=500        Low de NOALBS (línea amarilla, píldora amarilla)
       ?boff=300        Offline de NOALBS (línea roja, píldora roja)
       ?rlow=1200&roff=2000   RTT de NOALBS (colorea el RTT de la gráfica)
       ?bwin=60&bstep=3 la gráfica muestra 60 s, un punto cada 3 s
       ?debug=1         muestra los eventos crudos en el feed
       ?test=1          botón para inyectar eventos falsos
     ============================================================ */
  var Q = new URLSearchParams(location.search);
  var CFG = {
    slug:       (Q.get('channel') || Q.get('slug') || 'mariotq').toLowerCase().trim(),
    chatroomId:  Q.get('chatroom')  || '6635680',
    channelId:   Q.get('channelid') || '6692133',
    max:    parseInt(Q.get('max')   || '1000', 10),
    page:   parseInt(Q.get('page')  || '150', 10),
    vpoll:  parseInt(Q.get('vpoll') || '20', 10) * 1000,
    bg:         (Q.get('bg') || 'dark').toLowerCase(),
    bar:         Q.get('bar')  !== '0',
    time:        Q.get('time') !== '0',
    keep:        Q.get('keep') !== '0',
    viewersOn:   Q.get('viewers') === '1',
    tipBots:    (Q.get('tipbot') || 'botrix,botrixbot,botrix_bot,tq_bot_irl')
                  .toLowerCase().split(',').map(function(s){return s.trim();}).filter(Boolean),
    tipAll:      Q.get('tipall') === '1',
    // Token o URL completa de las stats de Belabox (solo lectura).
    // Una vez que lo pasas por la URL queda guardado, así que si luego
    // editas la liga y se te olvida, sigue funcionando.
    bela: (function(){
      var v = (Q.get('bela') || '').trim(), url='';
      if (/^https?:\/\//i.test(v)) url = v;
      else if (/^[A-Za-z0-9_\-]{10,90}$/.test(v)) url = 'https://stats.srt.belabox.net/' + v;
      try{
        if (url) localStorage.setItem('kickfeed.bela', url);
        else if (Q.get('bela') === '') localStorage.removeItem('kickfeed.bela');  // ?bela= vacío lo borra
        else url = localStorage.getItem('kickfeed.bela') || '';
      }catch(e){}
      return url;
    })(),
    bpoll:  parseInt(Q.get('bpoll') || '1000', 10),   // cada cuánto pregunta, en ms
    // Mismos umbrales que NOALBS: abajo de "low" = amarillo, abajo de "offline" = rojo.
    blow:   parseInt(Q.get('blow')  || '500', 10),
    boff:   parseInt(Q.get('boff')  || '300', 10),
    rlow:   parseInt(Q.get('rlow')  || '1200', 10),
    roff:   parseInt(Q.get('roff')  || '2000', 10),
    bwin:   Math.max(10, parseInt(Q.get('bwin')  || '60', 10)) * 1000,   // ventana de la gráfica
    bstep:  Math.max(1,  parseFloat(Q.get('bstep') || '3'))     * 1000,   // un punto cada…
    bunit:      (Q.get('bunit') || 'kbps').toLowerCase(),
    rwalert: parseInt(Q.get('rwalert') || '5', 10),        // canjeos para el aviso grande
    rwwin: parseInt(Q.get('rwwin') || '900', 10) * 1000,   // ventana para agrupar, en segundos
    signal:      Q.get('signal') === '1',   // avisos de corte de señal dentro del feed
    botrix: (function(){
      var raw = location.search.match(/[?&]botrix=(.*)$/);
      if (raw && /^https?(:|%3A)/i.test(raw[1])){
        // que no se trague los parámetros que vayan después
        var v = raw[1].split(/&(?=bela=|bpoll=|blow=|boff=|rlow=|roff=|bwin=|bstep=|max=|page=|font=|bg=|bar=|time=|viewers=|vpoll=|test=|debug=)/)[0];
        try { if (/%3A|%2F/i.test(v)) v = decodeURIComponent(v); } catch(e){}
        return v;
      }
      return Q.get('botrix') || '';
    })(),
    botrixH: parseInt(Q.get('botrixh') || '45', 10),
    debug:       Q.get('debug') === '1',
    test:        Q.get('test')  === '1',
    font:        Q.get('font')  || ''
  };
  if (CFG.slug !== 'mariotq' && !Q.get('chatroom')) { CFG.chatroomId=''; CFG.channelId=''; }

  if (CFG.bg === 'transparent' || CFG.bg === 'none') document.body.classList.add('transparent');
  if (!CFG.bar)  document.body.classList.add('nobar');
  if (!CFG.time) document.body.classList.add('notime');
  if (CFG.test)  document.body.classList.add('testmode');
  if (CFG.font)  document.documentElement.style.setProperty('--row', parseInt(CFG.font,10)+'px');

  var $feed=document.getElementById('feed'), $empty=document.getElementById('empty'),
      $dot=document.getElementById('dot'), $vw=document.getElementById('pViewers'),
      $filt=document.getElementById('filters');
  document.getElementById('emptySlug').textContent = CFG.slug;

  function LSget(k,d){ try{ var v=localStorage.getItem(k); return v===null?d:v; }catch(e){ return d; } }
  function LSset(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }

  /* ============================================================
     VIEWERS EN VIVO
     Se consulta el endpoint público de Kick, que sí permite
     leerse desde otro dominio. Toca la píldora para mostrar
     u ocultar el número.
     ============================================================ */
  var $up=document.getElementById('pUptime'), $sb=document.getElementById('pSubs'),
      $kc=document.getElementById('pKicks');
  var viewersShown = LSget('kickfeed.viewers', CFG.viewersOn ? '1' : '0') === '1';
  var viewers = null;      // null = todavía no se sabe, 0 = offline
  var startMs = null;      // cuándo arrancó la transmisión
  var fakeStart = null;    // solo para el modo prueba

  // Contador de subs de la transmisión actual; se reinicia solo
  // cuando Kick reporta un ID de transmisión distinto.
  var sess = {id:null, subs:0, kicks:0, seen:null};
  try{ sess = JSON.parse(LSget('kickfeed.session','null')) || sess; }catch(e){}
  function saveSess(){ LSset('kickfeed.session', JSON.stringify(sess)); }

  function paintViewers(){
    $vw.classList.toggle('on', viewersShown);
    $vw.classList.toggle('live', viewers > 0);
    if (!viewersShown){ $vw.textContent = '👁'; return; }
    if (viewers === null) $vw.textContent = '👁 …';
    else if (viewers === 0) $vw.textContent = '👁 offline';
    else $vw.textContent = '👁 ' + viewers.toLocaleString('es-MX');
  }
  $vw.onclick = function(){
    viewersShown = !viewersShown;
    LSset('kickfeed.viewers', viewersShown ? '1' : '0');
    paintViewers();
    if (viewersShown) pollViewers();
  };

  /* El reloj tiene tres modos; se cambia tocándolo:
     0 = completo con segundos, 1 = corto, 2 = solo el icono. */
  var upMode = parseInt(LSget('kickfeed.upmode','0'),10) || 0;
  $up.onclick = function(){
    upMode = (upMode+1) % 3;
    LSset('kickfeed.upmode', String(upMode));
    paintUptime();
  };

  function fmtUptime(ms, mode){
    var t=Math.floor(ms/1000);
    var h=Math.floor(t/3600), m=Math.floor((t%3600)/60), s=t%60;
    if (mode===1) return h ? h+':'+String(m).padStart(2,'0') : m+'m';
    return (h ? h+':'+String(m).padStart(2,'0') : String(m).padStart(2,'0'))
           +':'+String(s).padStart(2,'0');
  }
  function paintUptime(){
    if (upMode===2){ $up.textContent='⏱'; }
    else $up.textContent = startMs ? '⏱ '+fmtUptime(Math.max(0, Date.now()-startMs), upMode) : '⏱ —';
    $up.classList.toggle('on', !!startMs && upMode!==2);
    fitBar();
  }
  function paintSubs(){
    $sb.textContent = '★ '+sess.subs;
    $sb.classList.toggle('has', sess.subs>0);
    fitBar();
  }
  function paintKicks(){
    var n = sess.kicks||0;
    $kc.textContent = '⚡ '+(n>=100000 ? Math.round(n/1000)+'k' : n);
    $kc.classList.toggle('has', n>0);
    fitBar();
  }

  /* Si la barra no alcanza, se esconde el nombre del canal.
     Si vuelve a caber, reaparece. */
  /* Si la barra no alcanza, encoge todo un poco hasta que quepa.
     Así nunca se corta una píldora en pantallas angostas. */
  var $bar=document.getElementById('bar'), $stats=document.getElementById('stats');
  var SCALES=[1,.94,.88,.82,.76,.70];
  // Mide los bordes reales: el desbordamiento hacia la izquierda no
  // se ve en scrollWidth, y ahí era justo donde se cortaban los viewers.
  function barFits(){
    var kids=$stats.children;
    if (!kids.length) return true;
    var b=$bar.getBoundingClientRect();
    var dot=document.getElementById('dot').getBoundingClientRect();
    var first=kids[0].getBoundingClientRect();
    var lastEl=($bela && $bela.style.display!=='none') ? $bela : kids[kids.length-1];
    var last=lastEl.getBoundingClientRect();
    // el punto de conexión también ocupa lugar: no debe encimarse
    return first.left >= dot.right + 1 && last.right <= b.right + 0.5;
  }
  function fitBar(){
    for (var i=0;i<SCALES.length;i++){
      $bar.style.setProperty('--bs', SCALES[i]);
      if (barFits()) return;
    }
  }
  window.addEventListener('resize', fitBar);

  // Kick manda las fechas sin zona horaria. Probamos leerlas como UTC
  // y como hora local, y nos quedamos con la que da un tiempo creíble.
  function parseKickDate(s){
    if (!s) return null;
    var iso = String(s).trim().replace(' ','T');
    var hasTz = /[Zz]|[+\-]\d\d:?\d\d$/.test(iso);
    var asUtc = Date.parse(iso + (hasTz ? '' : 'Z'));
    var asLocal = Date.parse(iso);
    // Se permite un pequeño desfase por si el reloj del celular va
    // unos segundos adelantado justo al arrancar la transmisión.
    var now=Date.now(), MAX=72*3600e3, MIN=-5*60e3;
    if (asUtc   && now-asUtc   >= MIN && now-asUtc   < MAX) return asUtc;
    if (asLocal && now-asLocal >= MIN && now-asLocal < MAX) return asLocal;
    return null;
  }

  function pollViewers(){
    if (!CFG.slug) return;
    fetch('https://kick.com/api/v2/channels/' + encodeURIComponent(CFG.slug) + '/livestream',
          {cache:'no-store'})
      .then(function(r){ return r.json(); })
      .then(function(j){
        var d = j && j.data;
        viewers = d ? (d.viewers || d.viewer_count || 0) : 0;
        if (d){
          if (String(d.id) !== String(sess.id)){   // transmisión nueva
            sess = {id:String(d.id), subs:0, kicks:0, seen:Date.now()};
            saveSess(); paintSubs();
          }
          if (!sess.seen){ sess.seen=Date.now(); saveSess(); }
          // 1) la hora que reporta Kick  2) si no sirve, desde que la vimos en vivo
          startMs = parseKickDate(d.created_at) || parseKickDate(d.start_time) || sess.seen;
        } else if (CFG.test){
          // En modo prueba, si no estás al aire igual echamos a andar el
          // reloj para poder comprobar que avanza segundo a segundo.
          if (!fakeStart) fakeStart = Date.now();
          startMs = fakeStart; viewers = 0;
        } else {
          startMs = null;   // fuera de línea: el contador de subs se conserva
        }
        paintViewers(); paintUptime();
      })
      .catch(function(){ /* sin red: se queda con el último valor */ });
  }
  paintViewers(); paintUptime(); paintSubs(); paintKicks();
  pollViewers();
  setInterval(pollViewers, Math.max(10000, CFG.vpoll));
  setInterval(paintUptime, 1000);

  /* ============================================================
     BITRATE DE BELABOX
     Lee el endpoint público de stats del relay (stats.srt.belabox.net).
     Es de SOLO LECTURA: con ese token nadie puede controlar tu equipo.
     Además de mostrar el número, avisa en el feed el momento exacto
     en que la señal se corta y cuándo vuelve.
     ============================================================ */
  var $bela=document.getElementById('pBela');
  var belaConn=null, belaFails=0;

  /* ---- gráfica: historial del bitrate ----
     Se lee cada segundo, pero se dibuja un punto por cada tramo de
     3 segundos (igual que IRL Toolkit) para que no se vea amontonado. Cada punto guarda la
     lectura MÁS BAJA de su tramo: así una caída de un segundo no se
     pierde. El último punto (el tramo que va corriendo) se mueve con
     cada lectura, para que se vea al momento. */
  var SLOTS=Math.max(5, Math.round(CFG.bwin/CFG.bstep));
  var pts=[];          // {i: número de tramo, v: mínimo del tramo, live: última lectura}
  var lastRead=null;   // {v, c, rtt} la lectura más reciente

  var $graph=document.getElementById('graph'), $gSvg=document.getElementById('gSvg'),
      $gBig=document.getElementById('gBig'), $gRtt=document.getElementById('gRtt'),
      $gSc=document.querySelector('#graph .sc');
  document.getElementById('gLow').textContent='Low '+CFG.blow;
  document.getElementById('gOff').textContent='Offline '+CFG.boff;
  document.getElementById('gWin').textContent='últimos '+Math.round(CFG.bwin/1000)+' s';
  document.getElementById('gL').textContent='hace '+Math.round(CFG.bwin/1000)+' s';
  var graphOpen=false;

  $bela.onclick=function(){ graphOpen ? closeGraph() : openGraph(); };
  $graph.onclick=closeGraph;
  // Se queda abierta hasta que la vuelvas a tocar.
  function openGraph(){ graphOpen=true; shownTop=null; zoomTo=null; $graph.classList.add('show'); drawGraph(); }
  function closeGraph(){ graphOpen=false; $graph.classList.remove('show'); }
  window.addEventListener('resize', function(){ if (graphOpen) drawGraph(); });

  var C_BLUE='#3ea6ff', C_LOW='#ffc107', C_OFF='#ff453a', C_SURF='#181b21';

  // Estado según NOALBS: 'ok', 'warn' (abajo de Low) o 'down' (abajo de Offline o sin señal).
  function belaState(kbps, conn){
    if (!conn || kbps < CFG.boff) return 'down';
    return kbps < CFG.blow ? 'warn' : 'ok';
  }
  var STATE_TXT={ok:'#53fc18', warn:'#ffb020', down:'#ff3b30'};
  function dotColor(v){ return v < CFG.boff ? C_OFF : (v < CFG.blow ? C_LOW : C_BLUE); }

  // v = kbps (0 si no hay señal) o null si el celular no pudo leer las stats.
  function addSample(v){
    var idx=Math.floor(Date.now()/CFG.bstep);
    var last=pts[pts.length-1];
    if (last && last.i===idx){
      if (v!=null){ last.v = (last.v==null) ? v : Math.min(last.v, v); last.live=v; }
    } else {
      // Tramos sin ninguna lectura (celular sin internet o pantalla
      // apagada) quedan vacíos: la línea se corta en lugar de caer a 0.
      var from = last ? last.i+1 : idx;
      if (idx-from > SLOTS) from = idx-SLOTS;
      for (var k=from;k<idx;k++) pts.push({i:k, v:null, live:null});
      pts.push({i:idx, v:v, live:v});
    }
    while (pts.length && pts[0].i <= idx-SLOTS) pts.shift();
  }

  function niceStep(top){
    // Pasos redondos como IRL Toolkit: de 200 en 200 cuando está de
    // cerca (0 a 1,000), de 1,000 en 1,000 cuando anda en 6,000…
    var st=[100,200,500,1000,2000,5000,10000,20000,50000];
    for (var i=0;i<st.length;i++) if (top/st[i] <= 7.01) return st[i];
    return 100000;
  }
  // Números completos en el eje: 2,000 / 4,000 / 10,000 (sin abreviar).
  function axisLabel(v){ return Number(v).toLocaleString('es-MX'); }

  function drawGraph(){
    if (!graphOpen) return;

    // ---- encabezado: número grande y RTT ----
    if (lastRead){
      var st=belaState(lastRead.v, lastRead.c);
      $gBig.textContent = lastRead.c ? fmtRate(lastRead.v) : 'sin señal';
      $gBig.style.color = STATE_TXT[st];
      if (lastRead.c && lastRead.rtt){
        $gRtt.textContent='RTT '+lastRead.rtt+' ms';
        $gRtt.style.color = lastRead.rtt>=CFG.roff ? '#ff3b30' : (lastRead.rtt>=CFG.rlow ? '#ffb020' : '');
      } else $gRtt.textContent='';
    } else { $gBig.textContent='—'; $gBig.style.color=''; $gRtt.textContent=''; }

    // ---- puntos visibles ----
    var cur=Math.floor(Date.now()/CFG.bstep);
    gP=[];   // {s: posición 0..SLOTS-1, v, live}
    for (var j=0;j<pts.length;j++){
      var p=pts[j], s=SLOTS-1-(cur-p.i);
      if (s<0 || s>SLOTS-1) continue;
      var isLive = (p.i===cur);
      gP.push({s:s, v: isLive ? p.live : p.v, live:isLive});
    }

    // ---- ZOOM AUTOMÁTICO (como IRL Toolkit) ----
    // La escala se ajusta a todo lo que se ve en los 60 s: nada se corta.
    // Si el bitrate anda bajo, la gráfica se va acercando conforme los
    // valores altos salen por la izquierda; si sube, se aleja.
    var mx=0;
    gP.forEach(function(q){ if (q.v!=null && q.v>mx) mx=q.v; });
    var want=Math.max(mx*1.05, CFG.blow*2, 1000);
    var step=niceStep(want), target=Math.ceil(want/step)*step;

    if (shownTop==null){ shownTop=target; }
    if (target!==zoomTo){
      // transición suave de ~0.6 s en lugar de un brinco
      zoomFrom=shownTop; zoomTo=target; zoomT0=Date.now();
      if (!zoomRaf) zoomRaf=requestAnimationFrame(zoomTick);
    }
    renderGraph();
  }

  var gP=[], shownTop=null, zoomFrom=null, zoomTo=null, zoomT0=0, zoomRaf=0, ZOOM_MS=600;
  function zoomTick(){
    zoomRaf=0;
    if (!graphOpen){ shownTop=zoomTo; return; }
    var t=Math.min(1, (Date.now()-zoomT0)/ZOOM_MS);
    var e=1-Math.pow(1-t,3);                      // empieza rápido y frena suave
    shownTop = zoomFrom + (zoomTo-zoomFrom)*e;
    renderGraph();
    if (t<1) zoomRaf=requestAnimationFrame(zoomTick);
  }

  function renderGraph(){
    var P=gP, top=shownTop||1000;
    var step=niceStep(top);

    // ---- medidas reales del SVG (se adapta al ancho del celular) ----
    var W=$gSvg.clientWidth||360, H=$gSvg.clientHeight||150;
    var R=8, T=8, B=6;
    var maxTick=Math.floor(top/step)*step;
    var L = 12 + axisLabel(maxTick).length*6;    // margen según el número más largo
    $gSc.style.paddingLeft = L+'px';
    $gSvg.setAttribute('viewBox','0 0 '+W+' '+H);

    var X=function(s){ return L + s*(W-L-R)/(SLOTS-1); };
    var Y=function(v){ return T + (1-Math.max(0,v)/top)*(H-T-B); };
    var f=function(n){ return n.toFixed(1); };

    // Recorte de seguridad para que nada se salga del recuadro.
    var out='<defs><clipPath id="gClip"><rect x="'+(L-6)+'" y="0" width="'+(W-L+6)+'" height="'+(H-B+8)+'"/></clipPath></defs>';
    // cuadrícula horizontal y números del eje
    for (var v=0; v<=top+0.5; v+=step){
      var y=f(Y(v));
      out+='<text x="'+(L-6)+'" y="'+(+y+3.5)+'" text-anchor="end" font-size="10" fill="#8b92a0">'+axisLabel(v)+'</text>';
    }
    out+='<g clip-path="url(#gClip)">';

    // tramos continuos (se cortan donde no hubo lectura)
    var segs=[], seg=[];
    P.forEach(function(q){
      if (q.v==null){ if (seg.length) segs.push(seg); seg=[]; }
      else {
        if (seg.length && q.s !== seg[seg.length-1].s+1){ segs.push(seg); seg=[]; }
        seg.push(q);
      }
    });
    if (seg.length) segs.push(seg);

    // Línea curva suave (como IRL Toolkit) sin pasarse de los puntos reales.
    function smooth(xy){
      var n=xy.length; if (n<3){ var d0=''; xy.forEach(function(p,k){ d0+=(k?'L':'M')+f(p[0])+' '+f(p[1])+' '; }); return d0; }
      var dx=[],m=[],t=[];
      for (var i=0;i<n-1;i++){ dx[i]=xy[i+1][0]-xy[i][0]; m[i]=(xy[i+1][1]-xy[i][1])/dx[i]; }
      t[0]=m[0]; t[n-1]=m[n-2];
      for (i=1;i<n-1;i++) t[i]=(m[i-1]*m[i]<=0)?0:(m[i-1]+m[i])/2;
      for (i=0;i<n-1;i++){
        if (m[i]===0){ t[i]=0; t[i+1]=0; continue; }
        var a=t[i]/m[i], b=t[i+1]/m[i], h=a*a+b*b;
        if (h>9){ var k3=3/Math.sqrt(h); t[i]=k3*a*m[i]; t[i+1]=k3*b*m[i]; }
      }
      var d='M'+f(xy[0][0])+' '+f(xy[0][1]);
      for (i=0;i<n-1;i++){
        var h3=dx[i]/3;
        d+=' C'+f(xy[i][0]+h3)+' '+f(xy[i][1]+t[i]*h3)+' '+f(xy[i+1][0]-h3)+' '+f(xy[i+1][1]-t[i+1]*h3)+' '+f(xy[i+1][0])+' '+f(xy[i+1][1]);
      }
      return d+' ';
    }
    var paths=segs.map(function(sg){
      var d=smooth(sg.map(function(q){ return [X(q.s), Y(q.v)]; }));
      return {d:d, x0:f(X(sg[0].s)), x1:f(X(sg[sg.length-1].s))};
    });
    var y0=f(Y(0));
    // la "montaña": relleno suave debajo de la línea
    paths.forEach(function(pa){
      out+='<path d="'+pa.d+'L'+pa.x1+' '+y0+' L'+pa.x0+' '+y0+' Z" fill="rgba(52,120,210,.72)"/>';
    });
    // cuadrícula tipo cuaderno: una raya vertical por cada punto y una
    // horizontal por cada número del eje (se ve encima de la montaña)
    for (var gs=0; gs<SLOTS; gs++){
      var gx=f(X(gs));
      out+='<line x1="'+gx+'" x2="'+gx+'" y1="'+T+'" y2="'+y0+'" stroke="rgba(255,255,255,.07)" stroke-width="1"/>';
    }
    for (var gv=0; gv<=top+0.5; gv+=step){
      var gy=f(Y(gv));
      out+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+gy+'" y2="'+gy+'" stroke="rgba(255,255,255,'+(gv?'.10':'.22')+')" stroke-width="1"/>';
    }
    // líneas de NOALBS
    out+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+f(Y(CFG.blow))+'" y2="'+f(Y(CFG.blow))+'" stroke="'+C_LOW+'" stroke-width="1.5"/>';
    out+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+f(Y(CFG.boff))+'" y2="'+f(Y(CFG.boff))+'" stroke="'+C_OFF+'" stroke-width="1.5"/>';
    // la línea del bitrate
    paths.forEach(function(pa){
      out+='<path d="'+pa.d+'" fill="none" stroke="#eef4ff" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
    });
    // los puntos: azul normal, amarillo abajo de Low, rojo abajo de Offline
    P.forEach(function(q){
      if (q.v==null) return;
      var cx=f(X(q.s)), cy=f(Y(q.v)), col=dotColor(q.v);
      if (q.live){
        out+='<circle cx="'+cx+'" cy="'+cy+'" r="7.5" fill="none" stroke="'+col+'" stroke-width="2"/>'+
             '<circle cx="'+cx+'" cy="'+cy+'" r="5" fill="#fff" stroke="'+C_SURF+'" stroke-width="2"/>';
      } else {
        out+='<circle cx="'+cx+'" cy="'+cy+'" r="3.3" fill="'+(col===C_BLUE?'#2a62b0':col)+'" stroke="#fff" stroke-width="1.4"/>';
      }
    });
    out+='</g>';
    $gSvg.innerHTML=out;
  }

  // Por defecto el número exacto en Kbps (5212 Kbps).
  // Con ?bunit=mbps lo muestra redondeado (5.2 Mbps).
  function fmtRate(kbps){
    var n=Math.round(Number(kbps)||0);
    if (CFG.bunit==='mbps')
      return n>=1000 ? (n/1000).toFixed(n>=10000?0:1)+' Mbps' : n+' Kbps';
    return n+' Kbps';
  }

  function pollBela(){
    if (!CFG.bela) return;
    fetch(CFG.bela, {cache:'no-store'})
      .then(function(r){ return r.json(); })
      .then(function(j){
        belaFails=0;
        var pub = j && j.publishers ? (j.publishers.live || j.publishers[Object.keys(j.publishers)[0]]) : null;
        if (!pub){
          $bela.textContent='📶 —'; $bela.className='pill';
          addSample(null); drawGraph(); return;
        }

        var conn = !!pub.connected;
        var kbps = conn ? Number(pub.bitrate||0) : 0;
        var rtt  = Math.round(Number(pub.rtt||0));

        lastRead={v:kbps, c:conn, rtt:rtt};
        addSample(kbps);

        var st=belaState(kbps, conn);
        $bela.textContent = conn ? '📶 '+fmtRate(kbps) : '📶 sin señal';
        $bela.className = 'pill '+st;
        drawGraph();

        // Solo avisamos los cambios, no el estado inicial.
        if (CFG.signal && belaConn !== null && conn !== belaConn){
          if (conn) push('signal','<span class="name">Señal restablecida</span>',
                         fmtRate(kbps), 'sig:up:'+Date.now(), null, 'up');
          else      push('signal','<span class="name">Se cortó la señal</span>',
                         'El relay dejó de recibir video', 'sig:down:'+Date.now());
        }
        belaConn = conn;
        fitBar();
      })
      .catch(function(){
        // El celular no pudo leer las stats: hueco en la gráfica.
        // A los 5 intentos fallidos la píldora (y el número grande)
        // se marcan como desconocidos para no enseñar un dato viejo.
        if (++belaFails>=5){ $bela.textContent='📶 ?'; $bela.className='pill'; lastRead=null; }
        addSample(null); drawGraph();
      });
  }
  if (CFG.bela){
    $bela.style.display='';
    pollBela();
    setInterval(pollBela, Math.max(500, CFG.bpoll));
  }

  /* ============================================================
     FILTROS
     ============================================================ */
  var TYPES = [
    ['follow','Seguidores',true],['sub','Subs',true],['gift','Gifted',true],
    ['kicks','Kicks',true],['tip','Tips',true],['reward','Recompensas',true],
    ['host','Hosts',true],['live','En vivo',true],['mod','Moderación',false]
  ];
  // Los avisos de señal ya no van al feed; con ?signal=1 vuelven.
  if (CFG.signal) TYPES.splice(7,0,['signal','Señal',true]);
  var enabled = {}, chips = {};
  TYPES.forEach(function(t){ enabled[t[0]] = t[2]; });
  try{
    var saved = JSON.parse(LSget('kickfeed.filters','null'));
    if (saved) Object.keys(enabled).forEach(function(k){ if (k in saved) enabled[k] = !!saved[k]; });
  }catch(e){}
  TYPES.forEach(function(t){ var v=Q.get(t[0]); if(v==='0')enabled[t[0]]=false; if(v==='1')enabled[t[0]]=true; });

  var $rw = document.getElementById('rwBtn');

  function setFilter(type, value){
    enabled[type] = value;
    if (chips[type]) chips[type].classList.toggle('on', value);
    if (type === 'reward') $rw.classList.toggle('on', value);
    LSset('kickfeed.filters', JSON.stringify(enabled));
    Array.prototype.forEach.call($feed.querySelectorAll('.item.'+type), function(el){
      el.style.display = value ? '' : 'none';
    });
  }

  TYPES.forEach(function(t){
    var b=document.createElement('button');
    b.className='chip'+(enabled[t[0]]?' on':''); b.textContent=t[1];
    b.onclick=function(){ setFilter(t[0], !enabled[t[0]]); };
    chips[t[0]]=b; $filt.appendChild(b);
  });

  $rw.classList.toggle('on', enabled.reward);
  $rw.onclick = function(){ setFilter('reward', !enabled.reward); };

  /* copiar historial */
  var cp=document.createElement('button');
  cp.className='chip wide'; cp.textContent='📋  Copiar historial';
  cp.onclick=function(){
    var txt=LOG.map(function(e){
      var d=document.createElement('div');
      d.innerHTML=e.html+(e.sub?' — '+e.sub:'')+(e.msg?' — "'+e.msg+'"':'');
      return hhmm(e.ts)+'  '+d.textContent.replace(/\s+/g,' ').trim();
    }).join('\n');
    copy(txt, cp, '📋  Copiar historial', LOG.length);
  };
  $filt.appendChild(cp);

  /* copiar diagnóstico: los eventos crudos que mandó Kick */
  var dg=document.createElement('button');
  dg.className='chip wide'; dg.textContent='🧪  Copiar diagnóstico';
  dg.onclick=function(){ copy(RAW.join('\n\n'), dg, '🧪  Copiar diagnóstico', RAW.length); };
  $filt.appendChild(dg);

  var ver=document.createElement('div');
  ver.className='chip wide'; ver.style.cssText='cursor:default;opacity:.55;border-style:dashed';
  ver.textContent='Versión '+VERSION;
  $filt.appendChild(ver);

  var clr=document.createElement('button');
  clr.className='chip wide'; clr.textContent='🗑  Vaciar historial';
  clr.onclick=function(){
    if (!confirm('¿Borrar todos los eventos guardados?')) return;
    LOG=[]; RAW=[]; saveLog(true); LSset('kickfeed.raw','[]'); repaint();
  };
  $filt.appendChild(clr);

  function copy(txt, btn, original, n){
    var ok=function(){ btn.textContent='✅  Copiado ('+n+')';
                       setTimeout(function(){ btn.textContent=original; },1800); };
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(ok, function(){ fb(txt, ok); });
    } else fb(txt, ok);
  }
  function fb(txt, ok){
    var ta=document.createElement('textarea');
    ta.value=txt; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); ok(); }catch(e){}
    document.body.removeChild(ta);
  }

  document.getElementById('gear').onclick=function(){ $filt.classList.toggle('open'); };

  /* ============================================================
     PANEL DE BOTRIX (opcional)
     ============================================================ */
  var $bx=document.getElementById('bx'), $bxBtn=document.getElementById('bxBtn');
  if (/^https:\/\/(www\.)?botrix\.live\//i.test(CFG.botrix)){
    var fr=document.createElement('iframe');
    fr.src=CFG.botrix;
    $bx.appendChild(fr);
    $bx.style.height=Math.min(80,Math.max(15,CFG.botrixH))+'vh';
    $bxBtn.style.display='';
    var bxOpen = LSget('kickfeed.botrix','1')==='1';
    var bxSet = function(v){
      bxOpen=v; $bx.classList.toggle('show',v);

  function esc(s){

      .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  function emotes(s){

  function hhmm(ts){

  var LOG=[], RAW=[];

  var saveT=null;
  function flushLog(){ clearTimeout(saveT); LSset('kickfeed.log', JSON.stringify(LOG.slice(0,CFG.max))); }
  function saveLog(now){
    if (!CFG.keep) return;
    if (now) return flushLog();
    clearTimeout(saveT); saveT=setTimeout(flushLog,400);
  }
  window.addEventListener('pagehide', function(){ if(CFG.keep) flushLog(); });
  document.addEventListener('visibilitychange', function(){ if(document.hidden && CFG.keep) flushLog(); });

  var seen={};
  function dedupe(key){
    if(!key) return false;
    var now=Date.now();
    if(seen[key] && now-seen[key]<8000) return true;
    seen[key]=now;
    if(Object.keys(seen).length>400) seen={};
    return false;
  }

  /* --- separadores de día --- */
  function dayKey(ts){ var d=new Date(ts); return d.getFullYear()+'-'+d.getMonth()+'-'+d.getDate(); }
  var DIAS=['dom','lun','mar','mié','jue','vie','sáb'];
  var MESES=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  function dayLabel(ts){
    var d=new Date(ts);
    return DIAS[d.getDay()]+' '+d.getDate()+' '+MESES[d.getMonth()];
  }
  function daySep(ts){
    var s=document.createElement('div');
    s.className='day'; s.dataset.day=dayKey(ts); s.textContent=dayLabel(ts);
    return s;
  }

  function itemEl(ev){
    var el=document.createElement('div');
    el.className='item '+ev.type+(ev.cls?' '+ev.cls:'');
    el.dataset.id=ev.id;
    if(!enabled[ev.type] && ev.type!=='sys') el.style.display='none';
    el.innerHTML=
      '<div class="ic">'+(ICONS[ev.type]||'·')+'</div>'+
      '<div class="body"><div class="line">'+ev.html+
          ((ev.n>1)?'<span class="mult"> ×'+ev.n+'</span>':'')+'</div>'+
        (ev.sub?'<span class="sub">'+ev.sub+'</span>':'')+
        (ev.msg?'<span class="msg">'+ev.msg+'</span>':'')+
      '</div>'+
      '<div class="right"><div class="t">'+hhmm(ev.ts)+'</div>'+
        (ev.type==='signal' ? '<div class="x">✕</div>' : '')+
      '</div>';

    // Los avisos de señal se pueden borrar para que no ensucien la actividad.
    if (ev.type==='signal'){
      el.querySelector('.x').onclick=function(e){
        e.stopPropagation();
        for (var i=0;i<LOG.length;i++){
          if (LOG[i].id===ev.id){ LOG.splice(i,1); saveLog(true); break; }
        }
        el.remove();
        if (shown>0) shown--;
        paintMore();
      };
    }
    return el;
  }

  /* Pintado por tandas: primero las más recientes, el resto con "Ver más". */
  var shown=0, topDay=null, bottomDay=null, $more=null;

  function appendMore(){
    var end=Math.min(LOG.length, shown+CFG.page);
    for (var i=shown;i<end;i++){
      var ev=LOG[i], k=dayKey(ev.ts);
      if (k!==bottomDay){ $feed.appendChild(daySep(ev.ts)); bottomDay=k; if(topDay===null) topDay=k; }
      $feed.appendChild(itemEl(ev));
    }
    shown=end;
    paintMore();
  }
  function paintMore(){
    if ($more){ $more.remove(); $more=null; }
    if (shown < LOG.length){
      $more=document.createElement('button');
      $more.id='more';
      $more.textContent='Ver '+Math.min(CFG.page, LOG.length-shown)+' eventos más antiguos ('+
                        (LOG.length-shown)+' guardados)';
      $more.onclick=appendMore;
      $feed.appendChild($more);
    }
  }
  function repaint(){
    $feed.innerHTML=''; shown=0; topDay=null; bottomDay=null; $more=null;
    if ($empty){ $empty=null; }
    appendMore();
  }

  // msgHtml: el mensaje que escribió la persona (kicks, tips), en su propio recuadro
  function push(type, html, subHtml, dedupeKey, msgHtml, cls){
    if (dedupeKey && dedupe(dedupeKey)){
      if (msgHtml) enrich(dedupeKey, msgHtml);   // el duplicado traía el mensaje: se lo pegamos
      return null;
    }
    var ev={id:'e'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),
            type:type, html:html, sub:subHtml||'', msg:msgHtml||'',
            cls:cls||'', key:dedupeKey||'', ts:Date.now()};
    if (type!=='sys'){ LOG.unshift(ev); LOG=LOG.slice(0,CFG.max); saveLog(); }

    if ($empty){ $empty.remove(); $empty=null; }
    var k=dayKey(ev.ts);
    if (k!==topDay){ $feed.insertBefore(daySep(ev.ts), $feed.firstChild); topDay=k;
                     if (bottomDay===null) bottomDay=k; }
    $feed.insertBefore(itemEl(ev), $feed.children[1] || null);
    shown++;
    $feed.scrollTop=0;
    return ev;
  }

  /* Suma los Kicks de la sesión. Solo cuenta cuando el evento
     realmente entró: los duplicados de Kick y de Botrix no suman. */
  function countKicks(created, amount){
    if (!created) return;
    var n = parseInt(String(amount||'').replace(/[^\d]/g,''), 10);
    if (!n) return;
    sess.kicks = (sess.kicks||0) + n;
    saveSess(); paintKicks();
  }

  /* Si el mismo evento se repite (recompensas spameadas), en vez de
     agregar otra línea le sube el contador a la que ya está. */
  function bump(key, maxAge, cb){
    for (var i=0;i<Math.min(LOG.length,8);i++){
      var e=LOG[i];
      if (e.key===key && Date.now()-e.ts < maxAge){
        e.n=(e.n||1)+1; e.ts=Date.now();
        if (cb) cb(e);
        saveLog(true);
        var el=$feed.querySelector('.item[data-id="'+e.id+'"]');
        if (el) el.replaceWith(itemEl(e));
        return e;
      }
    }
    return null;
  }

  /* ============================================================
     AVISO GRANDE CUANDO SPAMEAN UNA RECOMPENSA
     A partir de cierta cantidad de canjeos seguidos baja una franja
     con el nombre de la recompensa. Se quita tocándola, y si le
     siguen dando vuelve a salir.
     ============================================================ */
  var $alerts=document.getElementById('alerts');
  var alertState={};

  function rewardAlert(key, title, n){
    var st = alertState[key] || (alertState[key] = {el:null, n:0, dismissed:0});
    st.n = n;
    if (n < CFG.rwalert) return;
    if (n < st.dismissed + CFG.rwalert) return;   // ya lo quitaste: espera otra tanda
    if (st.el){ st.el.querySelector('.n').textContent='×'+n; return; }

    var el=document.createElement('div');
    el.className='alert';
    el.innerHTML='<span class="ttl">'+esc(title)+'</span>'+
                 '<span class="n">×'+n+'</span>'+
                 '<span class="hint">toca para quitar</span>';
    el.onclick=function(){ el.remove(); st.el=null; st.dismissed=st.n; };
    $alerts.appendChild(el);
    st.el=el;
  }

  /* Cuando alguien comparte su resub con un mensaje, Kick lo manda
     aparte del evento de suscripción. Esto le pega el mensaje a la
     línea de esa persona si acaba de aparecer. */
  function enrichSub(username, msgHtml){
    var pref = 's:'+String(username||'');
    for (var i=0;i<Math.min(LOG.length,15);i++){
      var e=LOG[i];
      if (e.type==='sub' && !e.msg && Date.now()-e.ts < 120000 &&
          String(e.key||'').toLowerCase().indexOf(pref.toLowerCase()) === 0){
        e.msg = msgHtml; saveLog(true);
        var el=$feed.querySelector('.item[data-id="'+e.id+'"]');
        if (el) el.replaceWith(itemEl(e));
        return;
      }
    }
  }

  // Rellena el mensaje de un evento que ya estaba en la lista.
  function enrich(key, msgHtml){
    for (var i=0;i<Math.min(LOG.length,25);i++){
      if (LOG[i].key===key && !LOG[i].msg){
        LOG[i].msg=msgHtml; saveLog(true);
        var el=$feed.querySelector('.item[data-id="'+LOG[i].id+'"]');
        if (el){
          var s=document.createElement('span');
          s.className='msg'; s.innerHTML=msgHtml;
          el.querySelector('.body').appendChild(s);
        }
        return;
      }
    }
  }

  if (LOG.length){ $empty.remove(); $empty=null; appendMore(); }

  function nm(u){ return '<span class="name">'+esc(u||'Alguien')+'</span>'; }
  function plural(n,one,many){ return n+' '+(Number(n)===1?one:many); }

  /* Busca un texto escrito por la persona en cualquier parte del payload.
     Kick mete el mensaje de los Kicks en un lugar distinto según el regalo. */
  var MSG_KEYS=['message','content','text','comment','user_message','msg','body','caption','note'];
  function deepMessage(obj, depth){
    depth = depth || 0;
    if (!obj || typeof obj!=='object' || depth>4) return null;
    for (var i=0;i<MSG_KEYS.length;i++){
      var v = obj[MSG_KEYS[i]];
      if (typeof v==='string' && v.trim() && v.length<500) return v.trim();
      if (v && typeof v==='object'){
        var inner = deepMessage(v, depth+1);
        if (inner) return inner;
      }
    }
    for (var k in obj){
      if (!Object.prototype.hasOwnProperty.call(obj,k)) continue;
      if (MSG_KEYS.indexOf(k)!==-1) continue;
      if (obj[k] && typeof obj[k]==='object'){
        var d = deepMessage(obj[k], depth+1);
        if (d) return d;
      }
    }
    return null;
  }

  /* ============================================================
     TIPS / DONACIONES  (llegan por el anuncio de Botrix en el chat)
     ============================================================ */
  var W = '[\\w\\u00C0-\\u024F.\\-]{2,30}';
  var AT_RX = new RegExp('@('+W+')');
  var AMT_CODE_RX = /([\d][\d.,]*)\s*(MXN|USD|EUR|GBP|ARS|COP|CLP|PEN|BRL)\b/i;  // 150 MXN
  var AMT_NUMSYM_RX = /([\d][\d.,]*)\s*(\$|€|£)/;                                 // 1 $
  var AMT_SYM_RX  = /(\$|€|£)\s*([\d][\d.,]*)/;                                   // $150

  /* Botrix escribe tal cual las variables que no reconoce, por ejemplo
     "$(message)". Eso no es texto de nadie, así que se quita. */
  /* El nick puede traer espacios ("Lil Milk"). En las plantillas de
     Botrix siempre va entre la @ y la palabra que sigue ("gracias",
     "se rifó"), así que se captura todo ese pedazo. */
  var AT_LONG_RX = /@\s*([^\n¡!]{2,40}?)\s+(?:¡\s*)?(?:gracias|thanks|se\s+rif)/i;
  function nickAfterAt(text){
    var m = text.match(AT_LONG_RX);
    if (m && m[1].trim()) return m[1].trim();
    var a = text.match(AT_RX);
    return a ? a[1] : null;
  }

  function dropVars(s){
    return String(s||'').replace(/\$\([^)]*\)/g,'').replace(/\s{2,}/g,' ').trim();
  }
  /* Quita las menciones @nick antes de buscar el monto: si no, un nick
     como "Beiker05" hacía que la donación saliera como $05. */
  function stripMentions(s){ return String(s||'').replace(/@\S+/g,' '); }
  var TIP_RX = [
    new RegExp('('+W+')\\s+(?:acaba de donar|te acaba de donar|ha donado|te don[oó]|don[oó]|donated|tipped)\\D{0,15}?([\\d][\\d.,]*)','i'),
    new RegExp('donaci[oó]n de\\s+('+W+')\\D{0,15}?([\\d][\\d.,]*)','i'),
    new RegExp('(?:tip|propina) de\\s+('+W+')\\D{0,15}?([\\d][\\d.,]*)','i'),
    new RegExp('^('+W+')\\s*[:\\-]\\s*(?:don[oó]|tip|propina)\\D{0,15}?([\\d][\\d.,]*)','i')
  ];
  var NICK_RX = [ new RegExp('(?:gracias|thanks)\\s+(?:a\\s+)?('+W+')','i') ];
  // "donó", "tip", "propina" = señal fuerte de donación.
  var TIPSTRONG_RX = /(dona|don[oó]|donat|tipp|tipe|\btip\b|propina)/i;
  // "gracias" solo no basta: Botrix también da las gracias por subs,
  // resubs y follows, y eso hacía que una resub saliera como donación.
  var NOTTIP_RX = /(suscri|subscri|resub|\bsubs?\b|mes(es)?\b|month|renov|seguir|seguidor|follow|puntos|points|kick)/i;

  function tryTip(username, content, msgId){
    var from = String(username||'').toLowerCase();
    if (!CFG.tipAll && CFG.tipBots.indexOf(from) === -1) return false;

    // Si pones " | " en la plantilla de Botrix, lo que va después
    // se muestra aparte como el mensaje que dejó quien donó.
    var donorMsg='', body=content;
    var bar = content.lastIndexOf(' | ');
    if (bar > 0){ donorMsg = dropVars(content.slice(bar+3)); body = content.slice(0,bar); }
    body = dropVars(body);

    // Los emotes traen números; se quitan antes de buscar el monto.
    var clean = body.replace(/\[emote:\d+:[^\]]*\]/g,' ');
    var forAmount = stripMentions(clean);

    var amount=null, cur='';
    var mc = forAmount.match(AMT_CODE_RX),
        mn = forAmount.match(AMT_NUMSYM_RX),
        ms = forAmount.match(AMT_SYM_RX);
    if (mc){ amount=mc[1]; cur=mc[2].toUpperCase(); }
    else if (mn){ amount=mn[1]; cur=mn[2]; }
    else if (ms){ amount=ms[2]; cur=ms[1]; }

    var strong = TIPSTRONG_RX.test(clean);
    if (!amount && strong){
      var am = forAmount.match(/([\d][\d.,]*)/);
      if (am) amount = am[1];
    }
    if (!amount) return false;              // sin monto no es tip
    if (!strong && !cur) return false;      // sin moneda ni palabra clara, tampoco
    // Habla de subs, meses, follows o Kicks: no es una donación.
    if (!strong && NOTTIP_RX.test(clean)) return false;

    var who = nickAfterAt(clean);
    if (!who){
      for (var i=0;i<TIP_RX.length;i++){
        var m = clean.match(TIP_RX[i]);
        if (m){ who=m[1]; break; }
      }
    }
    if (!who){
      for (var j=0;j<NICK_RX.length;j++){
        var n = clean.match(NICK_RX[j]); if (n){ who=n[1]; break; }
      }
    }

    var money = /^[$€£]$/.test(cur) ? cur+amount : '$'+amount+(cur?' '+cur:'');
    var head = (who ? nm(who)+' donó' : '<span class="name">Donación</span>') + ' ' + esc(money);
    push('tip', head, emotes(body), 'tip:'+(msgId||content),
         donorMsg ? emotes(donorMsg) : null);
    return true;
  }

  /* ============================================================
     KICKS ANUNCIADOS POR BOTRIX EN EL CHAT
       @$(name) se rifó $(amount) KICKs! mariotqMONEY
     Kick manda su propio evento de Kicks, así que los dos se
     juntan en una sola línea (la clave es nick + cantidad).
     ============================================================ */
  var KICKS_RX = /([\d][\d.,]*)\s*KICKS?\b/i;

  function kicksKey(nick, amount){
    return 'k:'+String(nick||'').toLowerCase()+':'+String(amount||'').replace(/[^\d]/g,'');
  }

  function tryKicks(username, content, msgId){
    var from = String(username||'').toLowerCase();
    if (!CFG.tipAll && CFG.tipBots.indexOf(from) === -1) return false;

    var donorMsg='', body=content;
    var bar = content.lastIndexOf(' | ');
    if (bar > 0){ donorMsg = dropVars(content.slice(bar+3)); body = content.slice(0,bar); }
    body = dropVars(body);

    var clean = body.replace(/\[emote:\d+:[^\]]*\]/g,' ');
    var m = stripMentions(clean).match(KICKS_RX);
    if (!m) return false;

    var amount = m[1];
    var who = nickAfterAt(clean);
    if (!who){
      var w = clean.match(new RegExp('^('+W+')\\s'));
      if (w) who = w[1];
    }
    countKicks(push('kicks', nm(who)+' mandó '+esc(amount)+' Kicks', null,
                    kicksKey(who, amount), donorMsg ? emotes(donorMsg) : null), amount);
    return true;
  }

  /* ============================================================
     EVENTOS DE KICK
     ============================================================ */
  function handle(evName, d, rawChannel){
    var short=String(evName||'').replace('App\\Events\\','').replace('App\\\\Events\\\\','');

    // Guarda los eventos crudos (sin el chat normal) para diagnosticar.
    var isPlainChat = /ChatMessage/.test(short) && !d.metadata && d.type !== 'celebration';
    if (!isPlainChat){
      RAW.unshift(hhmm(Date.now())+' '+short+' @'+rawChannel+'\n'+
                  JSON.stringify(d).slice(0,1500));
      RAW = RAW.slice(0,40);
      if (CFG.keep) LSset('kickfeed.raw', JSON.stringify(RAW));
    }
    if (CFG.debug) console.log('[kickfeed]', short, rawChannel, d);

    switch(short){

      case 'FollowersUpdated': {
        var user=d.username||(d.follower&&d.follower.username)||null;
        if (d.followed===false) return;
        if (user) push('follow', nm(user)+' te siguió', null, 'f:'+user);
        else if (typeof d.followersCount==='number')
          push('follow','Nuevo seguidor',
               'Total: '+d.followersCount.toLocaleString('es-MX'),'fc:'+d.followersCount);
        return;
      }

      case 'SubscriptionEvent': {
        var m=Number(d.months||1);
        sess.subs++; saveSess(); paintSubs();
        push('sub', nm(d.username)+(m>1?' se resuscribió':' se suscribió'),
             m>1?plural(m,'mes','meses')+' seguidos':'Sub nueva', 's:'+d.username+':'+m,
             null, m>1?'resub':'');
        return;
      }

      case 'GiftedSubscriptionsEvent': {
        var list=d.gifted_usernames||d.giftedUsernames||[];
        var count=Number(d.gifted_count||d.giftedCount||list.length||1);
        sess.subs+=count; saveSess(); paintSubs();
        push('gift', nm(d.gifter_username||d.gifterUsername)+' regaló '+plural(count,'sub','subs'),
             list.length?'Para: '+esc(list.slice(0,10).join(', '))+(list.length>10?'…':''):null,
             'g:'+(d.gifter_username||d.gifterUsername)+':'+count);
        return;
      }

      case 'LuckyUsersWhoGotGiftSubscriptionsEvent': {
        var lu=d.usernames||[];
        push('gift', nm(d.gifter_username||d.gifterUsername)+' regaló '+plural(lu.length||1,'sub','subs'),
             lu.length?'Para: '+esc(lu.slice(0,10).join(', ')):null,
             'lg:'+(d.gifter_username||d.gifterUsername)+':'+lu.length);
        return;
      }

      case 'SubscriptionsUpdated': return;

      /* ---- Kicks (la moneda) ---- */
      case 'KicksGifted':
      case 'GiftedKicks':
      case 'KicksSent':
      case 'GiftsLeaderboardUpdated': {
        var sender=(d.sender&&d.sender.username)||d.username||d.gifter_username||
                   (d.gifter&&d.gifter.username)||(d.user&&d.user.username);
        var amount=d.amount||d.kicks||d.quantity||d.kicks_amount||
                   (d.gift&&(d.gift.amount||d.gift.quantity||d.gift.tier));
        if (short==='GiftsLeaderboardUpdated' && !amount) return;
        var giftName=(d.gift&&(d.gift.name||d.gift.gift_name))||d.gift_name||'';
        var text=deepMessage(d);
        if (text && giftName && text===giftName) text=null;   // no repitas el nombre del regalo
        countKicks(push('kicks', nm(sender)+' mandó '+(amount?esc(amount)+' Kicks':'Kicks'),
                        giftName?esc(giftName):null,
                        kicksKey(sender, amount),
                        text?emotes(text):null), amount);
        return;
      }

      case 'RewardRedeemedEvent': {
        var title=d.reward_title||d.title||'recompensa';
        // Se agrupa por recompensa, sin importar quién la canjeó:
        // el spam casi siempre viene de gente distinta.
        var who = String(d.username||'Alguien');
        var rkey = 'r:'+title.toLowerCase();

        var hit = bump(rkey, CFG.rwwin, function(e){
          e.users = e.users || [];
          if (e.users.indexOf(who) === -1 && e.users.length < 15) e.users.push(who);
          e.html = '<span class="name">'+esc(title)+'</span> canjeada';
          e.sub  = 'Por: '+esc(e.users.join(', ')) +
                   (e.n > e.users.length ? '…' : '');
        });
        if (hit){ rewardAlert(rkey, title, hit.n); return; }

        push('reward', nm(who)+' canjeó “'+esc(title)+'”',
             d.user_input?esc(d.user_input):null, rkey);
        if (LOG.length && LOG[0].key===rkey) LOG[0].users=[who];
        return;
      }

      case 'StreamHostEvent':
      case 'StreamHostedEvent': {
        var v=Number(d.number_viewers||d.numberViewers||0);
        push('host', nm(d.host_username||d.hostUsername)+' te hosteó'+(v?' con '+plural(v,'viewer','viewers'):''),
             d.optional_message?esc(d.optional_message):null,
             'h:'+(d.host_username||d.hostUsername)+':'+v);
        return;
      }

      case 'StreamerIsLive':
        viewers=null; paintViewers(); pollViewers();
        push('live','<span class="name">Stream en vivo</span>',
             (d.livestream&&d.livestream.session_title)?esc(d.livestream.session_title):null,'live:on');
        return;
      case 'StopStreamBroadcast':
        viewers=0; paintViewers();
        push('live','<span class="name">Stream terminado</span>',null,'live:off');
        return;

      case 'UserBannedEvent': {
        var u=(d.user&&d.user.username)||d.username;
        var by=(d.banned_by&&d.banned_by.username)||'';
        push('mod', nm(u)+(d.expires_at?' fue silenciado':' fue baneado'),
             by?'Por '+esc(by):null, 'b:'+u);
        return;
      }
      case 'UserUnbannedEvent': {
        var u2=(d.user&&d.user.username)||d.username;
        push('mod', nm(u2)+' fue desbaneado', null, 'ub:'+u2);
        return;
      }
      case 'PinnedMessageCreatedEvent': {
        var pm=d.message||{};
        push('mod','<span class="name">Mensaje fijado</span>',null,'pin:'+(pm.id||''),
             pm.content?emotes(pm.content):null);
        return;
      }

      case 'ChatMessageEvent':
      case 'ChatMessageSentEvent': {
        var s=d.sender||{};
        var content=d.content||d.message||'';
        var meta=d.metadata||{};
        var cel=meta.celebration||meta.kicks||meta.gift||meta.kicks_gift||null;

        // Kick manda como "celebration" tanto los Kicks como las resubs
        // que la gente comparte. Hay que distinguirlos o las resubs
        // terminan apareciendo como "mandó Kicks".
        if (d.type==='celebration'||d.type==='kicks'||cel){
          var amt=(cel&&(cel.amount||cel.kicks_amount||cel.quantity||cel.total))||meta.amount||meta.kicks;
          var gn=(cel&&(cel.name||cel.gift_name))||'';
          var celType=String((cel&&(cel.type||cel.celebration_type))||d.type||'').toLowerCase();

          // Resub compartida: ya llegó por su propio evento. Aquí solo
          // aprovechamos para pegarle el mensaje que escribió la persona.
          if (/sub|renew|anniversar|month|milestone/.test(celType)){
            if (content) enrichSub(s.username, emotes(content));
            return;
          }
          // Sin cantidad y sin señas de ser un regalo, no lo damos por Kicks.
          if (!amt && !/kick|gift/.test(celType)) return;

          countKicks(push('kicks', nm(s.username)+(amt?' mandó '+esc(amt)+' Kicks':' mandó Kicks'),
                          gn?esc(gn):null, kicksKey(s.username, amt),
                          content?emotes(content):null), amt);
          return;
        }
        // El chat normal no se guarda: solo se revisa por si es un
        // anuncio de Kicks o de tip hecho por el bot.
        tryKicks(s.username, content, d.id) || tryTip(s.username, content, d.id);
        return;
      }

      case 'MessageDeletedEvent': case 'ChatroomUpdatedEvent': case 'ChatroomClearEvent':
      case 'PollUpdateEvent': case 'PinnedMessageDeletedEvent': case 'LivestreamUpdated':
      case 'UpdatedLiveStreamEvent': case 'TitleChangedEvent':
        return;

      default:
        if (CFG.debug)
          push('sys','[debug] '+esc(short),'<code>'+esc(JSON.stringify(d).slice(0,300))+'</code>');
        return;
    }
  }

  /* ============================================================
     CONEXIÓN PUSHER
     ============================================================ */
  var PUSHER_KEY='32cbd69e4b950bf97679';
  var WS_URL='wss://ws-us2.pusher.com/app/'+PUSHER_KEY+
             '?protocol=7&client=js&version=8.4.0-rc2&flash=false';
  var ws=null, retry=0, pingTimer=null;

  function channels(){
    var c=[];
    if (CFG.chatroomId){
      c.push('chatrooms.'+CFG.chatroomId+'.v2');
      c.push('chatrooms.'+CFG.chatroomId);
      c.push('chatroom_'+CFG.chatroomId);
    }
    if (CFG.channelId){
      c.push('channel.'+CFG.channelId);
      c.push('channel_'+CFG.channelId);
      c.push('predictions-channel-'+CFG.channelId);
    }
    return c;
  }

  function connect(){
    if (!CFG.chatroomId && !CFG.channelId){
      push('sys','Falta configurar el canal.','Agrega <code>?chatroom=ID&amp;channelid=ID</code> a la URL.');
      return;
    }
    try{ ws=new WebSocket(WS_URL); }catch(e){ scheduleReconnect(); return; }

    ws.onopen=function(){ retry=0; };

    ws.onmessage=function(ev){
      var msg; try{ msg=JSON.parse(ev.data); }catch(e){ return; }

      if (msg.event==='pusher:connection_established'){
        $dot.classList.add('on');
        channels().forEach(function(ch){
          ws.send(JSON.stringify({event:'pusher:subscribe',data:{auth:'',channel:ch}}));
        });
        clearInterval(pingTimer);
        pingTimer=setInterval(function(){
          if (ws && ws.readyState===1) ws.send(JSON.stringify({event:'pusher:ping',data:{}}));
        },60000);
        return;
      }
      if (msg.event==='pusher:ping'){ ws.send(JSON.stringify({event:'pusher:pong',data:{}})); return; }
      if (msg.event==='pusher:pong'||msg.event==='pusher_internal:subscription_succeeded') return;
      if (msg.event==='pusher:error'){ if(CFG.debug) console.warn('[kickfeed] pusher error',msg); return; }

      var data=msg.data;
      if (typeof data==='string'){ try{ data=JSON.parse(data); }catch(e){ data={}; } }
      handle(msg.event, data||{}, msg.channel);
    };

    ws.onclose=function(){ $dot.classList.remove('on'); clearInterval(pingTimer); scheduleReconnect(); };
    ws.onerror=function(){ try{ ws.close(); }catch(e){} };
  }

  function scheduleReconnect(){
    retry++;
    setTimeout(connect, Math.min(30000, 1000*Math.pow(1.6, Math.min(retry,10))));
  }

  document.addEventListener('visibilitychange',function(){
    if (!document.hidden){
      pollViewers();
      if (!ws||ws.readyState>1){ retry=0; connect(); }
    }
  });

  connect();

    ['App\\Events\\StreamerIsLive',{livestream:{session_title:'IRL Zapopan 🛵'}}],
    ['App\\Events\\UserBannedEvent',{user:{username:'troll123'},banned_by:{username:'tq_bot_irl'}}],

  window.kickfeed={cfg:CFG,handle:handle,channels:channels,
                   log:function(){return LOG;}, raw:function(){return RAW;}};
