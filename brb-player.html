<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BRB Clips TQ</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap">
<!-- Solo puede hablar con tu servidor, con Kick y con Twitch. Los videos llegan directo de Kick y Twitch. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src 'self' https://kick-feed-mariotq.vercel.app https://kick.com https://*.kick.com https://gql.twitch.tv; media-src 'self' https: blob:; img-src https: data:; frame-src https://clips.twitch.tv; worker-src blob:">
<style>
/* ==================================================================
   BRB · PLAYER PARA OBS (fuente de navegador 1920 × 1080)
   - Dos capas: mientras suena un clip ya se está cargando el siguiente,
     y el cambio es con un fundido corto (imagen y sonido).
   - Al azar sin repetir hasta pasar todos, y vuelve a empezar.
   - Volumen parejo: los clips bajitos suben y los ruidosos bajan.
   - Recuadro con el título, la plataforma, el canal y quién lo sacó.
   - Lo controlas desde el estudio o desde los Atajos del feed
     (siguiente, pausa, silencio, mensaje y playlist): lo ve en ≤ 3 s.
   - Recortes: cada clip puede empezar y terminar donde tú digas.
   - Como tu BRB viejo: sin «clip de» cuando lo sacaste tú, un bot o
     alguien de tu lista, y aviso en pantalla de subs, regalos y Kicks.
   ================================================================== */
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:transparent;color:#fff;
  font-family:"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
/* los videos se apilan solo aquí adentro: el mensaje, el recuadro y los avisos siempre quedan encima */
#stage{position:absolute;inset:0;z-index:0;isolation:isolate}
.layer{position:absolute;inset:0;width:100%;height:100%;border:0;margin:0;background:#000;opacity:0;transition:opacity .45s ease}
.layer.on{opacity:1}

/* el recuadro del clip */
#card{position:absolute;z-index:30;max-width:62%;padding:15px 24px 16px;border-radius:12px;background:rgba(14,14,18,.64);
  box-shadow:0 6px 28px rgba(0,0,0,.28);opacity:0;transform:translateY(10px);transition:opacity .45s ease,transform .45s ease;
  pointer-events:none;text-shadow:0 1px 3px rgba(0,0,0,.55)}
#card.on{opacity:1;transform:none}
#card.bl{left:48px;bottom:48px}#card.br{right:48px;bottom:48px;text-align:right}
#card.tl{left:48px;top:48px}#card.tr{right:48px;top:48px;text-align:right}
#card .t{font-size:36px;font-weight:800;line-height:1.18;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#card .m{margin-top:6px;font-size:23px;line-height:1.3;display:flex;align-items:center;gap:.45em;white-space:nowrap;color:rgba(255,255,255,.88)}
#card.br .m,#card.tr .m{justify-content:flex-end}
#card .m span{overflow:hidden;text-overflow:ellipsis}
#card .tag{flex:none;font-size:15px;font-weight:800;letter-spacing:.09em;padding:4px 11px 3px;border-radius:999px;text-shadow:none}
#card .tag.tw{background:#772ce8;color:#fff}#card .tag.kk{background:#53fc18;color:#0b0e0f}
#card [hidden]{display:none!important}
/* estilo TQ: sin caja, con la letra de tu BRB viejo y una sombra abajo */
#card.s-tq{background:none;box-shadow:none;padding:0;max-width:72%;text-shadow:0 3px 22px rgba(0,0,0,.8),0 1px 3px rgba(0,0,0,.6)}
#card.s-tq.bl,#card.s-tq.tl{left:64px}#card.s-tq.br,#card.s-tq.tr{right:64px}
#card.s-tq.bl,#card.s-tq.br{bottom:58px}#card.s-tq.tl,#card.s-tq.tr{top:58px}
#card.s-tq .t{font-family:"Bebas Neue",Impact,"Arial Narrow",sans-serif;font-weight:400;font-size:86px;line-height:.95;letter-spacing:.015em}
#card.s-tq .m{margin-top:10px;font-size:24px;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.82)}
#card.s-tq .tag{letter-spacing:.12em}
#shade{position:absolute;left:0;right:0;height:46%;z-index:29;pointer-events:none;opacity:0;transition:opacity .5s ease}
#shade.bot{bottom:0;background:linear-gradient(to top,rgba(0,0,0,.66),transparent)}
#shade.top{top:0;background:linear-gradient(to bottom,rgba(0,0,0,.6),transparent)}
#shade.on{opacity:1}
/* estilo mínimo: una cápsula chiquita en un solo renglón */
#card.s-mini{display:flex;align-items:center;gap:14px;padding:10px 22px;border-radius:999px;background:rgba(10,10,14,.62);max-width:70%}
#card.s-mini .t{font-size:27px;font-weight:700;flex:0 1 auto;min-width:0}
#card.s-mini .t{flex:0 1 auto}
#card.s-mini .m{margin:0;font-size:21px;flex:none;max-width:none}
#card.s-mini .ch,#card.s-mini .dot{display:none!important}   /* en un renglón: solo la etiqueta y quién lo sacó */

/* el mensaje de arriba («¡Ahorita regreso!») */
#msg{position:absolute;z-index:31;left:50%;top:44px;max-width:calc(100% - 96px);transform:translateX(-50%);padding:.16em .7em .2em;
  border-radius:22px;background:rgba(10,10,14,.52);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  font-size:62px;font-weight:800;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  text-shadow:0 2px 14px rgba(0,0,0,.55);opacity:0;transition:opacity .5s ease;pointer-events:none}
#msg.on{opacity:1}
#msg.low{top:auto;bottom:44px}
#msg .sig{display:none}
/* letrero de tu BRB viejo: foquitos de señal en rojo, rayita y letra grande */
#msg.sign{top:auto;bottom:60px;background:none;-webkit-backdrop-filter:none;backdrop-filter:none;padding:0;border-radius:0;display:flex;align-items:center;gap:26px;
  font-family:"Bebas Neue",Impact,"Arial Narrow",sans-serif;font-weight:400;font-size:96px;letter-spacing:.06em;line-height:1;text-shadow:0 4px 26px rgba(0,0,0,.7)}
#msg.sign.hi{top:56px;bottom:auto}
#msg.sign .sig{display:block;width:96px;height:78px;flex:none;filter:drop-shadow(0 2px 10px rgba(0,0,0,.6))}
#msg.sign .mt{position:relative;padding-left:26px;border-left:2px solid rgba(255,255,255,.4);overflow:hidden;text-overflow:ellipsis}
#msg .sig path,#msg .sig circle{fill:none;stroke:#e63946;stroke-width:6;stroke-linecap:round;opacity:.15;animation:arc 3.5s infinite}
#msg .sig circle{fill:#e63946;stroke:none}
#msg .sig .a2{animation-delay:.45s}#msg .sig .a3{animation-delay:.9s}
@keyframes arc{0%,100%{opacity:.15}30%,70%{opacity:1}50%{opacity:.5}}
#msg.sign .mt{animation:glitch 5s infinite}
@keyframes glitch{0%,90%,100%{transform:none}91%{transform:translateX(-4px)}92%{transform:translateX(4px)}93%{transform:translateX(-1px)}94%{transform:none}}

/* aviso de sub, regalo o Kicks (como el de tu BRB viejo) */
#ev{position:absolute;z-index:32;top:48px;right:56px;max-width:46%;text-align:right;opacity:0;transform:translateY(-12px);
  transition:opacity .5s ease,transform .5s ease;pointer-events:none;text-shadow:0 2px 12px rgba(0,0,0,.6)}
#ev.left{right:auto;left:56px;text-align:left}
#ev.on{opacity:1;transform:none}
#ev .l{font-size:20px;font-weight:800;letter-spacing:.22em;text-transform:uppercase;color:#53fc18}
#ev.gift .l{color:#ff5a4f}#ev.kicks .l{color:#a970ff}
#ev .n{font-size:58px;font-weight:900;line-height:1.05;letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#ev .s{font-size:22px;font-weight:600;color:rgba(255,255,255,.75);margin-top:4px}
#bar{position:absolute;z-index:29;left:0;right:0;bottom:0;height:5px;background:rgba(255,255,255,.18);opacity:0;transition:opacity .4s}
#bar.on{opacity:1}
#bar i{display:block;height:100%;width:100%;background:rgba(255,255,255,.88);transform:scaleX(0);transform-origin:0 50%}

#tap{position:absolute;z-index:40;left:50%;top:50%;transform:translate(-50%,-50%);padding:16px 28px;border-radius:12px;
  border:1px solid rgba(255,255,255,.5);background:rgba(0,0,0,.72);color:#fff;font:700 24px system-ui,sans-serif;cursor:pointer}
#note{position:absolute;z-index:40;left:24px;bottom:20px;font:600 18px system-ui,sans-serif;color:#cfd3da;
  background:rgba(0,0,0,.6);padding:8px 14px;border-radius:10px;display:none}
#note.on{display:block}
[hidden]{display:none!important}
</style>
</head>
<body>
<div id="stage"></div>
<div id="msg"><svg class="sig" viewBox="0 0 110 90" aria-hidden="true"><circle cx="55" cy="76" r="6"/><path class="a1" d="M38 62 Q55 50 72 62"/><path class="a2" d="M24 48 Q55 28 86 48"/><path class="a3" d="M10 34 Q55 6 100 34"/></svg><span class="mt"></span></div>
<div id="shade"></div>
<div id="card" class="br"><div class="t"></div><div class="m"><span class="tag"></span><span class="ch"></span><span class="dot">·</span><span class="by"></span></div></div>
<div id="bar"><i></i></div>
<div id="ev"><div class="l"></div><div class="n"></div><div class="s"></div></div>
<button id="tap" hidden>▶ Toca para iniciar</button>
<div id="note"></div>
<script>
(function(){
'use strict';
var Q=new URLSearchParams(location.search);
var SAME=/\.vercel\.app$/.test(location.hostname)||location.hostname==='localhost'||location.hostname==='127.0.0.1';
var API=(Q.get('api')||(SAME?location.origin:'https://kick-feed-mariotq.vercel.app')).replace(/\/+$/,'');
var SCR=Q.get('s')||'', PREVIEW=Q.get('preview')==='1', PL_FORCE=Q.get('pl')||'', DEBUG=Q.get('debug')==='1';
var HLS_URL='https://cdn.jsdelivr.net/npm/hls.js@1.5.8/dist/hls.min.js';
var HLS_SRI='sha384-xLhS5rbIdhv65H3GLX+caQgMSiEK/Hkw8Z6HITolgRxvXs0omcbeYD639tkJ2Wu6';   // si el CDN cambia el archivo, el navegador no lo usa
var TW_CLIENT='kimne78kx3ncx6brgo4mv6wki5h1ko';      // el mismo que usa la página de Twitch (y tu offline-escene)
var LOAD_MS=15000, STALL_MS=20000, FADE_MS=450, TICK_MS=3000, RETRY_MS=60000, CARD_OUT=1.2;

var $=function(id){ return document.getElementById(id); };
var stage=$('stage'), card=$('card'), msgEl=$('msg'), bar=$('bar'), barFill=bar.firstChild, tapBtn=$('tap'), note=$('note');

/* ---------------- estado ---------------- */
var man=null;                 // lo que mandó el servidor: {pl, clips, ctl, active}
var set=null, setPreview=null; // ajustes de la playlist (la vista previa del estudio puede mandar otros)
var ctl={seq:-1, paused:false, muted:false, msg:null};
var byKey={}, keys=[], bag=[], passes=0, lastKey='', failed={};
var cur=null, nxt=null, dying=[];
var stopped=false, gone=false, retryT=0, tickT=0, ticking=false, seqSeen=null;
var audio=null, audioBad=false, previewSound=false;
var CFG={hideBy:[], alerts:true}, BOOT_AT=Date.now(), evLast='';

function key(c){ return c.p+':'+c.id; }
// Lo último que falló: se manda al servidor con la pregunta de cada 3 s y sale en el estudio (Control).
var lastErr='';
// Cada intento que falla queda en el registro de OBS; al estudio solo se le avisa si el clip se brincó.
function oops(s, why){
  var c=s && s.clip, t=(c ? (c.p==='kick' ? 'Kick' : 'Twitch')+' «'+String(c.t||c.id).slice(0,40)+'»: ' : '')+why;
  if (s) s.why=t.slice(0,160);
  try{ console.error('[BRB] '+t); }catch(e){}
}
function say(t){ if (!DEBUG && !PREVIEW){ note.classList.remove('on'); return; } note.textContent=t||''; note.classList.toggle('on', !!t); }
function log(){ if (DEBUG) try{ console.log.apply(console, ['[BRB]'].concat([].slice.call(arguments))); }catch(e){} }
function S(){ return setPreview||set||{}; }

/* ---------------- servidor ---------------- */
function getJSON(url, ms){
  var ac=new AbortController(), t=setTimeout(function(){ ac.abort(); }, ms||10000);
  return fetch(url,{cache:'no-store', credentials:'omit', signal:ac.signal})
    .then(function(r){ return r.json().catch(function(){ return {}; }).then(function(j){ j._st=r.status; return j; }); })
    .finally(function(){ clearTimeout(t); });
}
function loadManifest(){
  var u=API+'/api/brb?a=play&s='+encodeURIComponent(SCR)+(PL_FORCE?'&pl='+encodeURIComponent(PL_FORCE):'');
  return getJSON(u).then(function(j){
    if (j._st===404){ shutdown('Este link del BRB ya no sirve. Cópialo otra vez desde el estudio.'); return; }
    if (!j.ok) throw new Error(j.error||'sin respuesta');
    applyManifest(j);
  });
}
function applyManifest(j){
  var first=!man, plChanged=!man || !j.pl || !man.pl || j.pl.id!==man.pl.id;
  man=j; set=(j.pl && j.pl.set) || {};
  if (j.cfg) CFG=j.cfg;
  byKey={}; keys=[];
  (j.clips||[]).forEach(function(c){ var k=key(c); if (!byKey[k]){ byKey[k]=c; keys.push(k); } });
  failed={};
  if (first) { applyCtl(j.ctl||{}, true); }
  paintMsg(); paintCard(); applyAudio();
  if (plChanged){ bag=[]; passes=0; if (nxt){ kill(nxt); nxt=null; } }
  else { bag=bag.filter(function(k){ return byKey[k]; }); }   // la misma playlist: sigue la vuelta con lo nuevo
  if (nxt && !byKey[nxt.key]){ kill(nxt); nxt=null; }
  if (cur && plChanged && !first){ stopped=false; finish(cur, true); }   // otra playlist: se cambia ya
  else if (!cur){ stopped=false; advance(false); }
  else preload();
  say(keys.length ? '' : 'Esta playlist no tiene clips todavía.');
}

/* cada 3 s, solo mientras la escena está al aire (OBS apaga la fuente cuando no se ve) */
function tick(){
  if (PREVIEW || gone || !SCR || ticking || obsHidden) return;   // escena fuera del aire: no gasta llamadas
  ticking=true;
  var c=cur && cur.clip;
  var u=API+'/api/brb?a=tick&s='+encodeURIComponent(SCR)+
    '&c='+encodeURIComponent(c ? key(c) : '')+'&st='+(c ? (ctl.paused ? 'pause' : cur.playing ? 'play' : 'load') : 'idle')+
    '&pl='+encodeURIComponent(man && man.pl ? man.pl.id : '')+'&t='+encodeURIComponent(c ? String(c.t||'').slice(0,100) : '')+
    (lastErr ? '&e='+encodeURIComponent(lastErr) : '');
  getJSON(u, 8000).then(function(j){
    if (j._st===404) return shutdown('Este link del BRB ya no sirve.');
    if (!j.ok) return;
    var active=man && man.active, rev=man && man.pl ? man.pl.rev : -1;
    var needReload=!man || j.pl!==active || (j.pl===(man.pl&&man.pl.id) && j.rev!==rev);
    applyCtl(j.ctl||{}, false);
    if (j.cfg && JSON.stringify(j.cfg)!==JSON.stringify(CFG)){ CFG=j.cfg; paintCard(); }
    if (j.ev) showEv(j.ev);
    if (needReload) return loadManifest();
  }).catch(function(){ /* sin internet un ratito: el clip sigue */ }).finally(function(){ ticking=false; });
}

/* ---------------- controles ---------------- */
function applyCtl(c, first){
  var seqNew=typeof c.seq==='number' ? c.seq : 0;
  var cmdNew=seqSeen!==null && seqNew!==seqSeen ? c.cmd : '';
  seqSeen=seqNew;
  var wasPaused=ctl.paused;
  ctl={seq:seqNew, paused:!!c.paused, muted:!!c.muted, msg:(c.msg===undefined ? null : c.msg)};
  paintMsg(); applyAudio();
  if (ctl.paused!==wasPaused){ if (ctl.paused) pauseCur(); else resumeCur(); }
  if (first) return;
  if (cmdNew==='next') skip();
  else if (cmdNew==='reset'){ bag=[]; passes=0; failed={}; writePlayed({}); skip(); }
}
function skip(){ if (cur){ var c=cur; c.finishing=true; finish(c, true); } else advance(false); }
function pauseCur(){ if (cur && cur.kind==='video' && cur.el){ try{ cur.el.pause(); }catch(e){} } paintBar(); }
function resumeCur(){ if (cur && cur.kind==='video' && cur.el && !document.hidden){ cur.lastMove=Date.now(); cur.el.play().catch(function(){}); } }

/* ---------------- la fila: al azar sin repetir ---------------- */
function shuffle(a){ for (var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)), t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
// Lo que ya pasó en esta vuelta se guarda en OBS: si ocultas la escena y la vuelves a mostrar,
// sigue con los que faltan en vez de empezar de cero (y repetir los mismos).
function playedKey(){ return 'brb.played.'+SCR+'.'+((man && man.pl && man.pl.id)||''); }
function readPlayed(){ if (PREVIEW) return {}; try{ var a=JSON.parse(localStorage.getItem(playedKey())||'[]'), o={}; (Array.isArray(a)?a:[]).forEach(function(k){ o[k]=1; }); return o; }catch(e){ return {}; } }
function writePlayed(o){ if (PREVIEW) return; try{ var a=Object.keys(o).filter(function(k){ return byKey[k]; }); if (a.length) localStorage.setItem(playedKey(), JSON.stringify(a)); else localStorage.removeItem(playedKey()); }catch(e){} }
function markPlayed(k){ if (PREVIEW || !k) return; var o=readPlayed(); if (!o[k]){ o[k]=1; writePlayed(o); } }
function takeKey(avoid){
  var ok=keys.filter(function(k){ return !failed[k]; });
  if (!ok.length) return '';
  for (var round=0; round<2; round++){
    while (bag.length){ var k=bag.shift(); if (byKey[k] && !failed[k] && k!==avoid) return k; }
    if (passes>0 && S().loop===false) return '';
    passes++;
    var seen=readPlayed(), rest=ok.filter(function(k){ return !seen[k]; });
    if (!rest.length || rest.length===ok.length){ writePlayed({}); rest=ok; }   // vuelta nueva
    bag=S().shuffle===false ? rest.slice() : shuffle(rest.slice());
    if (bag.length>1 && bag[0]===lastKey){ var j=1+Math.floor(Math.random()*(bag.length-1)), t=bag[0]; bag[0]=bag[j]; bag[j]=t; }
  }
  return ok.length===1 ? ok[0] : '';
}

/* ---------------- de dónde sale cada clip ---------------- */
// Kick: el .m3u8 que se guardó al importar → si falla, se le pregunta a Kick otra vez.
// Twitch: igual que tu BRB viejo (offline-escene): el .mp4 directo en 1080, sin pedirle
// permisos extra a su servidor de videos (ahí fallaba). Si Twitch no le contesta al player,
// tu servidor le pregunta y lo manda directo al mismo video (como lo hace IRLhosting).
// El reproductor de Twitch ya no se usa: si un clip no carga, se brinca al siguiente.
function sourcesOf(c){
  if (c.p==='kick'){
    var L=[]; if (c.u) L.push(function(){ return Promise.resolve({type:'hls', url:c.u}); });
    L.push(function(){ return getJSON('https://kick.com/api/v2/clips/'+encodeURIComponent(c.id), 9000).then(function(j){
      var u=j && j.clip && (j.clip.clip_url || j.clip.video_url);
      if (!u) { var e=new Error('el clip ya no existe en Kick'); e.dead=true; throw e; }
      if (u!==c.u){ c.u=u; c.fixed=1; }               // la próxima vez va directo al link bueno
      return {type:'hls', url:u}; }); });
    return L;
  }
  return [
    function(){ return twLinks(c).then(function(u){ return {type:'mp4', url:u, cors:false, how:'twitch'}; }); },
    function(){ if (!SCR) throw new Error('sin pantalla');
      return Promise.resolve({type:'mp4', url:API+'/api/brb?a=tw&s='+encodeURIComponent(SCR)+'&id='+encodeURIComponent(c.id), cors:false, how:'servidor'}); }
  ];
}
// El link firmado de Twitch dura horas: se pide una vez y se reusa un rato.
function twLinks(c){
  if (c._tw && Date.now()-c._tw.at<10*60000) return Promise.resolve(c._tw.url);
  return twitchMp4(c).then(function(url){ c._tw={at:Date.now(), url:url}; return url; });
}
function twitchMp4(c){
  var ac=new AbortController(), t=setTimeout(function(){ ac.abort(); }, 9000);
  return fetch('https://gql.twitch.tv/gql',{method:'POST', signal:ac.signal, credentials:'omit',
    headers:{'Client-Id':TW_CLIENT,'Content-Type':'application/json'},
    body:JSON.stringify({operationName:'VideoAccessToken_Clip', variables:{slug:c.id},
      query:'query VideoAccessToken_Clip($slug: ID!){clip(slug:$slug){playbackAccessToken(params:{platform:"web",playerBackend:"mediaplayer",playerType:"site"}){signature value} videoQualities{quality sourceURL}}}'})})
  .then(function(r){ if (!r.ok) throw new Error('Twitch no le contestó al player ('+r.status+')'); return r.json(); })
  .then(function(j){
    var clip=j && j.data && j.data.clip;
    if (j && j.data && clip===null){ var e=new Error('el clip ya no existe en Twitch'); e.dead=true; throw e; }
    var q=(clip && clip.videoQualities)||[], tok=clip && clip.playbackAccessToken;
    if (!q.length || !tok) throw new Error('Twitch no dio el video');
    q=q.slice().sort(function(a,b){ return (parseInt(b.quality,10)||0)-(parseInt(a.quality,10)||0); });
    var best=q.filter(function(x){ return (parseInt(x.quality,10)||0)<=1080; })[0]||q[0];   // la más alta: 1080
    var u=new URL(best.sourceURL); u.searchParams.set('sig', tok.signature); u.searchParams.set('token', tok.value);
    return u.toString();
  }).finally(function(){ clearTimeout(t); });
}

/* ---------------- hls.js (solo se carga si hay clips de Kick) ---------------- */
var hlsP=null;
function loadHls(){
  if (window.Hls) return Promise.resolve(window.Hls);
  if (!hlsP) hlsP=new Promise(function(ok, bad){
    var s=document.createElement('script'); s.src=HLS_URL; s.integrity=HLS_SRI; s.crossOrigin='anonymous'; s.async=true;
    s.onload=function(){ window.Hls ? ok(window.Hls) : bad(new Error('hls.js')); };
    s.onerror=function(){ hlsP=null; s.remove(); bad(new Error('hls.js')); };
    document.head.appendChild(s);
  });
  return hlsP;
}

/* ---------------- volumen parejo (Web Audio) ---------------- */
function ensureAudio(){
  if (audio || audioBad) return audio;
  try{
    var C=window.AudioContext||window.webkitAudioContext; if (!C) throw 0;
    var ctx=new C(), comp=ctx.createDynamicsCompressor(), makeup=ctx.createGain(), master=ctx.createGain();
    comp.threshold.value=-22; comp.knee.value=18; comp.ratio.value=5; comp.attack.value=0.004; comp.release.value=0.3;
    makeup.gain.value=Math.pow(10, 3.5/20);
    comp.connect(makeup); makeup.connect(master); master.connect(ctx.destination);
    audio={ctx:ctx, comp:comp, master:master};
  }catch(e){ audioBad=true; audio=null; }
  return audio;
}
function wantMuted(){ return ctl.muted || S().sound===false || (PREVIEW && !previewSound); }
function applyAudio(){
  var vol=Math.max(0, Math.min(100, S().volume==null ? 100 : S().volume))/100;
  if (audio){ try{ audio.master.gain.value=wantMuted() ? 0 : vol; }catch(e){} }
  [cur, nxt].forEach(function(s){
    if (!s || s.kind!=='video' || !s.el || s.fading) return;
    if (s.node){ s.el.muted=false; s.el.volume=1; }
    else if (s===cur){ s.el.muted=wantMuted(); s.el.volume=vol; }
  });
  if (cur && cur.el) cur.el.style.objectFit=S().fit==='cover' ? 'cover' : 'contain';
}
// Cada video pasa por el compresor solo si el audio ya está corriendo (en OBS siempre).
function routeAudio(s){
  if (s.routed) return; s.routed=true;
  if (S().normalize===false || s.kind!=='video' || !s.cors) return;   // sin permiso, el volumen se maneja con el propio video
  var a=ensureAudio(); if (!a) return;
  if (a.ctx.state!=='running'){ try{ a.ctx.resume(); }catch(e){} return; }   // sin audio corriendo no se arriesga: suena normal
  try{
    var src=a.ctx.createMediaElementSource(s.el), g=a.ctx.createGain();
    g.gain.value=1; src.connect(g); g.connect(a.comp); s.node={src:src, g:g};
  }catch(e){ s.node=null; }
}

/* ---------------- un clip ---------------- */
function newSlot(k){ return {key:k, clip:byKey[k], i:-1, el:null, hls:null, kind:'', ready:false, dead:false, timers:{}, playing:false, lastT:0, lastMove:0}; }
function later(s, name, fn, ms){ clearTimeout(s.timers[name]); s.timers[name]=setTimeout(function(){ if (!s.dead) fn(); }, ms); }
function clearTimers(s){ for (var n in s.timers) clearTimeout(s.timers[n]); s.timers={}; }
function dropMedia(s){
  if (s.hls){ try{ s.hls.destroy(); }catch(e){} s.hls=null; }
  if (s.node){ try{ s.node.src.disconnect(); s.node.g.disconnect(); }catch(e){} s.node=null; }
  var el=s.el; s.el=null; s.ready=false; s.playing=false; s.routed=false; s.shown=false;
  if (el){ if (el.tagName==='VIDEO'){ try{ el.pause(); el.removeAttribute('src'); el.load(); }catch(e){} } el.remove(); }
}
function kill(s){ if (!s || s.dead) return; s.dead=true; clearTimers(s); dropMedia(s); }
function prepare(s){
  if (s.dead) return;
  clearTimers(s); dropMedia(s);
  var list=sourcesOf(s.clip), i=++s.i;
  if (i>=list.length){ return failSlot(s); }
  var token=i;
  later(s, 'load', function(){ oops(s, 'tardó más de '+(LOAD_MS/1000)+' s en cargar'); prepare(s); }, LOAD_MS);
  list[i]().then(function(src){
    if (s.dead || s.i!==token) return;
    if (src.type==='embed'){ s.kind='embed'; s.embed=src.clip; s.ready=true; clearTimeout(s.timers.load); onReady(s); return; }
    s.kind='video'; s.cors=src.cors!==false; s.src=token;
    var v=document.createElement('video');
    v.className='layer'; v.playsInline=true; v.preload='auto'; v.muted=true; if (s.cors) v.crossOrigin='anonymous';
    v.style.objectFit=S().fit==='cover' ? 'cover' : 'contain';
    var tA=trimOf(s.clip).a;                         // recorte: brinca al inicio que elegiste
    v.addEventListener('loadedmetadata', function(){ if (s.el===v && tA>0 && !s.hls && (v.currentTime||0)<tA-0.3){ try{ v.currentTime=tA; }catch(e){} } });
    // Listo para tocar en cuanto trae su primer cuadro. No se espera a «canplay»: con el video
    // en pausa (precargando mientras suena otro) el navegador de OBS a veces deja de bajarlo.
    var mark=function(){ if (s.el!==v || s.ready) return; if (tA>0 && !s.hls && v.seeking) return; s.ready=true; clearTimeout(s.timers.load); clearTimeout(s.timers.meta); onReady(s); };
    v.addEventListener('loadeddata', mark); v.addEventListener('canplay', mark);
    v.addEventListener('loadedmetadata', function(){ if (s.el===v) later(s, 'meta', mark, 1200); });
    v.addEventListener('seeked', function(){ if (s.el===v && v.readyState>=2) mark(); });
    v.addEventListener('error', function(){ if (s.el===v){ oops(s, 'el video no cargó ('+(src.how||src.type)+', error '+(v.error ? v.error.code : '?')+')'); prepare(s); } });
    v.addEventListener('ended', function(){ if (s.el===v && s===cur) finish(s, false); });
    v.addEventListener('timeupdate', function(){ if (s.el===v && s===cur) progress(s); });
    s.el=v; stage.appendChild(v);
    if (src.type==='mp4'){ v.src=src.url; v.load(); }
    else return loadHls().then(function(Hls){
      if (s.dead || s.el!==v) return;
      if (Hls.isSupported()){
        var h=new Hls({enableWorker:false, maxBufferLength:30, maxMaxBufferLength:60, backBufferLength:10, startPosition:trimOf(s.clip).a||-1});
        s.hls=h;
        h.on(Hls.Events.ERROR, function(_e, d){ if (d && d.fatal && s.el===v){ oops(s, 'Kick: '+(d.details||'error')); prepare(s); } });
        h.on(Hls.Events.MANIFEST_PARSED, function(){     // siempre la más alta (hasta 1080)
          var lv=h.levels||[], best=-1; lv.forEach(function(l, i){ var hh=l.height||0; if (hh<=1080 && (best<0 || hh>(lv[best].height||0))) best=i; });
          if (lv.length>1 && best>=0){ try{ h.currentLevel=best; }catch(e){} }
        });
        h.loadSource(src.url); h.attachMedia(v);
      } else if (v.canPlayType('application/vnd.apple.mpegurl')){ v.src=src.url; v.load(); }
      else prepare(s);
    });
  }).catch(function(e){
    if (s.dead || s.i!==token) return;
    oops(s, e && e.message || 'no se pudo');
    if (e && e.dead) return failSlot(s);
    prepare(s);                                       // la siguiente forma de cargarlo
  });
}
function failSlot(s){
  failed[s.key]=1; if (s.why) lastErr=s.why; var wasCur=s===cur, wasNxt=s===nxt;
  kill(s);
  if (wasNxt){ nxt=null; preload(); }
  if (wasCur){ cur=null; advance(false); }
}
function onReady(s){
  if (s===cur && !s.playing) start(s);
}
function preload(){
  if (stopped || nxt || !cur || !cur.playing || !keys.length) return;
  var k=takeKey(cur.key); if (!k) return;
  nxt=newSlot(k); prepare(nxt);
}

/* ---------------- tocar y cambiar ---------------- */
var layerZ=1;
function start(s){
  if (s.dead || s!==cur || s.playing) return;
  if (document.hidden && !PREVIEW) return;
  if (s.kind==='embed') return startEmbed(s);
  var v=s.el;
  routeAudio(s); applyAudio();
  if (s.node){ v.muted=false; v.volume=1; } else { v.muted=wantMuted(); }
  s.lastMove=Date.now(); s.lastT=v.currentTime||0;
  if (ctl.paused){ show(s); return; }                    // en pausa: se ve el primer cuadro
  var p; try{ p=v.play(); }catch(e){ p=Promise.reject(e); }
  Promise.resolve(p).then(function(){ if (s.dead || s!==cur) return; tapBtn.hidden=true; show(s); }, function(e){
    if (s.dead || s!==cur) return;
    if (e && e.name==='NotAllowedError'){
      if (!v.muted){ v.muted=true; v.play().then(function(){ if (s===cur && !s.dead) show(s); }, function(){}); if (!PREVIEW) tapBtn.hidden=false; }
      else if (!PREVIEW) tapBtn.hidden=false;
    } else if (!e || e.name!=='AbortError') prepare(s);
  });
}
// Twitch pide el nombre de cada página donde va su reproductor (también la del estudio,
// cuando es la vista previa), y solo arranca solo si se ve: por eso sale encima de una vez.
function twParents(){
  var h=[location.hostname];
  try{ var a=location.ancestorOrigins; if (a) for (var i=0;i<a.length;i++){ var x=new URL(a[i]).hostname; if (x && h.indexOf(x)<0) h.push(x); } }catch(e){}
  try{ if (window.parent!==window && document.referrer){ var r=new URL(document.referrer).hostname; if (r && h.indexOf(r)<0) h.push(r); } }catch(e){}
  return h.map(function(x){ return '&parent='+encodeURIComponent(x); }).join('');
}
function startEmbed(s){
  var f=document.createElement('iframe');
  f.className='layer on'; f.style.zIndex=String(++layerZ); f.setAttribute('allow','autoplay; encrypted-media'); f.setAttribute('scrolling','no'); f.title='Clip de Twitch';
  f.src='https://clips.twitch.tv/embed?clip='+encodeURIComponent(s.embed)+twParents()+
        '&autoplay=true&muted='+(wantMuted()?'true':'false');
  s.el=f; stage.appendChild(f);
  var shown=false, go=function(){ if (!shown && !s.dead && s===cur){ shown=true; show(s); } };
  f.addEventListener('load', function(){ later(s, 'emb', go, 900); });
  later(s, 'show', go, 3500);
  var secs=lengthOf(s.clip, NaN, true);                 // el reproductor de Twitch no se puede recortar
  later(s, 'end', function(){ if (s===cur) finish(s, false); }, (secs+1.5)*1000);
  later(s, 'cardout', function(){ if (s===cur) cardOff(); }, Math.max(0, secs-CARD_OUT)*1000);
}
function show(s){
  if (s.shown){ return; }
  s.shown=true; s.playing=true; s.t0=Date.now();
  s.el.style.zIndex=String(++layerZ); s.el.classList.add('on');
  lastKey=s.key; markPlayed(s.key);
  cardOn(s.clip); paintBar();
  if (s.kind==='video'){ s.lastMove=Date.now(); watch(s); }
  // el anterior se va con fundido (imagen y sonido)
  dying.forEach(function(d){ fadeOut(d); }); dying=[];
  preload();
  if (!PREVIEW) setTimeout(tick, 200);                  // avisa luego luego qué está sonando
}
// Recorte del clip: desde a hasta b (b = 0: hasta el final).
function trimOf(c){ var a=Number(c && c.a)||0, b=Number(c && c.b)||0; if (a<0) a=0; if (b && b<a+1) b=0; return {a:a, b:b}; }
// Cuántos segundos se ve el clip (con su recorte y el máximo de la playlist).
function lengthOf(c, media, noTrim){
  var d=isFinite(media) && media>0 ? media : (c.d||0), tr=noTrim ? {a:0, b:0} : trimOf(c);
  if (!(d>0)) d=tr.b || S().maxSec || 60;
  var len=(tr.b ? Math.min(tr.b, d) : d)-tr.a;
  if (!(len>0)) len=d;
  return S().maxSec>0 ? Math.min(len, S().maxSec) : len;
}
function progress(s){
  var v=s.el, t=v.currentTime||0, a=trimOf(s.clip).a;
  if (t!==s.lastT){ s.lastT=t; s.lastMove=Date.now(); }
  // si el video todavía no dejaba brincar al inicio del recorte, se intenta otra vez
  if (a>0 && t<a-0.5 && Date.now()-(s.seekAt||0)>800 && v.seekable && v.seekable.length && v.seekable.end(v.seekable.length-1)>=a){ s.seekAt=Date.now(); try{ v.currentTime=a; }catch(e){} }
  var len=lengthOf(s.clip, v.duration), el=t-a;
  if (el>=len-CARD_OUT) cardOff();
  if (el>=len-0.05 && el>0) finish(s, S().maxSec>0 && len>=S().maxSec);
  paintBar();
}
// Si se congela 20 s, se prueba la otra fuente o se salta.
function watch(s){
  later(s, 'watch', function(){
    if (s!==cur || s.dead) return;
    if (s.kind==='video' && !ctl.paused && !document.hidden && !obsHidden && Date.now()-s.lastMove>STALL_MS){ log('se congeló', s.key); s.shown=false; s.playing=false; prepare(s); return; }
    watch(s);
  }, 1000);
}
function finish(s, cut){
  if (s!==cur || s.finished) return;
  s.finished=true; clearTimeout(s.timers.watch); clearTimeout(s.timers.end);
  cardOff();
  dying.push(s);
  cur=null;
  advance(cut);
}
function fadeOut(s){
  if (!s || s.dead) return;
  s.fading=true;
  if (s.el) s.el.classList.remove('on');
  var g=s.node ? s.node.g.gain : null, v=s.el && s.el.tagName==='VIDEO' ? s.el : null;
  var from=g ? g.value : v ? v.volume : 0, n=6, k=0;
  (function step(){
    if (s.dead) return;
    k++; var x=Math.max(0, from*(1-k/n));
    try{ if (g) g.value=x; else if (v) v.volume=x; }catch(e){}
    if (k<n) setTimeout(step, FADE_MS/n); else kill(s);
  })();
}
function advance(now){
  clearTimeout(retryT);
  if (stopped || gone) return;
  var s=nxt; nxt=null;
  if (!s){ var k=takeKey(lastKey); if (k) s=newSlot(k); }
  if (!s){
    // nada que tocar: si todos fallaron, se reintenta en un minuto
    dying.forEach(function(d){ fadeOut(d); }); dying=[];
    paintBar();
    var allBad=keys.length && keys.every(function(k){ return failed[k]; });
    if (allBad){ say('No se pudo reproducir ningún clip. Reintento en 1 minuto.'); retryT=setTimeout(function(){ failed={}; bag=[]; passes=0; advance(false); }, RETRY_MS); }
    else if (keys.length && S().loop===false){ stopped=true; say('Terminó la playlist.'); }
    return;
  }
  cur=s;
  if (s.i<0) prepare(s);
  else if (s.ready) start(s);

}

/* ---------------- recuadro, mensaje y barra ---------------- */
var cardC=null, cardT=0, shade=$('shade');
// «Solo al empezar»: el recuadro sale 8 segundos, como el de tu BRB viejo
function cardOn(c){ cardC=c; card.classList.add('on'); paintCard(); clearTimeout(cardT); if (((S().card)||{}).time==='start') cardT=setTimeout(cardOff, 8000); }
function cardOff(){ clearTimeout(cardT); card.classList.remove('on'); paintShade(); }
function paintShade(){
  var o=(S().card)||{}, on=card.classList.contains('on') && o.style==='tq';
  shade.className=(String(o.pos||'bottom-right').indexOf('top')===0 ? 'top' : 'bot')+(on ? ' on' : '');
}
function paintCard(){
  var o=(S().card)||{}, c=cardC;
  card.className=({'bottom-left':'bl','bottom-right':'br','top-left':'tl','top-right':'tr'})[o.pos||'bottom-right']+' s-'+(o.style||'classic')+(card.classList.contains('on') ? ' on' : '');
  paintShade();
  if (!c) return;
  var t=card.querySelector('.t'), tag=card.querySelector('.tag'), ch=card.querySelector('.ch'), dot=card.querySelector('.dot'), by=card.querySelector('.by');
  var showT=o.title!==false && c.t, showTag=o.platform!==false, showCh=o.channel!==false && (c.chd||c.ch), showBy=o.creator!==false && c.cr && !hiddenBy(c);
  t.textContent=showT ? c.t : ''; t.hidden=!showT;
  tag.textContent=c.p==='kick' ? 'KICK' : 'TWITCH'; tag.className='tag '+(c.p==='kick' ? 'kk' : 'tw'); tag.hidden=!showTag;
  ch.textContent=showCh ? (c.chd||c.ch) : ''; ch.hidden=!showCh;
  by.textContent=showBy ? (o.by==='es' ? 'clip de ' : 'clipped by ')+c.cr : ''; by.hidden=!showBy;
  dot.hidden=!(showCh && showBy);
  card.querySelector('.m').hidden=!(showTag || showCh || showBy);
  if (!showT && !(showTag || showCh || showBy)){ card.classList.remove('on'); paintShade(); }
}
// Sin «clip de» cuando lo sacaste tú (el dueño del canal), un bot o alguien de tu lista.
function hiddenBy(c){
  var n=String(c.cr||'').toLowerCase().replace(/^@/, '');
  if (!n) return true;
  if (n===String(c.ch||'').toLowerCase()) return true;
  return (CFG.hideBy||[]).indexOf(n)>=0;
}
// Aviso de sub, regalo o Kicks: solo lo que llega con la escena al aire.
var evEl=$('ev'), evT=0;
function showEv(e){
  if (PREVIEW || !e || !e.id || e.id===evLast) return;
  evLast=e.id;
  if ((e.at||0)<BOOT_AT-5000) return;                 // pasó antes de que se mostrara la escena
  var name=e.anon ? 'Anónimo' : (e.u||'Alguien'), n=Number(e.n)||0;
  var lbl={sub:'¡Nuevo sub!', resub:'¡Gracias por renovar!', gift:'¡Subs de regalo!', kicks:'¡Gracias por los Kicks!'}[e.k]||'¡Gracias!';
  var sub=e.k==='resub' ? (n>1 ? n+' meses seguidos 🔥' : '') : e.k==='gift' ? 'regaló '+n+(n===1 ? ' sub' : ' subs') : e.k==='kicks' ? n+' Kicks' : '¡Gracias por el sub!';
  evEl.querySelector('.l').textContent=lbl; evEl.querySelector('.n').textContent=name; evEl.querySelector('.s').textContent=sub;
  var pos=(S().card||{}).pos||'bottom-right';
  evEl.className=(e.k==='gift' ? 'gift' : e.k==='kicks' ? 'kicks' : '')+(pos==='top-right' ? ' left' : '');
  void evEl.offsetWidth; evEl.classList.add('on');
  clearTimeout(evT); evT=setTimeout(function(){ evEl.classList.remove('on'); }, 7000);
}
// Cápsula: arriba (abajo si el recuadro está arriba). Letrero: abajo (arriba si el recuadro está abajo).
var msgT=msgEl.querySelector('.mt');
function paintMsg(){
  var m=ctl.msg!=null ? ctl.msg : (S().msg||'');
  var pos=(S().card||{}).pos||'bottom-right', top=pos.indexOf('top-')===0, sign=S().msgStyle==='sign';
  if (m && msgT.textContent!==m) msgT.textContent=m;
  msgEl.className=(sign ? 'sign'+(top ? '' : ' hi') : (top ? 'low' : ''))+(m ? ' on' : '');
}
var barT=0;
function paintBar(){
  clearTimeout(barT);
  var s=cur, on=!!(S().progress && s && s.shown && s.el);
  bar.className=on ? 'on' : '';
  if (!on) return;
  var total=s.kind==='embed' ? lengthOf(s.clip, NaN, true) : lengthOf(s.clip, s.el.duration);
  var el=s.kind==='embed' ? (Date.now()-s.t0)/1000 : (s.el.currentTime||0)-trimOf(s.clip).a;
  barFill.style.transform='scaleX('+Math.max(0, Math.min(1, total>0 ? el/total : 0)).toFixed(4)+')';
  if (s.kind==='embed') barT=setTimeout(paintBar, 250);
}

/* ---------------- arranque, pestaña oculta, apagado ---------------- */
function shutdown(why){
  gone=true; clearInterval(tickT); clearTimeout(retryT);
  [cur, nxt].concat(dying).forEach(kill); cur=nxt=null; dying=[];
  cardOff(); msgEl.className=''; bar.className='';
  say(why||'');
  if (audio){ try{ audio.ctx.close(); }catch(e){} audio=null; }
}
tapBtn.addEventListener('click', function(){
  tapBtn.hidden=true;
  if (audio && audio.ctx.state!=='running') try{ audio.ctx.resume(); }catch(e){}
  if (cur && cur.el && cur.kind==='video'){ cur.el.muted=wantMuted() && !cur.node; cur.el.play().then(function(){ show(cur); }, function(){}); }
});
function onHide(){ pauseCur(); }
function onShow(){ if (cur){ if (!cur.playing && cur.ready) start(cur); else if (!ctl.paused) resumeCur(); } }
document.addEventListener('visibilitychange', function(){
  if (gone || PREVIEW || obsHidden) return;
  if (document.hidden) onHide(); else onShow();
});
// En OBS: aunque la fuente no tenga «Apagar cuando no sea visible», cuando la escena sale del
// aire el player se pausa y deja de preguntarle al servidor; al volver sigue donde se quedó.
var obsHidden=false;
window.addEventListener('obsSourceVisibleChanged', function(ev){
  if (gone || PREVIEW) return;
  var vis=!!(ev && ev.detail && ev.detail.visible);
  if (vis===!obsHidden) return;
  obsHidden=!vis;
  if (obsHidden) onHide(); else { onShow(); tick(); }
});
window.addEventListener('pagehide', function(){ shutdown(''); });
window.addEventListener('online', function(){ if (!gone && !man) boot(); });

// Vista previa del estudio: le manda los ajustes sin guardar y si quieres oír el sonido.
if (PREVIEW) window.addEventListener('message', function(ev){
  if (ev.source!==window.parent) return;
  var d=ev.data||{};
  if (d.type==='brb-set' && d.set && typeof d.set==='object'){ setPreview=d.set; paintMsg(); paintCard(); applyAudio(); paintBar(); }
  if (d.type==='brb-sound'){ previewSound=!!d.on; if (previewSound){ var a=ensureAudio(); if (a && a.ctx.state!=='running') try{ a.ctx.resume(); }catch(e){} } applyAudio(); }
  if (d.type==='brb-next') skip();
  if (d.type==='brb-reload') loadManifest().catch(function(){});
});

// ?debug=1: para revisar desde la consola qué está pasando
if (DEBUG) window.BRB_DEBUG=function(){ return {cur:cur&&cur.key, kind:cur&&cur.kind, playing:!!(cur&&cur.playing), paused:ctl.paused, muted:wantMuted(),
  gain:audio ? audio.master.gain.value : null, ctx:audio ? audio.ctx.state : null, routed:!!(cur&&cur.node), keys:keys.slice(), failed:Object.keys(failed),
  pl:man&&man.pl&&man.pl.id, rev:man&&man.pl&&man.pl.rev, msg:msgEl.textContent, msgOn:msgEl.classList.contains('on'), card:card.className, played:Object.keys(readPlayed()), bag:bag.slice(),
  t:cur&&cur.el&&cur.el.tagName==='VIDEO' ? cur.el.currentTime : null, cors:!!(cur&&cur.cors), src:cur ? cur.src : null, err:lastErr,
  vsrc:cur&&cur.el&&cur.el.tagName==='VIDEO' ? cur.el.currentSrc : '', obsHidden:obsHidden, by:card.querySelector('.by').hidden ? '' : card.querySelector('.by').textContent, cfg:CFG, ev:evEl.className+'|'+evEl.textContent}; };

function boot(){
  if (!SCR){ say('Falta el id de la pantalla (s=…). Copia el link desde el estudio.'); return; }
  loadManifest().catch(function(e){ say('No pude cargar la playlist ('+(e&&e.message||'sin conexión')+'). Reintento…'); setTimeout(boot, 15000); });
}
boot();
if (!PREVIEW){ tickT=setInterval(tick, TICK_MS); }
else try{ window.parent.postMessage({type:'brb-ready'}, '*'); }catch(e){}
})();
</script>
