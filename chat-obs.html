<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chat para OBS · MarioTQ</title>
<style>
/* ==================================================================
   💬 CHAT PARA OBS (v1) · Kick + Twitch juntos, fondo transparente.
   Fuente de navegador en tu OBS; SÍ sale al aire.
   Lee el chat directo de Kick (Pusher) y de Twitch (IRC anónimo), como
   la guardia: tu servidor solo se toca 1 vez al abrir (la llave de Kick
   y las insignias de Twitch, con caché de 1 hora). Nada por mensaje.
   Si Kick o Twitch borran un mensaje (o banean a alguien), desaparece.

   Opciones en el link (todas son opcionales):
     ?tam=20        tamaño de letra en px
     ?fade=30       segundos para que un mensaje se desvanezca (0 = nunca)
     ?max=10        cuántos mensajes como máximo en pantalla
     ?arriba=1      los nuevos salen arriba (por defecto, abajo)
     ?insignias=0   sin insignias          ?colores=0  nombres en blanco
     ?kt=1          marquita K/T           ?grande=1   emotes grandes si es puro emote
     ?bots=1        enseña a los bots      ?cmd=1      enseña los !comandos
     ?ocultar=a,b   esconde a esas personas (además de los bots)
     ?pf=kick | ?pf=tw   solo una plataforma
     ?extras=0      sin emotes de 7TV, BetterTTV y FFZ
     ?fondo=0.35    franja oscura detrás de cada mensaje (0 a 1)
     ?anim=0        sin animación al entrar
     ?prueba=1      mensajes de ejemplo para acomodarlo en OBS
   ================================================================== */
:root{--tam:20px;--fondo:0}
html,body{margin:0;height:100%;overflow:hidden;background:transparent}
body{font-family:"Segoe UI","Inter",Roboto,system-ui,sans-serif;font-size:var(--tam);color:#fff;line-height:1.35}
#chat{position:fixed;left:0;right:0;bottom:0;display:flex;flex-direction:column;padding:6px 8px;box-sizing:border-box}
body.arriba #chat{bottom:auto;top:0}
.m{padding:2px 6px;margin:1px 0;border-radius:6px;word-wrap:break-word;overflow-wrap:anywhere;
   background:rgba(0,0,0,var(--fondo));
   text-shadow:0 0 2px #000,0 0 3px #000,1px 1px 2px #000;
   transition:opacity .6s ease, transform .6s ease}
.m.in{animation:entra .25s ease-out}
body.sinanim .m.in{animation:none}
@keyframes entra{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
body.arriba .m.in{animation-name:entraA}
@keyframes entraA{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
.m.out{opacity:0}
.bd img{height:1em;width:auto;vertical-align:-.12em;margin-right:.22em}
.n{font-weight:700}
.t{color:#fff}
.me .t{font-style:italic}
img.em{height:1.6em;width:auto;vertical-align:-.45em;margin:-.15em .05em}
.big img.em{height:3.2em;vertical-align:middle;margin:.1em .1em}
.kt{display:inline-block;font-size:.62em;font-weight:800;line-height:1;padding:.22em .32em;border-radius:.3em;margin-right:.35em;vertical-align:.2em;text-shadow:none;color:#0b0d10}
.kt.k{background:#53fc18}.kt.w{background:#a970ff;color:#fff}
</style>

var ORDER=['broadcaster','staff','moderator','vip','og','founder','verified','partner','subscriber','sub_gifter'];
var SUBB=[], TWB=null;              // insignias de sub de tu canal de Kick · mapa de insignias de Twitch
function img(src){ return '<img src="'+esc(src)+'" alt="" onerror="this.remove()">'; }
function subBadge(n){ var best=null; SUBB.forEach(function(b){ if (b.months<=n && (!best || b.months>best.months)) best=b; }); return best; }
function kickBadges(list){
  if (!OPT.badges || !list || !list.length) return '';
  var h=list.slice().sort(function(a,b){ var x=ORDER.indexOf(String(a.type).toLowerCase()), y=ORDER.indexOf(String(b.type).toLowerCase()); return (x<0?99:x)-(y<0?99:y); })
    .map(function(b){
      var t=String(b && b.type || '').toLowerCase(), n=Number(b && b.count)||0;
      if (t==='subscriber'){ var sb=subBadge(n||1); return img(sb ? sb.src : KBADGE.subscriber); }
      if (t==='sub_gifter') return img(KBADGE[n>=200 ? 'g200' : n>=100 ? 'g100' : n>=50 ? 'g50' : n>=25 ? 'g25' : 'g0']);
      return KBADGE[t] ? img(KBADGE[t]) : '';
    }).join('');
  return h ? '<span class="bd">'+h+'</span>' : '';
}
function twBadges(tag){
  if (!OPT.badges || !TWB || !tag) return '';
  var h=tag.split(',').filter(Boolean).map(function(x){ var u=TWB[x] || (/^subscriber\//.test(x) && TWB['subscriber/0']); return u ? img(u) : ''; }).join('');
  return h ? '<span class="bd">'+h+'</span>' : '';
}

var TPL={s7g:[], btg:[], s7c:[], btc:[]}, TPT={s7:[], bc:[], fc:[], fg:[]}, TPM=Object.create(null), TPMT=Object.create(null);
function tpGet(u){ return fetch(u, {cache:'no-store'}).then(function(r){ if (!r.ok) throw new Error('HTTP '+r.status); return r.json(); }); }
function tp7(list){ return (list||[]).map(function(e){ var h=e && e.data && e.data.host; if (!e || !e.name || !h || !h.url) return null;
    return {n:e.name, u:(h.url.indexOf('//')===0?'https:':'')+h.url+'/2x.webp'}; }).filter(Boolean); }
function tpB(list){ return (list||[]).map(function(e){ return e && e.code && e.id ? {n:e.code, u:'https://cdn.betterttv.net/emote/'+e.id+'/2x'} : null; }).filter(Boolean); }
function tpF(list){ return (list||[]).map(function(e){ var im=e && e.images; return e && e.code && im && (im['2x']||im['1x']) ? {n:e.code, u:im['2x']||im['1x']} : null; }).filter(Boolean); }
function tpBuild(){
  TPM=Object.create(null); [TPL.btg, TPL.btc, TPL.s7g, TPL.s7c].forEach(function(l){ l.forEach(function(e){ TPM[e.n]=e.u; }); });        // lo de tu canal gana
  TPMT=Object.create(null); [TPL.btg, TPT.fg, TPT.fc, TPT.bc, TPL.s7g, TPT.s7].forEach(function(l){ (l||[]).forEach(function(e){ TPMT[e.n]=e.u; }); });
}
function settle(jobs){ return Promise.all(jobs.map(function(p){ return p.catch(function(){}); })).then(tpBuild); }
var tpG=false, tpK='', tpT='';
function tpGlobal(){ if (tpG || !OPT.extras) return []; tpG=true;
  return [tpGet('https://7tv.io/v3/emote-sets/global').then(function(j){ TPL.s7g=tp7(j && j.emotes); }),
          tpGet('https://api.betterttv.net/3/cached/emotes/global').then(function(j){ TPL.btg=tpB(j); }),
          tpGet('https://api.betterttv.net/3/cached/frankerfacez/emotes/global').then(function(f){ TPT.fg=tpF(f); })]; }
function tpLoadKick(uid){
  uid=String(uid||''); if (!OPT.extras || !uid || tpK===uid) return; tpK=uid;
  settle(tpGlobal().concat([tpGet('https://7tv.io/v3/users/kick/'+encodeURIComponent(uid)).then(function(j){
    TPL.s7c=tp7(j && j.emote_set && j.emote_set.emotes);
    var tw=((j && j.user && j.user.connections) || []).filter(function(c){ return /twitch/i.test(c.platform||''); })[0];
    if (tw && tw.id) return tpGet('https://api.betterttv.net/3/cached/users/twitch/'+encodeURIComponent(tw.id)).then(function(b){
      TPL.btc=tpB(((b && b.channelEmotes) || []).concat((b && b.sharedEmotes) || [])); });
  })]));
}
function tpLoadTw(rid){
  rid=String(rid||''); if (!OPT.extras || !/^\d+$/.test(rid) || tpT===rid) return; tpT=rid;
  settle(tpGlobal().concat([
    tpGet('https://7tv.io/v3/users/twitch/'+rid).then(function(j){ TPT.s7=tp7(j && j.emote_set && j.emote_set.emotes); }),
    tpGet('https://api.betterttv.net/3/cached/users/twitch/'+rid).then(function(b){ TPT.bc=tpB(((b && b.channelEmotes) || []).concat((b && b.sharedEmotes) || [])); }),
    tpGet('https://api.betterttv.net/3/cached/frankerfacez/users/twitch/'+rid).then(function(f){ TPT.fc=tpF(f); })]));
}
// si un emote de 7TV no carga (o llega vacío), se prueba en PNG y GIF antes de dejar su nombre
window.kfEmFb=function(im){
  var u=im.getAttribute('src')||'', n=Number(im.getAttribute('data-fb')||0);
  if (/cdn\.7tv\.app\//.test(u) && n<2){ im.setAttribute('data-fb', String(n+1)); im.src=u.replace(/\/(\dx)\.(webp|avif|png|gif)$/, '/$1.'+(n===0 ? 'png' : 'gif')); return; }
  im.replaceWith(document.createTextNode(im.alt));
};
function emImg(src, name, tp){ return '<img class="em" src="'+esc(src)+'" alt="'+esc(name)+'"'+(tp ? ' onload="if(!this.naturalWidth)kfEmFb(this)" onerror="kfEmFb(this)"' : ' onerror="this.replaceWith(document.createTextNode(this.alt))"')+'>'; }
// el texto suelto: palabra por palabra, por si es un emote de 7TV/BTTV/FFZ
function words(t, M, st){
  if (!t) return '';
  return t.split(/(\s+)/).map(function(w){ var u=M[w]; if (u){ st.em++; return emImg(u, w, true); } if (/\S/.test(w)) st.tx++; return esc(w); }).join('');
}
// Kick: «hola [emote:123:nombre]»
function kickHtml(s, st){
  s=String(s||''); var out='', re=/\[emote:(\d+):([^\]]*)\]/g, last=0, x;
  while ((x=re.exec(s))){ out+=words(s.slice(last, x.index), TPM, st); st.em++; out+=emImg('https://files.kick.com/emotes/'+x[1]+'/fullsize', x[2]); last=re.lastIndex; }
  return out+words(s.slice(last), TPM, st);
}
// Twitch: la etiqueta «emotes» del IRC (posiciones en caracteres)
function twHtml(text, em, st){
  var cp=Array.from(text), spots=[];
  if (em) em.split('/').forEach(function(g){ var p=g.split(':'); if (p.length<2) return; p[1].split(',').forEach(function(r){ var a=r.split('-'); spots.push({id:p[0], s:Number(a[0]), e:Number(a[1])}); }); });
  spots.sort(function(a,b){ return a.s-b.s; });
  var out='', i=0;
  spots.forEach(function(sp){ if (!(sp.s>=i && sp.e>=sp.s && sp.e<cp.length)) return;
    if (sp.s>i) out+=words(cp.slice(i, sp.s).join(''), TPMT, st);
    st.em++; out+=emImg('https://static-cdn.jtvnw.net/emoticons/v2/'+sp.id+'/default/dark/2.0', cp.slice(sp.s, sp.e+1).join('')); i=sp.e+1; });
  if (i<cp.length) out+=words(cp.slice(i).join(''), TPMT, st);
  return out;
}

/* ---------------- pintar ---------------- */
function hidden(user, text){
  if (HIDE.has(String(user||'').toLowerCase())) return true;
  if (!OPT.cmd && /^\s*!/.test(text||'')) return true;
  return false;
}
function add(o){   // o: {pf, id, user, name, color, badges(html), html, st, me}
  var d=document.createElement('div');
  d.className='m in'+(o.me ? ' me' : '')+(OPT.big && o.st.em>0 && o.st.em<=3 && o.st.tx===0 ? ' big' : '');
  d.setAttribute('data-pf', o.pf); d.setAttribute('data-id', o.id); d.setAttribute('data-u', String(o.user||'').toLowerCase());
  var col=OPT.colors ? readable(o.color || defColor(o.user)) : '#ffffff';
  d.innerHTML=(OPT.kt ? '<span class="kt '+(o.pf==='tw'?'w':'k')+'">'+(o.pf==='tw'?'T':'K')+'</span>' : '')+o.badges+
    '<span class="n" style="color:'+col+'">'+esc(o.name)+'</span>'+(o.me ? ' ' : '<span class="t">: </span>')+
    '<span class="t"'+(o.me ? ' style="color:'+col+'"' : '')+'>'+o.html+'</span>';
  if (OPT.arriba) BOX.insertBefore(d, BOX.firstChild); else BOX.appendChild(d);
  setTimeout(function(){ d.classList.remove('in'); }, 400);
  var all=BOX.children;
  while (all.length>OPT.max) BOX.removeChild(OPT.arriba ? BOX.lastChild : BOX.firstChild);
  if (OPT.fade>0) d._t=setTimeout(function(){ d.classList.add('out'); setTimeout(function(){ if (d.parentNode) d.parentNode.removeChild(d); }, 650); }, OPT.fade*1000);
}
function drop(sel){ Array.prototype.forEach.call(BOX.querySelectorAll(sel), function(d){ clearTimeout(d._t); d.parentNode.removeChild(d); }); }
function cssq(s){ return String(s).replace(/["\\]/g, '\\$&'); }
function dropMsg(pf, id){ if (id) drop('.m[data-pf="'+pf+'"][data-id="'+cssq(id)+'"]'); }
function dropUser(pf, u){ if (u) drop('.m[data-pf="'+pf+'"][data-u="'+cssq(String(u).toLowerCase())+'"]'); }
function dropAll(pf){ drop('.m[data-pf="'+pf+'"]'); }

/* ---------------- lo que dice tu servidor (1 vez al abrir, con caché) ---------------- */
var CFG=null;
try{ CFG=JSON.parse(LSget('chatobs.cfg')||'null'); }catch(e){ CFG=null; }
function loadCfg(fresh){
  return fetch(API+'/api/chatobs'+(fresh ? '?n='+Math.floor(Date.now()/300000) : ''), {credentials:'omit'})
    .then(function(r){ return r.json(); }).then(function(j){
      if (!j || !j.ok) throw new Error('sin datos');
      CFG=j; LSset('chatobs.cfg', JSON.stringify(j));
      if (j.twb && typeof j.twb==='object') TWB=j.twb;
      return j;
    });
}
if (CFG && CFG.twb) TWB=CFG.twb;

/* ---------------- Kick (Pusher, igual que la guardia) ---------------- */
var K={ws:null, last:0, retry:0}, SEEN=new Set();
function seen(id){ if (SEEN.has(id)) return true; SEEN.add(id); if (SEEN.size>2000) SEEN.delete(SEEN.values().next().value); return false; }
function pdata(m){ var d=m.data; if (typeof d==='string'){ try{ d=JSON.parse(d); }catch(e){ return null; } } return d; }
function kickEvent(m){
  var ev=String(m.event||'');
  if (/MessageDeletedEvent$/.test(ev)){ var dd=pdata(m); dropMsg('kick', dd && ((dd.message && dd.message.id) || dd.id)); return; }
  if (/UserBannedEvent$/.test(ev)){ var bd=pdata(m), u=bd && bd.user; dropUser('kick', u && (u.username || u.slug)); return; }
  if (/ChatroomClearEvent$/.test(ev)){ dropAll('kick'); return; }
  if (!/ChatMessageEvent$/.test(ev)) return;
  var x=pdata(m);
  if (!x || !x.id || !x.sender || seen(String(x.id))) return;
  var s=x.sender||{}, idt=s.identity||{}, user=String(s.username||s.slug||''), text=String(x.content||'').slice(0,600);
  if (!user || hidden(user, text) || hidden(s.slug, text)) return;
  var st={em:0, tx:0};
  add({pf:'kick', id:String(x.id), user:user, name:user, color:idt.color||'', badges:kickBadges(idt.badges), html:kickHtml(text, st), st:st});
}
function kickConnect(){
  if (!WANT_K) return;
  var k=CFG && CFG.kick;
  if (!k || !k.key || !k.chatroom){ return setTimeout(function(){ loadCfg(true).then(kickConnect, function(){ setTimeout(kickConnect, 60000); }); }, 30000); }
  var ws; try{ ws=new WebSocket('wss://ws-'+(k.cluster||'us2')+'.pusher.com/app/'+k.key+'?protocol=7&client=js&version=8.4.0&flash=false'); }catch(e){ return kickRetry(); }
  K.ws=ws; K.last=Date.now();
  ws.onmessage=function(ev){
    var m; try{ m=JSON.parse(ev.data); }catch(e){ return; }
    K.last=Date.now();
    if (m.event==='pusher:connection_established'){
      ['chatrooms.'+k.chatroom+'.v2', 'chatrooms.'+k.chatroom].forEach(function(c){ ws.send(JSON.stringify({event:'pusher:subscribe', data:{auth:'', channel:c}})); });
      return; }
    if (m.event==='pusher_internal:subscription_succeeded'){ K.retry=0; return; }
    if (m.event==='pusher:ping'){ ws.send(JSON.stringify({event:'pusher:pong', data:{}})); return; }
    try{ kickEvent(m); }catch(e){}
  };
  ws.onclose=function(ev){ if (K.ws!==ws) return; K.ws=null; kickRetry(ev && ev.code); };
  ws.onerror=function(){ try{ ws.close(); }catch(e){} };
}
function kickRetry(code){
  K.retry++;
  var ms=Math.min(60000, 2000*Math.pow(2, Math.min(5, K.retry-1)));
  if (code>=4000 && code<4100){ ms=60000; loadCfg(true).catch(function(){}); }     // la llave cambió: se pide la nueva
  setTimeout(kickConnect, ms);
}
setInterval(function(){                                // si Kick no contesta en 75 s, se reconecta
  var ws=K.ws; if (!ws || ws.readyState!==1) return;
  try{ ws.send(JSON.stringify({event:'pusher:ping', data:{}})); }catch(e){}
  if (Date.now()-K.last>75000){ try{ ws.close(); }catch(e){} }
}, 30000);
// las insignias de sub de tu canal y tus emotes de 7TV de Kick (directo de Kick, 1 vez)
function kickChannel(){
  if (!WANT_K) return;
  var slug=(CFG && CFG.kick && CFG.kick.slug) || 'mariotq';
  fetch('https://kick.com/api/v2/channels/'+encodeURIComponent(slug), {cache:'no-store', credentials:'omit'})
    .then(function(r){ return r.ok ? r.json() : null; }).then(function(j){
      if (!j) return;
      if (j.user_id) tpLoadKick(j.user_id);
      if (Array.isArray(j.subscriber_badges)) SUBB=j.subscriber_badges.map(function(b){ var im=b.badge_image||{}; return {months:Number(b.months)||0, src:im.src||im.url||''}; }).filter(function(b){ return b.src; });
    }).catch(function(){});
}

/* ---------------- Twitch (IRC sin cuenta: solo lee) ---------------- */
var T={ws:null, retry:0, pong:0};
function tagVal(v){ return String(v||'').replace(/\\(.)/g, function(_, c){ return c==='s'?' ':c===':'?';':c==='r'?'\r':c==='n'?'\n':c; }); }
function twLine(line){
  if (!line) return;
  if (line.indexOf('PING')===0){ if (T.ws) T.ws.send('PONG'+line.slice(4)); return; }
  var tags={}, rest=line;
  if (rest[0]==='@'){ var sp=rest.indexOf(' '); rest.slice(1, sp).split(';').forEach(function(kv){ var i=kv.indexOf('='); tags[kv.slice(0,i)]=tagVal(kv.slice(i+1)); }); rest=rest.slice(sp+1); }
  var m=rest.match(/^:(\S+?)(?:!\S+)? (\S+)((?: [^:\s]\S*)*)(?: :([\s\S]*))?$/); if (!m) return;
  var cmd=m[2];
  if (cmd==='PONG'){ T.pong=Date.now(); return; }
  if (cmd==='ROOMSTATE'){ T.retry=0; if (tags['room-id']) tpLoadTw(tags['room-id']); return; }
  if (cmd==='RECONNECT'){ try{ T.ws.close(); }catch(e){} return; }
  if (cmd==='CLEARMSG'){ dropMsg('tw', tags['target-msg-id']); return; }
  if (cmd==='CLEARCHAT'){ if (m[4]) dropUser('tw', m[4].trim()); else dropAll('tw'); return; }
  if (cmd!=='PRIVMSG') return;
  var nick=m[1], text=(m[4]||'').slice(0,900), me=false;
  var act=text.match(/^\u0001ACTION ([\s\S]*)\u0001$/); if (act){ text=act[1]; me=true; }
  if (!tags.id || hidden(nick, text)) return;
  if (tags['room-id']) tpLoadTw(tags['room-id']);
  var st={em:0, tx:0};
  add({pf:'tw', id:tags.id, user:nick, name:tags['display-name']||nick, color:tags.color||'', badges:twBadges(tags.badges), html:twHtml(text, tags.emotes, st), st:st, me:me});
}
function twConnect(){
  if (!WANT_T) return;
  var login=String((CFG && CFG.tw && CFG.tw.login) || 'mariotq').toLowerCase().replace(/[^a-z0-9_]/g,'');
  var ws; try{ ws=new WebSocket('wss://irc-ws.chat.twitch.tv:443'); }catch(e){ return twRetry(); }
  T.ws=ws; T.pong=Date.now();
  ws.onopen=function(){ ws.send('CAP REQ :twitch.tv/tags twitch.tv/commands'); ws.send('PASS SCHMOOPIIE'); ws.send('NICK justinfan'+Math.floor(10000+Math.random()*80000)); ws.send('JOIN #'+login); };
  ws.onmessage=function(ev){ String(ev.data||'').split('\r\n').forEach(function(l){ try{ twLine(l); }catch(e){} }); };
  ws.onclose=function(){ if (T.ws!==ws) return; T.ws=null; twRetry(); };
  ws.onerror=function(){ try{ ws.close(); }catch(e){} };
}
function twRetry(){ T.retry++; setTimeout(twConnect, Math.min(60000, 2000*Math.pow(2, Math.min(5, T.retry-1)))); }
setInterval(function(){                                // si Twitch no contesta el PING en 15 s, se reconecta
  var ws=T.ws; if (!ws || ws.readyState!==1) return;
  var sent=Date.now(); try{ ws.send('PING :chatobs'); }catch(e){}
  setTimeout(function(){ if (T.ws===ws && T.pong<sent){ try{ ws.close(); }catch(e){} } }, 15000);
}, 60000);

    function(){ kickEvent({event:'App\\Events\\ChatMessageEvent', data:JSON.stringify({id:'d'+(++i), content:'¿a dónde vamos hoy?', sender:{username:'viewer_kick', identity:{color:'#FF7F50', badges:[]}}})}); },
    function(){ twLine('@badges=;color=;display-name=OtroViewer;emotes=;id=t'+(++i)+' :otroviewer!o@o.tmi.twitch.tv PRIVMSG #mariotq :se ve muy bien el stream'); }

/* ---------------- arrancar ---------------- */
var started=false;
function start(){ if (started) return; started=true; kickConnect(); twConnect(); kickChannel(); if (OPT.extras) settle(tpGlobal()); }
if (OPT.test) demo();
loadCfg(false).then(start, function(){ if (CFG) start(); else setTimeout(function(){ loadCfg(true).then(start, start); }, 15000); });
