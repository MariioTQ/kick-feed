<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sub Goal</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@700;800;900&display=swap" rel="stylesheet">
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: transparent;
    overflow: hidden;
  }

  /* ---- estilo «texto» (el de siempre) ---- */
  #goal {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    opacity: 1;
    transition: opacity 0.8s ease;
  }

  #txt {
    font-family: "Segoe UI", Roboto, Arial, sans-serif;
    font-size: 50px;
    font-weight: 800;
    color: #ffffff;
    text-shadow:
      -2px -2px 0 #000, 2px -2px 0 #000,
      -2px  2px 0 #000, 2px  2px 0 #000,
       0    3px 6px rgba(0,0,0,.55);
    white-space: nowrap;
  }

  /* ---- v75: estilos «anillo» y «barra» (?estilo=anillo o ?estilo=barra) ---- */
  :root { --ac: #53fc18; --ac2: #b6ff8c; --glow: rgba(83,252,24,.55); }
  body.tw { --ac: #9146ff; --ac2: #c9a8ff; --glow: rgba(145,70,255,.6); }
  .vis { display: none; font-family: "Inter", "Segoe UI", Roboto, Arial, sans-serif; color: #fff; }
  body.anillo #txt, body.barra #txt { display: none; }
  body.anillo #ring, body.barra #bar { display: flex; }

  #ring { flex-direction: column; align-items: center; justify-content: center; gap: 2.4vmin; }
  #ring .rw { position: relative; width: 78vmin; height: 78vmin; max-width: 92vw; max-height: 74vh; aspect-ratio: 1; }
  #ring svg { width: 100%; height: 100%; transform: rotate(-90deg); overflow: visible; }
  #ring .tr { fill: rgba(10,12,16,.72); stroke: rgba(255,255,255,.10); stroke-width: 12; }
  #ring .pg { fill: none; stroke: url(#gr); stroke-width: 12; stroke-linecap: round; transition: stroke-dashoffset 1.1s cubic-bezier(.2,.8,.2,1);
              filter: drop-shadow(0 0 6px var(--glow)); }
  #ring .in { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .6vmin; }
  #ring .in svg { transform: none; }
  #ring .cr { width: 13vmin; height: 13vmin; color: #ffd23f; filter: drop-shadow(0 2px 4px rgba(0,0,0,.6)); }
  #ring .nm { font-weight: 900; font-size: 15vmin; line-height: 1; letter-spacing: -.02em; text-shadow: 0 3px 10px rgba(0,0,0,.7); font-variant-numeric: tabular-nums; }
  #ring .nm small { font-size: .45em; font-weight: 700; color: rgba(255,255,255,.72); letter-spacing: 0; }
  #ring .pc { font-weight: 800; font-size: 5.4vmin; color: var(--ac2); text-shadow: 0 2px 6px rgba(0,0,0,.7); }
  #ring .tt { font-weight: 800; font-size: 6vmin; padding: 1.2vmin 3.6vmin; border-radius: 99px; background: rgba(10,12,16,.72);
              border: 1px solid rgba(255,255,255,.12); text-shadow: 0 2px 6px rgba(0,0,0,.6); white-space: nowrap; }

  #bar { position: relative; align-items: center; gap: 3.2vh; width: 100%; height: 100%; padding: 0 3vh; box-sizing: border-box; }
  #bar .ico { flex: 0 0 auto; width: 46vh; height: 46vh; max-width: 18vw; max-height: 18vw; border-radius: 26%; display: grid; place-items: center;
              background: var(--ac); background-image: linear-gradient(150deg, rgba(255,255,255,.3), rgba(255,255,255,0) 55%, rgba(0,0,0,.18));
              box-shadow: 0 1vh 3vh -1vh var(--glow), inset 0 1px 0 rgba(255,255,255,.3); color: #0e0f13; }
  body.tw #bar .ico { color: #fff; }
  #bar .ico svg { width: 58%; height: 58%; }
  #bar .bx { flex: 1 1 auto; min-width: 0; background: rgba(10,12,16,.74); border: 1px solid rgba(255,255,255,.10); border-radius: 3vh;
             padding: 3.2vh 4vh 3.6vh; }
  #bar .hd { display: flex; align-items: baseline; gap: 2vh; font-weight: 800; font-size: 14vh; text-shadow: 0 2px 6px rgba(0,0,0,.6); }
  #bar .hd .tt { flex: 1 1 auto; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #bar .hd .nm { font-weight: 900; font-size: 17vh; font-variant-numeric: tabular-nums; }
  #bar .hd .nm small { font-size: .62em; color: rgba(255,255,255,.7); font-weight: 700; }
  #bar .tk { margin-top: 2.4vh; height: 11vh; border-radius: 99px; background: rgba(255,255,255,.10); overflow: hidden; }
  #bar .fl { height: 100%; width: 0; border-radius: 99px; background: linear-gradient(90deg, var(--ac), var(--ac2));
             box-shadow: 0 0 2vh var(--glow); transition: width 1.1s cubic-bezier(.2,.8,.2,1); }

  /* v76: cuando aparece (al prender tu stream o cada rato) entra con un brinquito para llamar la atención */
  #goal.enter { animation: enter .9s cubic-bezier(.2,1.3,.4,1); }
  @keyframes enter { 0% { transform: scale(.6) translateY(6vh); filter: blur(6px); } 60% { filter: blur(0); } 100% { transform: none; } }
  #goal.enter .bk-card, #goal.enter .rw, #goal.enter .bx { animation: flash 1.6s ease-out .3s; }
  @keyframes flash { 0% { box-shadow: 0 0 0 0 var(--glow); } 40% { box-shadow: 0 0 6vh 1vh var(--glow); } 100% { box-shadow: 0 0 0 0 transparent; } }

  /* ---- v76: estilo «bloques» (el de Claude): una cuadrita por sub que se va prendiendo ---- */
  body.bloques #txt { display: none; }
  body.bloques #blk { display: flex; }
  #blk { width: 100%; height: 100%; align-items: center; justify-content: center; padding: 3vh 2.5vw; box-sizing: border-box; }
  .bk-card { position: relative; width: 100%; max-height: 100%; box-sizing: border-box; padding: 5vh 3.2vw 6vh; border-radius: 6vh; overflow: hidden;
             background: linear-gradient(160deg, rgba(22,25,33,.92), rgba(10,12,16,.88)); border: 1px solid rgba(255,255,255,.10);
             box-shadow: 0 2vh 6vh rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.08); }
  .bk-card::before { content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 2px;
             background: linear-gradient(120deg, var(--ac), transparent 40%, transparent 60%, var(--ac2));
             -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; opacity: .8; }
  .bk-top { display: flex; align-items: center; gap: 2vw; }
  .bk-pf { flex: 0 0 auto; width: 15vh; height: 15vh; border-radius: 4vh; display: grid; place-items: center; background: var(--ac); color: #0e0f13;
           font: 900 10vh/1 "Inter", "Segoe UI", Arial, sans-serif; box-shadow: 0 1vh 3vh -1vh var(--glow); }
  body.tw .bk-pf { color: #fff; }
  .bk-tt { flex: 1 1 auto; min-width: 0; font: 800 9.5vh/1.1 "Inter", "Segoe UI", Arial, sans-serif; letter-spacing: .14em; text-transform: uppercase;
           color: rgba(255,255,255,.82); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bk-n { flex: 0 0 auto; font: 900 24vh/.9 "Bebas Neue", "Inter", Impact, sans-serif; letter-spacing: .01em; color: #fff; font-variant-numeric: tabular-nums;
          text-shadow: 0 0 3vh var(--glow); }
  .bk-n small { font-size: .5em; color: rgba(255,255,255,.55); margin-left: .12em; }
  .bk-row { display: flex; gap: 1vw; margin-top: 4vh; height: 13vh; }
  .bk-row i { flex: 1 1 0; min-width: 0; border-radius: 2.4vh; background: rgba(255,255,255,.10); position: relative; overflow: hidden; transition: background .5s, box-shadow .5s; }
  .bk-row i.on { background: linear-gradient(180deg, var(--ac2), var(--ac)); box-shadow: 0 0 2.4vh var(--glow); }
  .bk-row i.on::after { content: ""; position: absolute; inset: 0; background: linear-gradient(100deg, transparent 30%, rgba(255,255,255,.55) 50%, transparent 70%);
                        transform: translateX(-120%); animation: shine 5s ease-in-out infinite; animation-delay: calc(var(--k) * 70ms); }
  .bk-row i.nw { animation: lit .9s cubic-bezier(.2,1.6,.4,1); }
  @keyframes lit { 0% { transform: scaleY(.3); filter: brightness(2.5); } 100% { transform: none; filter: none; } }
  @keyframes shine { 0%, 70% { transform: translateX(-120%); } 100% { transform: translateX(120%); } }
  .bk-left { flex: 0 0 auto; font: 800 8vh/1 "Inter", "Segoe UI", Arial, sans-serif; color: var(--ac2); padding: 1.6vh 2.4vh; border-radius: 99px;
             background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.10); white-space: nowrap; }
  body.done .bk-left { color: #0e0f13; background: var(--ac); }

  .pop { animation: pop .6s ease; }
  @keyframes pop { 30% { transform: scale(1.12); } }
  .plus { position: absolute; left: 50%; top: 18%; transform: translateX(-50%); font: 900 9vmin/1 "Inter", "Segoe UI", sans-serif; color: var(--ac2);
          text-shadow: 0 2px 8px rgba(0,0,0,.7); animation: up 1.4s ease-out forwards; pointer-events: none; }
  @keyframes up { from { opacity: 0; transform: translate(-50%, 4vmin); } 20% { opacity: 1; } to { opacity: 0; transform: translate(-50%, -10vmin); } }
  body.done #ring .pg, body.done #bar .fl { filter: drop-shadow(0 0 14px var(--glow)) brightness(1.15); }
</style>
</head>
<body>

<div id="goal">
  <span id="txt">Sub Goal: 0/10</span>
  <div id="ring" class="vis">
    <div class="rw">
      <svg viewBox="0 0 200 200" aria-hidden="true">
        <defs><linearGradient id="gr" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--ac2)"/><stop offset="1" style="stop-color:var(--ac)"/></linearGradient></defs>
        <circle class="tr" cx="100" cy="100" r="86"/>
        <circle class="pg" id="rp" cx="100" cy="100" r="86" stroke-dasharray="540.35" stroke-dashoffset="540.35"/>
      </svg>
      <div class="in">
        <svg class="cr" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="m2.5 6.5 4 9.5h11l4-9.5-5.5 4.8L12 4.5l-4 6.8z"/><rect x="6" y="17.6" width="12" height="2.4" rx="1.2"/></svg>
        <div class="nm" id="rn">0 <small>/ 10</small></div>
        <div class="pc" id="rc">0%</div>
      </div>
    </div>
    <div class="tt" id="rt">Meta de subs</div>
  </div>
  <div id="blk" class="vis">
    <div class="bk-card">
      <div class="bk-top"><span class="bk-pf" id="kp">K</span><span class="bk-tt" id="kt">Meta de subs</span><span class="bk-n" id="kn">0<small>/10</small></span></div>
      <div class="bk-row" id="kr"></div>
      <div class="bk-top" style="margin-top:3vh"><span class="bk-tt" id="ks" style="font-size:7.5vh;letter-spacing:.06em;text-transform:none;color:rgba(255,255,255,.6)">¡Gracias por cada sub!</span><span class="bk-left" id="kl">faltan 10</span></div>
    </div>
  </div>
  <div id="bar" class="vis">
    <div class="ico"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="m2.5 6.5 4 9.5h11l4-9.5-5.5 4.8L12 4.5l-4 6.8z"/><rect x="6" y="17.6" width="12" height="2.4" rx="1.2"/></svg></div>
    <div class="bx">
      <div class="hd"><span class="tt" id="bt">Meta de subs</span><span class="nm" id="bn">0 <small>/ 10</small></span></div>
      <div class="tk"><div class="fl" id="bf"></div></div>
    </div>
  </div>
</div>

<script>
// ===================== CONFIGURACION =====================
// La meta se puede cambiar sin tocar el archivo, agregando ?meta=15 a la URL.
var API = "https://kick-feed-mariotq.vercel.app/api/events?since=9999999999999&tot=1";
var Q = new URLSearchParams(location.search);
var META = parseInt(Q.get("meta"), 10) || 10;
// v74: ?pf=tw = la meta de Twitch (cada plataforma con su meta y su letrero). Sin pf: Kick, como siempre.
var PF = Q.get("pf") === "tw" ? "tw" : "kick";
var PLANTILLA = "Sub Goal: {actual}/{meta}";
// v75: ?estilo=anillo (círculo con corona) o ?estilo=barra (tarjeta con barra). Sin estilo: el texto de siempre.
//      ?titulo=Meta%20del%20día   ?color=ff5f2e (sin #)   ?ocultar=0 (no se esconde al llegar a la meta)
var ESTILO = /^(anillo|barra|bloques)$/.test(Q.get("estilo") || "") ? Q.get("estilo") : "texto";
// v76: aparece y se va por ratos (?aparece=20&descansa=60, en segundos; ?ciclo=0 = siempre a la vista)
//      y solo cuando estás en vivo en SU plataforma (al prender, se reinicia y entra). ?siempre=1 = también sin stream.
function intQ(k, def, lo, hi) { var v = parseInt(Q.get(k), 10); return isNaN(v) ? def : Math.max(lo, Math.min(hi, v)); }
var CICLO = Q.get("ciclo") !== "0";
var VISIBLE = intQ("aparece", 20, 5, 600);
var DESCANSO = intQ("descansa", 60, 5, 1800);
var SIEMPRE = Q.get("siempre") === "1";
var TITULO = (Q.get("titulo") || "Meta de subs").slice(0, 40);
var COLOR = /^[0-9a-f]{6}$/i.test(Q.get("color") || "") ? "#" + Q.get("color") : "";
var SEGUNDOS_ANTES_DE_OCULTAR = Q.get("ocultar") != null && !isNaN(parseInt(Q.get("ocultar"), 10)) ? parseInt(Q.get("ocultar"), 10) : 6;
var CADA_SEGUNDOS = 5;          // en vivo
var CADA_SEGUNDOS_APAGADO = 30; // con el stream apagado (para no gastar el plan gratis)
// =========================================================

var caja = document.getElementById("goal");
var texto = document.getElementById("txt");
document.body.classList.add(ESTILO);
if (PF === "tw") document.body.classList.add("tw");
if (COLOR) { document.documentElement.style.setProperty("--ac", COLOR); document.documentElement.style.setProperty("--ac2", COLOR); document.documentElement.style.setProperty("--glow", COLOR + "88"); }
document.getElementById("rt").textContent = TITULO;
document.getElementById("bt").textContent = TITULO;
document.getElementById("kt").textContent = TITULO;
document.getElementById("kp").innerHTML = PF === "tw"
  ? '<svg viewBox="0 0 24 24" width="62%" height="62%" fill="currentColor" aria-hidden="true"><path d="M4.3 2 3 5.4v13.8h4.7V22h2.7l2.7-2.8h3.8l5.1-5.1V2zm16 11.2-2.9 3h-4.8l-2.6 2.6v-2.6H6V3.8h14.3zm-3-6.1v5.2h-1.8V7.1zm-4.8 0v5.2h-1.8V7.1z"/></svg>'
  : "K";

var subs = 0;
var litAntes = 999;          // los bloques que ya estaban prendidos no hacen la animación al cargar
var antes = null;
var desglose = null;
var completado = false;
var temporizador = null;

function pintar() {
  texto.textContent = PLANTILLA.replace("{actual}", subs).replace("{meta}", META);
  if (ESTILO === "texto") return;
  var pc = Math.max(0, Math.min(1, subs / META));
  var num = subs + " <small>/ " + META + "</small>";
  if (ESTILO === "anillo") {
    document.getElementById("rn").innerHTML = num;
    document.getElementById("rc").textContent = subs >= META ? "¡Meta cumplida!" : Math.round(pc * 100) + "%";
    document.getElementById("rp").setAttribute("stroke-dashoffset", String(540.35 * (1 - pc)));
  } else if (ESTILO === "bloques") {
    document.getElementById("kn").innerHTML = subs + "<small>/" + META + "</small>";
    var nb = META <= 30 ? META : 20, lit = Math.min(nb, META <= 30 ? subs : Math.floor(pc * nb)), row = document.getElementById("kr");
    if (row.children.length !== nb) { row.innerHTML = ""; for (var i = 0; i < nb; i++) { var b = document.createElement("i"); b.style.setProperty("--k", i); row.appendChild(b); } }
    for (var j = 0; j < nb; j++) { var el = row.children[j], on = j < lit; if (on && !el.classList.contains("on") && j >= litAntes) { el.classList.remove("nw"); void el.offsetWidth; el.classList.add("nw"); } el.classList.toggle("on", on); }
    litAntes = lit;
    var falta = Math.max(0, META - subs);
    document.getElementById("kl").textContent = falta ? "faltan " + falta : "¡meta cumplida!";
    document.getElementById("ks").textContent = falta ? "¡Gracias por cada sub!" : "¡Gracias a todos! 💚";
  } else {
    document.getElementById("bn").innerHTML = num;
    document.getElementById("bf").style.width = (pc * 100).toFixed(1) + "%";
  }
  document.body.classList.toggle("done", subs >= META);
}
// +1 que flota y el número que brinca (solo en anillo y barra)
function festejo(d) {
  if (ESTILO === "texto" || !d) return;
  var el = document.getElementById(ESTILO === "anillo" ? "rn" : ESTILO === "bloques" ? "kn" : "bn");
  el.classList.remove("pop"); void el.offsetWidth; el.classList.add("pop");
  var p = document.createElement("div"); p.className = "plus"; p.textContent = (d > 0 ? "+" : "−") + Math.abs(d);
  (ESTILO === "anillo" ? document.querySelector("#ring .rw") : ESTILO === "bloques" ? document.querySelector(".bk-card") : document.getElementById("bar")).appendChild(p);
  if (ESTILO !== "anillo") { p.style.top = "8%"; p.style.left = "86%"; }
  setTimeout(function () { p.remove(); }, 1500);
}

// v76: a la vista solo cuando estás en vivo en esta plataforma (o un ratito si lo mueves desde la app sin stream).
//      Mientras estás en vivo: aparece VISIBLE s, se va DESCANSO s, y así; con cada sub nueva aparece al momento.
var vivo = null, prueba = 0, cicloT = null, visible = false, retirado = false;
function activo() { return SIEMPRE || vivo === true || Date.now() < prueba; }
function verlo(v) {
  if (v && !visible) { caja.classList.remove("enter"); void caja.offsetWidth; caja.classList.add("enter"); }
  visible = v; caja.style.opacity = v ? "1" : "0";
}
function ciclo() {
  clearTimeout(cicloT);
  if (!activo() || retirado) { verlo(false); return; }
  verlo(true);
  if (!CICLO && vivo) return;                           // siempre a la vista mientras estás en vivo
  cicloT = setTimeout(function () {
    verlo(false);
    if (activo() && CICLO && vivo) cicloT = setTimeout(ciclo, DESCANSO * 1000);   // sin stream (prueba): solo una vez
  }, VISIBLE * 1000);
}
function mostrar() { ciclo(); }
function ocultar() { retirado = true; clearTimeout(cicloT); verlo(false); }

function aplicar(t, desdeApp) {
  desglose = t;
  var n = (t && typeof t.subs === "number") ? t.subs : 0;
  var cambio = antes !== null && n !== antes;
  if (cambio) festejo(n - antes);
  antes = n;
  subs = n;
  pintar();
  if (desdeApp && !vivo) prueba = Date.now() + VISIBLE * 1000;   // sin stream, para probar: se ve un rato

  if (n < META) {
    if (completado) { completado = false; retirado = false; clearTimeout(temporizador); }
    if (cambio || desdeApp || !visible && !cicloT) mostrar();
    return;
  }

  if (!completado) {
    completado = true;
    retirado = false;
    mostrar();
    clearTimeout(temporizador);
    if (SEGUNDOS_ANTES_DE_OCULTAR > 0) temporizador = setTimeout(ocultar, Math.max(SEGUNDOS_ANTES_DE_OCULTAR, 4) * 1000);
  } else if (cambio || desdeApp) {                      // ya cumplida: la sub nueva se ve un rato y se vuelve a ir
    retirado = false; mostrar(); clearTimeout(temporizador);
    if (SEGUNDOS_ANTES_DE_OCULTAR > 0) temporizador = setTimeout(ocultar, Math.max(SEGUNDOS_ANTES_DE_OCULTAR, VISIBLE) * 1000);
  }
}
// prendiste (o apagaste) el stream en ESTA plataforma
function enVivoCambio(v) {
  if (v === vivo) return;
  var antesVivo = vivo; vivo = v;
  if (v) {                                                // se reinicia y entra
    antes = null; completado = false; retirado = false; litAntes = 0;
    if (antesVivo !== null) { subs = 0; pintar(); }
    ciclo();
  } else { clearTimeout(cicloT); if (!activo()) verlo(false); }
}

var enVivo = false;
function consultar() {
  fetch(API, { cache: "no-store" })
    .then(function (r) { return r.json(); })
    .then(function (j) {
      if (PF === "tw") {
        var t = j.tw || {};
        enVivo = !!(t.live && t.live.is_live);
        enVivoCambio(enVivo);
        aplicar(t.totals || { subs: 0 });
      } else {
        enVivo = !!(j.session && j.session.live) || !!(j.live && j.live.is_live);
        enVivoCambio(enVivo);
        aplicar(j.totals);
      }
    })
    .catch(function () {})
    .then(function () { setTimeout(consultar, (enVivo ? CADA_SEGUNDOS : CADA_SEGUNDOS_APAGADO) * 1000); });
}

// Al momento: cuando sumas o restas en la app, tu servidor se lo manda a OBS y OBS a este letrero
// (con o sin stream). Así no hace falta preguntar más seguido.
window.addEventListener("kickfeedGoal", function (e) {
  var d = e && e.detail;
  if (typeof d === "string") { try { d = JSON.parse(d); } catch (x) { d = null; } }
  if (d && typeof d.subs === "number" && (d.pf || "kick") === PF) aplicar(d, true);
});

// Tocar el letrero muestra el desglose real del servidor durante 20 segundos.
caja.addEventListener("click", function () {
  var d = desglose;
  if (ESTILO !== "texto") return;
  texto.style.fontSize = "22px";
  texto.textContent = d
    ? ("nuevas " + (d.newSubs || 0) +
       "   resubs " + (d.resubs || 0) +
       "   regaladas " + (d.gifted || 0) +
       (d.adj ? "   a mano " + (d.adj > 0 ? "+" : "") + d.adj : "") +
       "   total " + (d.subs || 0))
    : "sin datos del servidor";
  setTimeout(function () { texto.style.fontSize = ""; pintar(); }, 20000);
});

pintar();
caja.style.opacity = "0";            // hasta saber si estás en vivo
if (SIEMPRE) ciclo();
consultar();
</script>

</body>
</html>
